/* Deep Jade - personal theme for standalone HTML tools
   Dark is the default. The light (silver) version switches on automatically
   when the device is set to light mode.
   Calm option: add the attribute data-calm to the <html> tag to turn down the
   glow, switch off the sweep and remove the gloss. Nothing else changes.
   All colours live in the variables below, so a different theme is a swap of this block. */

:root {
  color-scheme: dark light;

  /* fonts */
  --font-body: "Inter Tight", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-code: ui-monospace, Consolas, monospace;
  --font-weight-body: 400;
  --font-weight-heading: 600;
  --font-weight-button: 500;
  --letter-spacing-heading: -0.01em;

  /* corners and spacing */
  --radius-card: 8px;
  --radius-button: 8px;
  --radius-input: 8px;
  --space-card-padding: 14px;
  --space-row-padding: 8px 12px;
  --space-gap: 8px;

  /* page, cards and words */
  --color-background: #000000;
  --background-page: #000000;
  --color-surface: #0E0F10;
  --background-card: #0E0F10;
  --color-surface-raised: #17191A;
  --color-text: #ECECF1;
  --color-text-muted: #A3A3AB;
  --color-edge: #34705E;
  --color-glow: #1F8A63;
  --shadow-card: inset 0 0 22px rgba(70, 170, 140, 0.22);

  /* main button (jade) */
  --color-button-text: #F2F2F2;
  --color-button-light: #176049;
  --color-button-mid: #0B4D3A;
  --color-button-dark: #04241B;
  --color-button-rim-active: #1F8A63;
  --sheen-main: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
  --shadow-button-rest: inset 0 0 16px rgba(70, 170, 140, 0.32), 0 0 10px rgba(46, 154, 120, 0.25);
  --color-edge-hover: #2E9A78;
  --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(46, 154, 120, 0.45);
  --shadow-button-active: inset 0 1px 0 rgba(31, 138, 99, 0.9), inset 0 -2px 0 rgba(31, 138, 99, 0.9), 0 0 16px rgba(31, 138, 99, 0.6);
  --sweep-duration: 1.4s;

  /* secondary button (smoky quartz with gloss) */
  --color-secondary-light: #2F2B27;
  --color-secondary-dark: #201D1A;
  --color-secondary-edge: #928982;
  --color-secondary-edge-hover: #B3AAA3;
  --sheen-secondary: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 48%);
  --shadow-secondary-rest: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  --shadow-secondary-hover: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 10px rgba(179, 170, 163, 0.3);

  /* disabled and keyboard focus (both buttons) */
  --opacity-disabled: 0.4;
  --shadow-focus: 0 0 0 2px #000000, 0 0 0 4px #F2F2F2;

  /* typing boxes */
  --color-input-background: #0A0B0C;
  --color-input-edge: #6B7278;
  --color-input-placeholder: #8A8F94;
  --color-input-edge-active: #2E9A78;
  --shadow-input-active: 0 0 0 3px rgba(46, 154, 120, 0.25), 0 0 14px rgba(31, 138, 99, 0.55), inset 0 1px 0 rgba(120, 200, 170, 0.3);

  /* messages: banner fills (same in dark and light) */
  --color-message-text: #F5F5F7;
  --color-success-top: #137A55;
  --color-success-bottom: #0F6B4A;
  --color-warning-top: #946108;
  --color-warning-bottom: #8A5A0B;
  --color-error-top: #9A2033;
  --color-error-bottom: #7F1626;

  /* messages: coloured words. ONLY for a genuine success, warning or error
     message. Never for headers or instructions (those stay grey). */
  --color-text-success: #5FCBA3;
  --color-text-warning: #E8B04A;
  --color-text-error: #FF8A8F;
}

@media (prefers-color-scheme: light) {
  :root {
    --color-background: #DEDFE3;
    --background-page: linear-gradient(160deg, #ECEDF0, #C9CBD1 55%, #DEDFE3);
    --color-surface: #E2E4E8;
    --background-card: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 50%), #E2E4E8;
    --color-surface-raised: #EDEFF2;
    --color-text: #14181A;
    --color-text-muted: #444D57;
    --color-edge: #2A7360;
    --color-glow: #2A7360;
    --shadow-card: none;

    --color-button-rim-active: #2A7360;
    --color-edge-hover: #2A7360;
    --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(42, 115, 96, 0.5);
    --shadow-button-active: inset 0 1px 0 rgba(42, 115, 96, 0.9), inset 0 -2px 0 rgba(42, 115, 96, 0.9), 0 0 14px rgba(42, 115, 96, 0.55);

    --color-secondary-edge: #635953;
    --color-secondary-edge-hover: #635953;

    --shadow-focus: 0 0 0 2px #ECEDF0, 0 0 0 4px #14181A;

    --color-input-background: #F1F2F4;
    --color-input-edge: #6F7782;
    --color-input-placeholder: #5B636D;
    --color-input-edge-active: #2A7360;
    --shadow-input-active: 0 0 0 3px rgba(42, 115, 96, 0.28), 0 0 12px rgba(42, 115, 96, 0.35), inset 0 1px 0 #FFFFFF;

    --color-text-success: #0A5A40;
    --color-text-warning: #6B4400;
    --color-text-error: #9A2033;
  }
}

/* Calm option: <html data-calm>. Quieter glow, no sweep, no gloss. */
:root[data-calm] {
  --shadow-button-rest: inset 0 0 8px rgba(70, 170, 140, 0.18), 0 0 3px rgba(46, 154, 120, 0.12);
  --sheen-main: linear-gradient(transparent, transparent);
  --sheen-secondary: linear-gradient(transparent, transparent);
  --shadow-secondary-rest: none;
}
:root[data-calm] .button::after { display: none; }

/* ---------- Component starting points (use the variables above) ---------- */

body {
  background: var(--background-page);
  color: var(--color-text);
  font-family: var(--font-body);
  font-weight: var(--font-weight-body);
}

h1, h2, h3 {
  font-weight: var(--font-weight-heading);
  letter-spacing: var(--letter-spacing-heading);
}

code, pre { font-family: var(--font-code); }

.card {
  background: var(--background-card);
  border: 1px solid var(--color-edge);
  border-radius: var(--radius-card);
  padding: var(--space-card-padding);
  box-shadow: var(--shadow-card);
}

.muted { color: var(--color-text-muted); }

.row {
  background: var(--color-surface-raised);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  margin-bottom: var(--space-gap);
}

.input {
  width: 100%;
  box-sizing: border-box;
  background: var(--color-input-background);
  color: var(--color-text);
  border: 1px solid var(--color-input-edge);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  font: inherit;
  outline: none;
}
.input::placeholder { color: var(--color-input-placeholder); }
.input:focus,
.input:not(:placeholder-shown) {
  border-color: var(--color-input-edge-active);
  box-shadow: var(--shadow-input-active);
}

/* ---------- Buttons ---------- */

.button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  color: var(--color-button-text);
  font: inherit;
  font-weight: var(--font-weight-button);
  padding: 7px 20px;
  border-radius: var(--radius-button);
  border: 1px solid var(--color-edge);
  background:
    var(--sheen-main),
    radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-rest);
}
.button--secondary {
  border-color: var(--color-secondary-edge);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-rest);
}

/* Sweep: a band of light that crosses the button when it is tapped */
.button::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 45%;
  transform: translateX(-130%) skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
  pointer-events: none;
}
.button.is-sweeping::after { animation: sweep var(--sweep-duration) ease-out; }
@keyframes sweep {
  from { transform: translateX(-130%) skewX(-20deg); }
  to   { transform: translateX(330%) skewX(-20deg); }
}
@media (prefers-reduced-motion: reduce) {
  .button.is-sweeping::after { animation: none; }
}

/* Hover (laptop or mouse only). Not applied to disabled buttons. */
@media (hover: hover) {
  .button:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-edge-hover);
    box-shadow: var(--shadow-button-hover);
  }
  .button--secondary:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-secondary-edge-hover);
    box-shadow: var(--shadow-secondary-hover);
  }
}

/* Pressed. The standing diagonal shine on the main button is removed so it
   never stacks with the sweep (stacked, the button words would fail contrast). */
.button:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.is-sweeping {
  border-color: var(--color-button-rim-active);
  background: radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-active);
}
.button.button--secondary:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.button--secondary.is-sweeping {
  border-color: var(--color-secondary-edge-hover);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-hover);
}

/* Keyboard focus: two-tone ring that shows on any background */
.button:focus-visible {
  outline: 2px solid transparent; /* keeps a visible outline in forced-colours mode */
  box-shadow: var(--shadow-focus);
}

/* Disabled: faded, no hover, no press, no sweep */
.button:disabled,
.button[aria-disabled="true"] {
  opacity: var(--opacity-disabled);
  cursor: not-allowed;
}
.button:disabled::after,
.button[aria-disabled="true"]::after { display: none; }

/* ---------- Messages ---------- */

.message {
  display: flex;
  gap: var(--space-gap);
  align-items: center;
  color: var(--color-message-text);
  padding: var(--space-row-padding);
  border-radius: var(--radius-card);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
}

<script>
// Deep Jade button sweep, hold version (deep-jade-theme.md, section 4): a tap starts the sweep and the action
// runs SWEEP_HOLD_MS later. This page redraws on a tap, so the hold version is needed. Set it to 0 to remove the pause.
var SWEEP_HOLD_MS = 240;
document.addEventListener('click', function (e) {
  var b = e.target.closest('.button');
  if (!b) return;
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  if (b.__sweepReplay) { b.__sweepReplay = false; return; }          // the delayed repeat of the tap: let it through
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.stopImmediatePropagation();                                       // hold the real action back for a moment
  e.preventDefault();
  if (b.__sweepPending) return;                                       // ignore taps while one is waiting
  b.__sweepPending = true;
  b.classList.remove('is-sweeping');
  void b.offsetWidth;                                                 // restart the animation
  b.classList.add('is-sweeping');
  setTimeout(function () {
    b.__sweepPending = false;
    b.__sweepReplay = true;
    b.click();                                                        // now run the button's real action
  }, SWEEP_HOLD_MS);
  setTimeout(function () { b.classList.remove('is-sweeping'); }, 1500);
}, true);
</script>

  return { n: all.length, nailed: c(all, 'nailed'), close: c(all, 'close'), missed: c(all, 'missed'),
    r5: last5.length, n5: c(last5, 'nailed'), m5: c(last5, 'missed'), score: score, last: all.length ? all[all.length - 1] : null, all: all };
}
function currentLessonId() {

  }
  for (var i = 0; i < LESSONS.length; i++) {

/* ---------- sound, buzz, wake lock ---------- */
function beep(count, freq, ms) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (var i = 0; i < count; i++) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * (ms + 120) / 1000;
      o.frequency.value = freq; o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.start(t); o.stop(t + ms / 1000 + 0.05);
    }
  } catch (e) {}
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function requestWake() {
  if (!('wakeLock' in navigator)) { updateWake(); return; }
  navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; updateWake(); }); updateWake(); }).catch(function () { wake = null; updateWake(); });
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
function updateWake() { var e = $('#wakeStatus'); if (e) e.textContent = wakeText(); }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && drill && !wake) requestWake(); if (drill && drill.running) tick(); });

/* ---------- drill timer ---------- */
function stopDrillTimers() { clearInterval(tickH); tickH = null; releaseWake(); drill = null; }
function startDrill(kind, id) {
  var items = kind === 'warm' ? buildWarmup().map(function (x) { return x.id; }) : [];
  var total = Math.round((Number(S.setup.minutes) || 5) * 60);
  drill = { kind: kind, id: id, items: items, idx: 0, total: total, remain: total, running: false, endAt: 0, count: 0, note: '', stage: 0, finished: false, lastId: null };
  view = { n: 'drill' };
  render(true);
  requestWake();
}
function tStart() {
  var d = drill; if (!d || d.finished) return;
  if (d.running) { tick(); d.running = false; clearInterval(tickH); tickH = null; render(); return; }
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
  d.running = true; d.endAt = Date.now() + d.remain * 1000;
  clearInterval(tickH); tickH = setInterval(tick, 250);
  if (!wake) requestWake();
  render();
}
function tick() {
  var d = drill; if (!d || !d.running) return;
  d.remain = Math.max(0, Math.round((d.endAt - Date.now()) / 1000));
  var c = $('#clock'); if (c) c.textContent = clockText(d.remain);
  var warnAt = d.total > 180 ? 60 : 30, changed = false;
  if (d.remain <= warnAt && d.stage < 1 && d.remain > 0) { d.stage = 1; changed = true; beep(2, 880, 220); buzz([200, 100, 200]); }
  if (d.remain <= 10 && d.stage < 2 && d.remain > 0) { d.stage = 2; changed = true; beep(3, 988, 160); buzz([150, 80, 150, 80, 150]); }
  if (d.remain <= 0) { d.running = false; d.finished = true; clearInterval(tickH); tickH = null; changed = true; beep(2, 660, 700); buzz([600, 200, 600, 200, 600]); }
  if (changed) render();
}
function tReset() {
  var d = drill; if (!d) return;
  clearInterval(tickH); tickH = null; d.running = false; d.finished = false; d.remain = d.total; d.stage = 0; render();
}
function rate(r) {
  var d = drill; if (!d || (d.kind === 'warm' && d.idx >= d.items.length)) return;
  var lid = d.kind === 'warm' ? d.items[d.idx] : d.id, a = { id: uid(), t: new Date().toISOString(), lesson: lid, rating: r, note: (d.note || '').trim(), kind: d.kind };
  S.attempts.push(a); save(); d.count++; d.note = ''; d.lastId = a.id;

}
function undo() {
  var d = drill; if (!d || !d.lastId) return;
  var i = S.attempts.map(function (a) { return a.id; }).indexOf(d.lastId);
  if (i >= 0) { S.attempts.splice(i, 1); save(); d.count = Math.max(0, d.count - 1); if (d.kind === 'warm') d.idx = Math.max(0, d.idx - 1); }
  d.lastId = null; render();
}

/* ---------- backup and restore ---------- */
function backup() {
  try {
    var data = { app: 'drone-tutor', version: 1, exportedAt: new Date().toISOString(), state: S };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var name = 'drone-tutor-backup-' + dayKey(Date.now()) + '.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    S.lastBackup = new Date().toISOString(); save();
    pmsg = { type: 'success', word: 'Saved', text: 'Your backup file is called <b>' + name + '</b>. On Android Chrome it normally goes to your Downloads folder. Move a copy somewhere safe.' };
  } catch (e) {

  render();
}
function restoreFrom(text) {
  var o;
  try { o = JSON.parse(text); } catch (e) { o = null; }
  if (!o || o.app !== 'drone-tutor' || !o.state || !Array.isArray(o.state.attempts) || !o.state.setup) {
    pmsg = { type: 'error', word: 'Error', text: 'That file isn’t a Drone Tutor backup, so nothing was changed.' }; render(); return;
  }
  var n = o.state.attempts.length;
  if (!confirm('Replace the progress on this phone with the backup from ' + fmtDay(o.exportedAt || Date.now()) + ' (' + n + ' attempts)? What is here now will be lost.')) return;
  S = merge(o.state); save();
  view = { n: 'progress' };
  pmsg = { type: 'success', word: 'Restored', text: 'Progress loaded from the backup: ' + n + ' attempts, ' + doneCount() + ' of 12 lessons done.' };
  render(true);
}

/* ---------- actions ---------- */
function closeSafety() {
  var wasFirst = !S.safetySeen;
  showSafety = false; S.safetySeen = true; save();
  var p = pendingAfterSafety; pendingAfterSafety = null;
  if (p) p(); else render();
}
function openLesson(id) {
  var go2 = function () { go('lesson', id); };
  if (!S.safetySeen) { pendingAfterSafety = go2; showSafety = true; render(); } else go2();
}

var ACTS = {
  go: function (t) { go(t.dataset.arg); },
  open: function (t) { openLesson(Number(t.dataset.arg)); },
  safety: function () { showSafety = true; render(); },
  closeSafety: closeSafety,
  unlock: function (t) { S.unlocked[Number(t.dataset.arg)] = true; save(); render(); },
  toggleDone: function (t) {
    var id = Number(t.dataset.arg);
    if (S.done[id]) { delete S.done[id]; flash = null; } else { S.done[id] = true; flash = { type: 'success', word: 'Done', text: 'Lesson ' + id + ' marked done.' + (id < 12 ? ' Lesson ' + (id + 1) + ' is now open.' : ' That’s all 12.') }; }
    save(); go('path');
  },
  drill: function (t) {
    var a = t.dataset.arg;
    if (a === 'warm') { startDrill('warm', null); return; }
    var id = Number(a);
    if (!isUnlocked(id)) { flash = { type: 'warning', word: 'Locked', text: 'Unlock this lesson first if you want to fly it now.' }; render(true); return; }
    if (!S.safetySeen) { pendingAfterSafety = function () { startDrill('lesson', id); }; showSafety = true; render(); return; }
    startDrill('lesson', id);
  },
  leaveDrill: function () {
    if (drill && drill.running && !confirm('The timer is running. Leave the drill and stop it?')) return;
    var id = drill && drill.kind === 'lesson' ? drill.id : null;
    stopDrillTimers();
    if (id) go('lesson', id); else go('path');
  },
  tStart: tStart, tReset: tReset,
  rate: function (t) { rate(t.dataset.arg); },
  undo: undo,
  testAlert: function () { beep(2, 880, 220); buzz([200, 100, 200]); },
  mode: function (t) { draft[t.dataset.which] = Number(t.dataset.arg); render(); },
  feat: function (t) { draft.f[t.dataset.arg] = !draft.f[t.dataset.arg]; render(); },
  room: function (t) { draft.room = t.dataset.arg; render(); },
  saveSetup: function () {
    var m = parseFloat(draft.minutes);
    if (!(m >= 1 && m <= 60)) { flash = { type: 'error', word: 'Error', text: 'Battery minutes needs to be a number between 1 and 60.' }; render(true); return; }
    var first = !S.setup.done;
    draft.minutes = m; draft.done = true; S.setup = clone(draft); save();
    flash = { type: 'success', word: 'Saved', text: 'Setup saved. Lessons now fit your ticks and room.' };
    if (first && !S.safetySeen) { pendingAfterSafety = function () { go('path'); }; showSafety = true; render(); }
    else go('path');
  },
  histAll: function () { histAll = true; render(); },
  resetProgress: function () {
    var n = S.attempts.length, d = doneCount();
    if (!confirm('Erase all ' + n + ' attempts and ' + d + ' done lessons on this phone? Your setup is kept. This can’t be undone (unless you saved a backup file).')) return;
    S.attempts = []; S.done = {}; S.unlocked = {}; histAll = false; save();
    flash = { type: 'success', word: 'Reset', text: 'Progress erased. You’re back at lesson 1.' };
    go('path');
  },
  backup: backup,
  pickfile: function () { $('#restoreFile').click(); }
};
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var f = ACTS[t.dataset.act]; if (f) f(t);
});
document.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset && t.dataset.f; if (!k) return;
  if (k === 'note' && drill) drill.note = t.value;
  else if (draft && (k === 'minutes' || k === 'stopHS' || k === 'stopMini')) draft[k] = t.value;
});
$('#restoreFile').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  var r = new FileReader(); r.onload = function () { restoreFrom(String(r.result)); }; r.onerror = function () { pmsg = { type: 'error', word: 'Error', text: 'The file couldn’t be read.' }; render(); };
  r.readAsText(file);
});

/* offline copy: sw.js sits next to this page and saves it on the phone */
function swDone(s) { swState = s; if (view.n === 'setup') render(); }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
    .then(function () { return caches.match('./index.html'); })
    .then(function (hit) { swDone(hit ? 'ready' : 'none'); })
    .catch(function () { swDone('none'); });
} else swState = 'none';

render();
})();
</script>
</body>
