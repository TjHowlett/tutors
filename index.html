<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%93</text></svg>">
<style>
  :root {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --panel-alt: #f0ede5;
    --border: #d8d3c7;
    --text: #232323;
    --text-dim: #6b6b6b;
    --accent: #b5772e;
    --accent-dim: #ecd9bb;
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 19px;
    line-height: 1.5;
  }
  header {
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    padding: 14px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--accent); }
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px;
  }
  .tool-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tool-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    text-decoration: none;
    color: var(--text);
  }
  .tool-card:hover {
    border-color: var(--accent);
  }
  .tool-card .tname {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>My <span>Tutors</span></h1>
</header>

<main>
  <div class="tool-list">
    <a class="tool-card" href="drawing/">
      <div class="tname">Drawing Tutor</div>
    </a>
    <a class="tool-card" href="blues-piano/">
      <div class="tname">Blues Piano Tutor</div>
    </a>
    <a class="tool-card" href="morning-exercise-routine/">
      <div class="tname">Morning Exercise Routine</div>
    </a>
  </div>
</main>

</body>
</html>
