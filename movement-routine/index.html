/* ============================================================
   Deep Jade theme - pasted unchanged from deep-jade-theme.md, section 3
   ============================================================ */
/* Deep Jade - personal theme for TJ's HTML tools
   Dark is the default. The light (silver) version switches on automatically
   when the device is set to light mode.
   Calm option: add the attribute data-calm to the <html> tag to turn down the
   glow, switch off the sweep and remove the gloss. Nothing else changes. */

:root {
  color-scheme: dark light;

  /* fonts */
  --font-body: "Inter Tight", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-code: ui-monospace, Consolas, monospace;
  --font-weight-body: 400;
  --font-weight-heading: 600;
  --font-weight-button: 500;
  --letter-spacing-heading: -0.01em;

  /* corners and spacing */
  --radius-card: 8px;
  --radius-button: 8px;
  --radius-input: 8px;
  --space-card-padding: 14px;
  --space-row-padding: 8px 12px;
  --space-gap: 8px;

  /* page, cards and words */
  --color-background: #000000;
  --background-page: #000000;
  --color-surface: #0E0F10;
  --background-card: #0E0F10;
  --color-surface-raised: #17191A;
  --color-text: #ECECF1;
  --color-text-muted: #A3A3AB;
  --color-edge: #34705E;
  --color-glow: #1F8A63;
  --shadow-card: inset 0 0 22px rgba(70, 170, 140, 0.22);

  /* main button (jade) */
  --color-button-text: #F2F2F2;
  --color-button-light: #176049;
  --color-button-mid: #0B4D3A;
  --color-button-dark: #04241B;
  --color-button-rim-active: #1F8A63;
  --sheen-main: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
  --shadow-button-rest: inset 0 0 16px rgba(70, 170, 140, 0.32), 0 0 10px rgba(46, 154, 120, 0.25);
  --color-edge-hover: #2E9A78;
  --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(46, 154, 120, 0.45);
  --shadow-button-active: inset 0 1px 0 rgba(31, 138, 99, 0.9), inset 0 -2px 0 rgba(31, 138, 99, 0.9), 0 0 16px rgba(31, 138, 99, 0.6);
  --sweep-duration: 1.4s;

  /* secondary button (smoky quartz with gloss) */
  --color-secondary-light: #2F2B27;
  --color-secondary-dark: #201D1A;
  --color-secondary-edge: #928982;
  --color-secondary-edge-hover: #B3AAA3;
  --sheen-secondary: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 48%);
  --shadow-secondary-rest: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  --shadow-secondary-hover: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 10px rgba(179, 170, 163, 0.3);

  /* disabled and keyboard focus (both buttons) */
  --opacity-disabled: 0.4;
  --shadow-focus: 0 0 0 2px #000000, 0 0 0 4px #F2F2F2;

  /* typing boxes */
  --color-input-background: #0A0B0C;
  --color-input-edge: #6B7278;
  --color-input-placeholder: #8A8F94;
  --color-input-edge-active: #2E9A78;
  --shadow-input-active: 0 0 0 3px rgba(46, 154, 120, 0.25), 0 0 14px rgba(31, 138, 99, 0.55), inset 0 1px 0 rgba(120, 200, 170, 0.3);

  /* messages: banner fills (same in dark and light) */
  --color-message-text: #F5F5F7;
  --color-success-top: #137A55;
  --color-success-bottom: #0F6B4A;
  --color-warning-top: #946108;
  --color-warning-bottom: #8A5A0B;
  --color-error-top: #9A2033;
  --color-error-bottom: #7F1626;

  /* messages: coloured words. ONLY for a genuine success, warning or error
     message. Never for headers or instructions (those stay grey). */
  --color-text-success: #5FCBA3;
  --color-text-warning: #E8B04A;
  --color-text-error: #FF8A8F;
}

@media (prefers-color-scheme: light) {
  :root {
    --color-background: #DEDFE3;
    --background-page: linear-gradient(160deg, #ECEDF0, #C9CBD1 55%, #DEDFE3);
    --color-surface: #E2E4E8;
    --background-card: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 50%), #E2E4E8;
    --color-surface-raised: #EDEFF2;
    --color-text: #14181A;
    --color-text-muted: #444D57;
    --color-edge: #2A7360;
    --color-glow: #2A7360;
    --shadow-card: none;

    --color-button-rim-active: #2A7360;
    --color-edge-hover: #2A7360;
    --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(42, 115, 96, 0.5);
    --shadow-button-active: inset 0 1px 0 rgba(42, 115, 96, 0.9), inset 0 -2px 0 rgba(42, 115, 96, 0.9), 0 0 14px rgba(42, 115, 96, 0.55);

    --color-secondary-edge: #635953;
    --color-secondary-edge-hover: #635953;

    --shadow-focus: 0 0 0 2px #ECEDF0, 0 0 0 4px #14181A;

    --color-input-background: #F1F2F4;
    --color-input-edge: #6F7782;
    --color-input-placeholder: #5B636D;
    --color-input-edge-active: #2A7360;
    --shadow-input-active: 0 0 0 3px rgba(42, 115, 96, 0.28), 0 0 12px rgba(42, 115, 96, 0.35), inset 0 1px 0 #FFFFFF;

    --color-text-success: #0A5A40;
    --color-text-warning: #6B4400;
    --color-text-error: #9A2033;
  }
}

/* Calm option: <html data-calm>. Quieter glow, no sweep, no gloss. */
:root[data-calm] {
  --shadow-button-rest: inset 0 0 8px rgba(70, 170, 140, 0.18), 0 0 3px rgba(46, 154, 120, 0.12);
  --sheen-main: linear-gradient(transparent, transparent);
  --sheen-secondary: linear-gradient(transparent, transparent);
  --shadow-secondary-rest: none;
}
:root[data-calm] .button::after { display: none; }

/* ---------- Component starting points (use the variables above) ---------- */

body {
  background: var(--background-page);
  color: var(--color-text);
  font-family: var(--font-body);
  font-weight: var(--font-weight-body);
}

h1, h2, h3 {
  font-weight: var(--font-weight-heading);
  letter-spacing: var(--letter-spacing-heading);
}

code, pre { font-family: var(--font-code); }

.card {
  background: var(--background-card);
  border: 1px solid var(--color-edge);
  border-radius: var(--radius-card);
  padding: var(--space-card-padding);
  box-shadow: var(--shadow-card);
}

.muted { color: var(--color-text-muted); }

.row {
  background: var(--color-surface-raised);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  margin-bottom: var(--space-gap);
}

.input {
  width: 100%;
  box-sizing: border-box;
  background: var(--color-input-background);
  color: var(--color-text);
  border: 1px solid var(--color-input-edge);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  font: inherit;
  outline: none;
}
.input::placeholder { color: var(--color-input-placeholder); }
.input:focus,
.input:not(:placeholder-shown) {
  border-color: var(--color-input-edge-active);
  box-shadow: var(--shadow-input-active);
}

/* ---------- Buttons ---------- */

.button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  color: var(--color-button-text);
  font: inherit;
  font-weight: var(--font-weight-button);
  padding: 7px 20px;
  border-radius: var(--radius-button);
  border: 1px solid var(--color-edge);
  background:
    var(--sheen-main),
    radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-rest);
}
.button--secondary {
  border-color: var(--color-secondary-edge);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-rest);
}

/* Sweep: a band of light that crosses the button when it is tapped */
.button::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 45%;
  transform: translateX(-130%) skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
  pointer-events: none;
}
.button.is-sweeping::after { animation: sweep var(--sweep-duration) ease-out; }
@keyframes sweep {
  from { transform: translateX(-130%) skewX(-20deg); }
  to   { transform: translateX(330%) skewX(-20deg); }
}
@media (prefers-reduced-motion: reduce) {
  .button.is-sweeping::after { animation: none; }
}

/* Hover (laptop or mouse only). Not applied to disabled buttons. */
@media (hover: hover) {
  .button:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-edge-hover);
    box-shadow: var(--shadow-button-hover);
  }
  .button--secondary:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-secondary-edge-hover);
    box-shadow: var(--shadow-secondary-hover);
  }
}

/* Pressed. The standing diagonal shine on the main button is removed so it
   never stacks with the sweep (stacked, the button words would fail contrast). */
.button:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.is-sweeping {
  border-color: var(--color-button-rim-active);
  background: radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-active);
}
.button.button--secondary:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.button--secondary.is-sweeping {
  border-color: var(--color-secondary-edge-hover);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-hover);
}

/* Keyboard focus: two-tone ring that shows on any background */
.button:focus-visible {
  outline: 2px solid transparent; /* keeps a visible outline in forced-colours mode */
  box-shadow: var(--shadow-focus);
}

/* Disabled: faded, no hover, no press, no sweep */
.button:disabled,
.button[aria-disabled="true"] {
  opacity: var(--opacity-disabled);
  cursor: not-allowed;
}
.button:disabled::after,
.button[aria-disabled="true"]::after { display: none; }

/* ---------- Messages ---------- */

.message {
  display: flex;
  gap: var(--space-gap);
  align-items: center;
  color: var(--color-message-text);
  padding: var(--space-row-padding);
  border-radius: var(--radius-card);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
}
.message--success { background: linear-gradient(180deg, var(--color-success-top), var(--color-success-bottom)); }
.message--warning { background: linear-gradient(180deg, var(--color-warning-top), var(--color-warning-bottom)); }
.message--error   { background: linear-gradient(180deg, var(--color-error-top), var(--color-error-bottom)); }

/* Coloured words: only for a genuine success, warning or error message.
   Headers and instructions stay grey (.muted). */
.text-success { color: var(--color-text-success); }
.text-warning { color: var(--color-text-warning); }
.text-error   { color: var(--color-text-error); }

  :root {
    /* the tool's own colour names, pointed at the theme (they are used all through the script and the figures) */
    --ink: var(--color-text);
    --ink-soft: var(--color-text-muted);
    --panel: var(--color-surface);
    --line: var(--color-edge);
    --amber: var(--color-edge-hover);   /* timer ring, progress dots, streak flame */
    --accent: var(--color-edge-hover);  /* the moving limb in the exercise figures */
    --sw: 3.4px;
    --pace: 1;
  }

  /* ============================================================
     Mary's movement routine styles
     Layout, sizes and structure are the original tool's. Colours, corners and
     gaps come from the Deep Jade variables above.
     ============================================================ */
  html, body { margin: 0; padding: 0; }
  html { background: var(--color-background); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { display: flex; justify-content: center; min-height: 100vh; }
  #app { width: 100%; max-width: 420px; padding: 28px 22px 40px; box-sizing: border-box; }
  /* the old serif title font is gone; titles use the theme's heading weight (inline weights are overridden on purpose) */
  .serif { font-family: var(--font-body); font-weight: var(--font-weight-heading) !important; letter-spacing: var(--letter-spacing-heading); }
  button { font-family: inherit; }
  .row-center { display: flex; align-items: center; justify-content: center; }
  .col-center { display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* buttons: the theme's .button look, with the tool's sizes kept */
  .button { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; font-size: 14px; }
  .button.icon-btn { width: 32px; height: 32px; padding: 0; border-radius: 50%; justify-content: center; }
  .button.start-btn { margin-top: 18px; width: 156px; height: 156px; padding: 0; border-radius: 50%; flex-direction: column; justify-content: center; gap: 6px; }
  .btn-link { background: none; border: none; color: var(--color-text); font-size: 12px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--color-edge-hover); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .btn-link:focus-visible { outline: 2px solid transparent; box-shadow: var(--shadow-focus); }
  .top-bar { display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dot { height: 6px; border-radius: 3px; background: var(--color-input-edge); transition: all .25s ease; }
  .dot.done { background: var(--amber); }
  .dot.current { width: 16px; background: var(--amber); }
  .dot:not(.current) { width: 6px; }
  .anim-box {
    background: var(--background-card); border: 1px solid var(--color-edge); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    height: 190px; display: flex; align-items: center; justify-content: center;
  }
  .anim-box svg { width: 190px; height: auto; display: block; }
  .button.feedback-btn { text-align: left; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 14px 16px; }
  .feedback-btn .label { font-size: 15px; font-weight: 500; }
  .feedback-btn .sub, .pick-text .sub { font-size: 12px; color: var(--color-button-text); opacity: .8; }

  /* typing boxes: the theme's .input look */
  .input.mono { min-height: 90px; font-family: var(--font-code); font-size: 11px; }

  /* per-exercise feedback and dropped-exercises screens */
  .button.pick-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; font-size: 15px; }
  .pick-row.selected { border-color: var(--color-edge-hover); box-shadow: var(--shadow-button-hover); }
  .pick-box {
    flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--color-secondary-edge-hover);
    display: flex; align-items: center; justify-content: center;
  }
  .pick-row.selected .pick-box { background: var(--color-button-mid); border-color: var(--color-edge-hover); }
  .pick-text { display: flex; flex-direction: column; gap: 2px; }

<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Exercise data
  ---------------------------------------------------------------- */
  var SAFETY_SHORT = "Mild stretch, not joint pain. Ease off or skip if it increases your pain, causes tingling, or sends pain down an arm or leg.";
  var SAFETY_FULL = "Feel a mild stretch or gentle effort, never pain. Ease off or skip a move if it increases your usual pain, causes tingling or numbness, or sends pain down an arm or leg. Don't force the range or finish the timer through symptoms. Symptoms should settle afterwards and should not be worse the next morning.";
  var STOP_SIGNS = [
    "Chest pain or pressure: stop and get it checked before you start again. Call 000 for severe chest pain or trouble breathing.",
    "Breathlessness that is out of proportion to these gentle moves: stop, sit down and get medical advice.",
    "Dizziness or feeling faint: stop and sit down. If it happens again, see your GP before you restart.",
    "Pain, swelling, warmth or redness in one calf or leg: see a doctor straight away. Call 000 if you also have chest pain or trouble breathing.",
    "Any new swelling in an arm or leg: see your GP."
  ];

  // The routine is fixed: the same moves in the same order every day. "where"
  // groups them on the All exercises screen. Stretches keep their hold time
  // (per side for the two-sided ones) in saved data under holdKey.
  var EXERCISES = [
    { id: "breathopen", name: "Slow belly breathing", where: "Seated", duration: 45,
      guidance: "Slow, easy breaths. Let your belly widen as you breathe in.",
      note: "Sit tall on a firm chair without arms, feet flat on the floor. If your feet don't reach, use a better-fitting chair or put something stable under them. No big breaths and no holding your breath.",
      cue: "Breathe out a little longer than you breathe in.", anim: "seatbreath" },
    { id: "anklepump", name: "Ankle pumps and circles", where: "Seated", duration: 60,
      guidance: "Pump your ankles up and down, then make small circles",
      note: "Keep your heel on the floor for the pumps. For the circles, lift one foot just clear of the floor. Easy, steady movements.",
      cue: "Smooth and rhythmic, never forced.", anim: "anklepump" },
    { id: "headturn", name: "Gentle head turns and shoulder circles", where: "Seated", duration: 30,
      guidance: "Small head turns and nods, then easy shoulder circles",
      note: "Turn to each side, then nod a little. No full head circles. Stay inside a comfortable range.",
      cue: "Keep your shoulders relaxed.", anim: "neckturn" },
    { id: "seatcatcow", name: "Seated cat-cow", where: "Seated", duration: 40,
      guidance: "Round your back a little, then lift your chest a little",
      note: "Hands on your thighs and both feet on the floor. Keep it small and slow. Don't arch your back or tip your head back.",
      cue: "Breathe in as you lift, out as you round.", anim: "seatcatcow" },
    { id: "seatrow", name: "Seated reach and row", where: "Seated", duration: 40,
      guidance: "Reach forward, bend your elbows back, open and close your hands",
      note: "Reach to about chest height, then bend your elbows and draw them back past your sides. Open and close your hands gently as you go. No weights.",
      cue: "Keep your shoulders down and relaxed.", anim: "seatrow" },
    { id: "seatsidereach", name: "Seated side reach", where: "Seated",
      holdKey: "seatsidereach", sideSwap: true, sideWord: "side",
      note: "Sit tall with both hips on the seat and one hand resting on your thigh. Reach the other arm up and slightly out to the side, not down toward the floor. Swap sides when the timer pauses. Stop if your shoulder pinches.",
      cue: "Keep both sitting bones on the seat.", anim: "seatsidereach" },
    { id: "seatchest", name: "Seated chest opening", where: "Seated",
      holdKey: "seatchest",
      note: "Elbows low and bent by your sides. Gently draw your elbows back and open your chest, without arching your back.",
      cue: "Keep your shoulders down and your neck relaxed.", anim: "seatchest" },
    { id: "seatknee", name: "Seated knee straightening", where: "Seated", duration: 45,
      guidance: "Straighten one knee, lower it, then the other",
      note: "Straighten each knee until it's nearly straight, but don't lock it. Keep your back upright and your thighs on the seat. No need to hold at the top.",
      cue: "Slow and smooth, alternating legs.", anim: "seatknee" },
    { id: "chairhamstring", name: "Seated hamstring stretch", where: "Seated",
      holdKey: "chairhamstring", sideSwap: true, sideWord: "leg",
      note: "Sit near the front of a firm chair with the other foot flat on the floor. Straighten one leg with the heel on the floor and a slight bend in the knee. Keep your back long and hinge forward a little from the hips. Don't reach for your toes. Swap legs when the timer pauses.",
      cue: "A mild pull behind the thigh is fine. Stop for tingling or pain behind the knee.", anim: "hamstring_chair" },
    { id: "armcircle", name: "Arm circles", where: "Standing", duration: 30,
      guidance: "Small circles, forward then reverse",
      note: "Stand up slowly and pause with a hand on the counter or wall first. Keep the circles small and your arms below shoulder height.",
      cue: "Keep your shoulders relaxed.", anim: "armcircle" },
    { id: "heelraise", name: "Heel raises", where: "Standing", duration: 30,
      guidance: "About 6 slow raises, then rest",
      note: "Hold the counter with one or both hands. Rise only as high as feels controlled and lower slowly. No rocking or bouncing. Rest for the rest of the time.",
      cue: "Slow up, slower down.", anim: "calfraise" },
    { id: "hipflexor", name: "Hip flexor stretch", where: "Standing",
      holdKey: "hipflexor", sideSwap: true, sideWord: "side",
      note: "Hold the counter before you step. Take a short step back, with your feet on two separate lines like train tracks, not in a single line. Keep your body upright, soften your back knee, tuck your pelvis a little and lean forward only slightly. Swap sides when the timer pauses.",
      cue: "Feel it at the front of the hip. Don't arch your back.", anim: "hipflexor" },
    { id: "wallcalf", name: "Wall calf stretch", where: "Standing",
      holdKey: "wallcalf", sideSwap: true, sideWord: "leg",
      note: "Hands on the wall at about shoulder height. Take a short step back with the heel down and the back knee straight but not locked. Move closer or shorten your step if your heel lifts. Swap legs when the timer pauses.",
      cue: "Keep the back heel on the floor.", anim: "wallcalf" },
    { id: "crossshoulder", name: "Cross-body shoulder stretch", where: "Standing",
      holdKey: "crossshoulder", sideSwap: true, sideWord: "arm",
      note: "Bring one arm across your chest, below shoulder height, and support it at the upper arm. Don't pull on the elbow or shrug. Skip it if it pinches. Swap arms when the timer pauses.",
      cue: "Keep the shoulder of the stretching arm relaxed.", anim: "crossshoulder" },
    { id: "breathclose", name: "Slow breathing", where: "Standing", duration: 45,
      guidance: "Slow, easy breaths, sitting or standing",
      note: "Stand with both feet planted and your knees soft, or sit down if you feel unsteady. Breathe gently rather than as deeply as you can.",
      cue: "Let your shoulders drop as you breathe out.", anim: "seatbreath" }
  ];

  var EXERCISE_BY_ID = {};
  EXERCISES.forEach(function (e) { EXERCISE_BY_ID[e.id] = e; });
  var activeSetLetter = "R"; // history marker for this routine
  var activeExercises = [];

  var READY_SECONDS = 10; // the "Get ready" countdown before the first exercise
  var REST_SECONDS = 15; // default rest between moves; the saved setting is state.restSeconds
  var REST_MIN = 10, REST_MAX = 30;
  var HOLD_MIN = 15, HOLD_MAX = 30, HOLD_DEFAULT = 20; // stretch holds, in seconds per side
  var STORAGE_KEY = "mary-routine-state";
  // Saved progress. There are no difficulty steps in this app, so levels stays
  // empty. holds is seconds per side for the two-sided stretches. dropped lists
  // exercises taken out after a "Felt pain" tick. painAt records the hold each
  // dropped stretch was on when the pain was felt (it is removed on Put back;
  // the history keeps its own record).
  var DEFAULT_STATE = {
    levels: {},
    holds: { seatsidereach: 20, seatchest: 20, chairhamstring: 20, hipflexor: 20, wallcalf: 20, crossshoulder: 20 },
    dropped: [],
    restSeconds: 15,
    painAt: {},
    history: []
  };

  /* ---------------------------------------------------------------
     Storage
  ---------------------------------------------------------------- */
  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      return {
        levels: Object.assign({}, DEFAULT_STATE.levels, parsed.levels),
        holds: Object.assign({}, DEFAULT_STATE.holds, parsed.holds),
        dropped: Array.isArray(parsed.dropped) ? parsed.dropped : [],
        restSeconds: typeof parsed.restSeconds === "number" ? parsed.restSeconds : DEFAULT_STATE.restSeconds,
        painAt: parsed.painAt && typeof parsed.painAt === "object" ? parsed.painAt : {},
        history: parsed.history || []
      };
    } catch (e) {
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }
  function saveState(s) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---------------------------------------------------------------
     Helpers
  ---------------------------------------------------------------- */
  function localDateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function todayStr() { return localDateKey(new Date()); }

  function computeStreak(history) {
    if (!history.length) return 0;
    var dates = {};
    history.forEach(function (h) { dates[h.date] = true; });
    var streak = 0;
    var cursor = new Date();
    if (!dates[todayStr()]) cursor.setDate(cursor.getDate() - 1);
    while (true) {
      var key = localDateKey(cursor);
      if (dates[key]) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }
    return streak;
  }

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  // 790 -> "13 min 10 s", 780 -> "13 min", 45 -> "45 s"
  function formatDuration(sec) {
    var m = Math.floor(sec / 60), r = sec % 60;
    return (m ? m + " min" : "") + (m && r ? " " : "") + (r || !m ? r + " s" : "");
  }

  // Rest between moves: the saved setting, kept inside 10-30s.
  function getRestSeconds() {
    var v = state && typeof state.restSeconds === "number" ? state.restSeconds : REST_SECONDS;
    return clamp(v, REST_MIN, REST_MAX);
  }

  // Can this exercise move in this direction? Warm-ups have no steps, so
  // "easy" and "hard" don't apply to them. Stretches move in 5s hold steps.
  function canMove(ex, kind) {
    if (kind === "pain") return true;
    var delta = kind === "easy" ? 1 : -1;
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      return delta > 0 ? lvl < ex.levels.length - 1 : lvl > 0;
    }
    if (ex.holdKey) {
      var h = state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : HOLD_DEFAULT;
      return delta > 0 ? h < HOLD_MAX : h > HOLD_MIN;
    }
    return false;
  }
  function hasSteps(ex) { return !!(ex.levels || ex.holdKey); }

  // Applies one kind of feedback ("easy" | "hard" | "pain") to the exercises
  // ticked by id. Only those exercises change; everything else stays put.
  // "Felt pain" always wins: if the exercise was already adjusted this session,
  // its hold goes back to what it was when the session started (startHolds), so
  // the hold on record is the one it was actually on when the pain was felt.
  function applyPick(state, kind, ids, exerciseSet, startHolds) {
    var next = {
      levels: Object.assign({}, state.levels),
      holds: Object.assign({}, state.holds),
      dropped: state.dropped.slice(),
      painAt: Object.assign({}, state.painAt)
    };
    var changed = [];
    exerciseSet.forEach(function (ex) {
      if (ids.indexOf(ex.id) < 0) return;
      if (kind === "pain") {
        if (next.dropped.indexOf(ex.id) < 0) next.dropped.push(ex.id);
        var at = null;
        if (ex.holdKey) {
          at = startHolds && startHolds[ex.holdKey] != null ? startHolds[ex.holdKey]
             : (state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : HOLD_DEFAULT);
          next.holds[ex.holdKey] = at;
          next.painAt[ex.id] = at;
        }
        changed.push({ id: ex.id, name: ex.name, at: at });
        return;
      }
      if (!canMove(ex, kind)) return;
      var delta = kind === "easy" ? 1 : -1;
      if (ex.levels) {
        next.levels[ex.id] = clamp(levelIndex(ex, state) + delta, 0, ex.levels.length - 1);
      } else if (ex.holdKey) {

  function ring(pct, size, innerHtml) {
    var r = (size - 10) / 2;
    var c = 2 * Math.PI * r;

      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--color-input-edge)" stroke-opacity=".45" stroke-width="8"/>' +

  /* ---------------------------------------------------------------
     App state + render loop
  ---------------------------------------------------------------- */
  var state = loadState();
  var screen = "home"; // home | ready | session | rest | feedback | feedbackPick | done | dropped | all | backup | resetConfirm
  var exIndex = 0;
  var secondsLeft = 0;
  var running = true;
  var pickKind = null;
  var pickSelected = {};
  var adjustments = []; // this session's feedback rounds: { kind, ids, names, at? } (at: hold when pain was felt)
  var sessionHolds = {}; // the holds as they were when this session started
  var timerHandle = null;
  var root = document.getElementById("app");

  // Halfway-transition state, used during a "session" exercise that has
  // sideSwap or midpointBeep set (see getTransitionFlags). midpointDone
  // guards against the halfway check firing more than once per exercise.
  // sideSwapPause / sideSwapSecondsLeft track the 5s "Switch sides" break:
  // while sideSwapPause is true, the main exercise countdown is frozen and
  // a separate short countdown runs instead.
  var midpointDone = false;
  var sideSwapPause = false;
  var sideSwapSecondsLeft = 0;
  var SIDE_SWAP_PAUSE_SECONDS = 10;

  // Smooth timer ring. The countdown number changes once a second, but the
  // ring is redrawn on every screen frame so it drains without stopping.
  // ringElapsed is the seconds used so far in this exercise, kept between
  // the last whole-second tick and the next one so the ring can never drift
  // away from the number. It stands still while paused or on the
  // "Switch sides" screen.
  var ringElapsed = 0;
  var ringLast = 0;
  var ringRaf = 0;
  function ringFraction(duration) {
    var lo = duration - secondsLeft;
    var hi = Math.min(duration, lo + 1);
    if (ringElapsed < lo) ringElapsed = lo;
    if (ringElapsed > hi) ringElapsed = hi;
    return ringElapsed / duration;
  }
  function ringFrame(ts) {
    if (screen !== "session") { ringRaf = 0; return; }
    ringRaf = requestAnimationFrame(ringFrame);
    var dt = ringLast ? (ts - ringLast) / 1000 : 0;
    ringLast = ts;
    var ex = activeExercises[exIndex];
    if (!ex) return;
    var duration = getDuration(ex, state);
    if (running && !sideSwapPause) ringElapsed += Math.min(dt, 0.25);
    var pct = ringFraction(duration);
    var el = document.getElementById("ring-progress");
    if (el) {
      var c = 2 * Math.PI * parseFloat(el.getAttribute("r"));
      el.setAttribute("stroke-dashoffset", -c * pct);
    }
  }
  function startRingLoop() {
    ringElapsed = 0;
    ringLast = 0;
    if (!ringRaf) ringRaf = requestAnimationFrame(ringFrame);
  }

  function persist(next) { state = next; saveState(state); }

  /* ---------------------------------------------------------------
     In-progress session
     The session lives in memory, so minimising the window (or the
     browser dropping the page while it's hidden) used to wipe it.
     It's now saved on every screen change and every second, held
     (timer stopped) while the window is hidden, and put back on
     load. It's cleared when the session is finished (after the
     feedback step) or quit with the X.
  ---------------------------------------------------------------- */
  var SESSION_KEY = "mary-routine-session";
  var SESSION_SCREENS = { ready: true, session: true, rest: true, feedback: true, feedbackPick: true };
  var resumeOnReturn = false;

  function saveSession() {
    try {
      if (!SESSION_SCREENS[screen]) { window.localStorage.removeItem(SESSION_KEY); return; }
      window.localStorage.setItem(SESSION_KEY, JSON.stringify({
        date: todayStr(),
        v: 3,
        ids: activeExercises.map(function (e) { return e.id; }),
        adj: adjustments,
        holds0: sessionHolds,
        screen: screen === "feedbackPick" ? "feedback" : screen,
        exIndex: exIndex,
        secondsLeft: secondsLeft,
        running: running,
        midpointDone: midpointDone,
        sideSwapPause: sideSwapPause,
        sideSwapSecondsLeft: sideSwapSecondsLeft,
        ringElapsed: ringElapsed
      }));
    } catch (e) {}
  }

  // Put back a saved session. Returns true if one was restored.
  function restoreSession() {
    try {
      var raw = window.localStorage.getItem(SESSION_KEY);
      if (!raw) return false;
      var s = JSON.parse(raw);
      if (!s || s.v !== 3 || s.date !== todayStr() || !SESSION_SCREENS[s.screen] || !Array.isArray(s.ids)) return false;
      var exercises = s.ids.map(function (id) { return EXERCISE_BY_ID[id]; }).filter(Boolean);
      if (!exercises.length || exercises.length !== s.ids.length || s.exIndex < 0 || s.exIndex >= exercises.length) return false;
      activeSetLetter = "R";
      activeExercises = exercises;
      adjustments = Array.isArray(s.adj) ? s.adj : [];
      sessionHolds = s.holds0 && typeof s.holds0 === "object" ? s.holds0 : Object.assign({}, state.holds);
      exIndex = s.exIndex;
      screen = s.screen;
      secondsLeft = s.secondsLeft;
      midpointDone = !!s.midpointDone;
      sideSwapPause = !!s.sideSwapPause;
      sideSwapSecondsLeft = s.sideSwapSecondsLeft || 0;
      if (screen === "session") {
        startRingLoop();
        ringElapsed = s.ringElapsed || 0;
        running = false;          // come back paused, with Resume showing
      } else if (screen === "ready" || screen === "rest") {
        running = true;           // short screens with no pause button: carry on
        resumeOnReturn = true;    // the timer starts once the window is visible
      }
      return true;
    } catch (e) { return false; }
  }

  // Window hidden: stop the clock so no time passes unseen.
  function holdSession() {
    if (screen !== "ready" && screen !== "session" && screen !== "rest") return;
    if (running) {
      stopTimer();
      if (screen === "session") running = false;
      else resumeOnReturn = true;
    }
    saveSession();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { holdSession(); return; }
    if (resumeOnReturn) { resumeOnReturn = false; startTimer(); }
    if (screen === "session") render();
  });
  window.addEventListener("pagehide", holdSession);

  var audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      else if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function beep(freq, peakGain) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq || 880;
      var now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peakGain || 0.22, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    } catch (e) {}
  }
  // Transition beep — a distinct pitch from the 1046/784Hz countdown beeps,
  // used for the halfway midpoint beep and for the start/end of a side-swap
  // pause, so these read as a different kind of cue by ear. Sits between
  // the two countdown tones (784Hz / 1046Hz) rather than below both —
  // small phone speakers reproduce lower pitches more weakly at equal
  // gain, so anything noticeably lower than 784Hz read as "too quiet" even
  // with extra gain. Staying in the same consistently audible band as the
  // countdown beeps fixes that; it's still a clearly different pitch.
  var TRANSITION_BEEP_FREQ = 932;
  var TRANSITION_BEEP_GAIN = 0.24;
  function transitionBeep() { beep(TRANSITION_BEEP_FREQ, TRANSITION_BEEP_GAIN); }

  function startTimer() {
    clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (sideSwapPause) {
        sideSwapSecondsLeft -= 1;
        if (sideSwapSecondsLeft <= 0) {
          endSideSwapPause();
        } else {
          tick();
        }
        return;
      }
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        clearInterval(timerHandle);
        advance();
        return;
      }
      // Transition check — only for the "session" (exercise) screen, only
      // once per exercise. sideSwap triggers at exactly half the duration.
      // transitionAt triggers at its own exact seconds-elapsed value, which
      // is NOT always half the duration — see getTransitionFlags.
      if (screen === "session" && !midpointDone) {
        var ex = activeExercises[exIndex];
        var duration = getDuration(ex, state);
        var flags = getTransitionFlags(ex, state);
        var sideSwapTrigger = flags.sideSwap && secondsLeft <= Math.floor(duration / 2);
        var transitionAtTrigger = flags.transitionAt != null && secondsLeft <= (duration - flags.transitionAt);
        if (sideSwapTrigger || transitionAtTrigger) {
          midpointDone = true;
          if (sideSwapTrigger) {
            startSideSwapPause();
            return;
          } else {
            transitionBeep();
          }
        }
      }
      if (secondsLeft <= 3) beep(secondsLeft === 1 ? 1046 : 784);
      tick();
    }, 1000);
  }
  function stopTimer() { clearInterval(timerHandle); }

  function startSideSwapPause() {
    sideSwapPause = true;
    sideSwapSecondsLeft = SIDE_SWAP_PAUSE_SECONDS;
    transitionBeep();
    render();
  }
  function endSideSwapPause() {
    sideSwapPause = false;
    transitionBeep();
    render();
  }

  function startSession() {
    unlockAudio();
    activeSetLetter = "R";
    activeExercises = getTodaysExercises();
    adjustments = [];
    sessionHolds = Object.assign({}, state.holds);
    if (!activeExercises.length) { screen = "home"; render(); return; }
    exIndex = 0; screen = "ready"; secondsLeft = READY_SECONDS; running = true;
    render(); startTimer();
  }
  function beginExercise(idx) {
    var ex = activeExercises[idx];
    exIndex = idx; screen = "session"; secondsLeft = getDuration(ex, state); running = true;
    midpointDone = false; sideSwapPause = false; sideSwapSecondsLeft = 0;
    startRingLoop();
    render(); startTimer();
  }
  function advance() {
    if (screen === "ready") { beginExercise(0); return; }
    if (screen === "session") {
      if (exIndex < activeExercises.length - 1) {
        screen = "rest"; secondsLeft = getRestSeconds(); running = true;
        render(); startTimer();
      } else {
        stopTimer(); screen = "feedback"; render();

      return;
    }
    if (screen === "rest") { beginExercise(exIndex + 1); return; }
  }
  function skip() { stopTimer(); advance(); }
  // Rest screen: add 10 seconds to read the next move and get into position.
  function addRest() { secondsLeft += 10; tick(); }
  function changeRest(delta) {
    persist(Object.assign({}, state, { restSeconds: clamp(getRestSeconds() + delta, REST_MIN, REST_MAX) }));
    render();
  }
  function quitSession() { stopTimer(); screen = "home"; render(); }
  function togglePause() {
    running = !running;
    if (running) startTimer(); else stopTimer();
    render();
  }
  // Step 1: Too easy, Too hard or Felt pain opens a list of this session's
  // exercises so only the ticked ones change. Done (no answer) finishes.
  function submitFeedback(feedback) {

    pickSelected = {};
    screen = "feedbackPick";
    render();
  }
  // One adjustment per exercise per session: once an exercise has been ticked
  // too easy or too hard it can't be ticked again until the next session, and a
  // dropped exercise can't be adjusted at all. "Felt pain" is the exception: it
  // can always be ticked, and it replaces any earlier adjustment of that exercise.
  function adjustedThisSession(id, kind) {
    if (kind === "pain") return false;
    return adjustments.some(function (a) { return a.ids && a.ids.indexOf(id) >= 0; });
  }
  function togglePick(id) {
    if (pickSelected[id]) delete pickSelected[id]; else pickSelected[id] = true;
    render();
  }
  // Step 2: apply the ticks and go back to the choices, so several adjustments
  // can be made to one session (for example drop one exercise, lengthen another).
  // Each Apply is saved at once, and today's history entry is written each time,
  // so nothing is lost if the app is closed before Done.
  function applyPicked() {
    var ids = Object.keys(pickSelected).filter(function (id) { return !adjustedThisSession(id, pickKind); });
    if (!ids.length) { screen = "feedback"; render(); return; }
    var res = applyPick(state, pickKind, ids, activeExercises, sessionHolds);
    if (!res.changed.length) { screen = "feedback"; render(); return; }
    persist(Object.assign({}, state, res.next));
    var entry = {
      kind: pickKind,
      ids: res.changed.map(function (c) { return c.id; }),
      names: res.changed.map(function (c) { return c.name; })
    };
    if (pickKind === "pain") {
      entry.at = {};
      res.changed.forEach(function (c) { if (c.at != null) entry.at[c.id] = c.at; });
      // Felt pain replaces an earlier too easy / too hard on the same exercise.
      adjustments = adjustments.map(function (a) {
        if (a.kind === "pain") return a;
        var keep = [];
        a.ids.forEach(function (id, i) { if (entry.ids.indexOf(id) < 0) keep.push(i); });
        return { kind: a.kind, ids: keep.map(function (i) { return a.ids[i]; }), names: keep.map(function (i) { return a.names[i]; }) };
      }).filter(function (a) { return a.ids.length; });
    }
    adjustments.push(entry);
    recordDay();
    screen = "feedback";
    render();
  }
  // Today's history entry, built from this session's adjustments (it replaces any
  // earlier entry for today). feedback is the first adjustment's kind (or "right"),
  // ex lists every exercise ticked, adjust keeps each round. A pain round also keeps
  // at: the hold each stretch was on when the pain was felt.
  function recordDay() {
    var history = state.history.filter(function (h) { return h.date !== todayStr(); });
    var entry = { date: todayStr(), feedback: adjustments.length ? adjustments[0].kind : "right", set: activeSetLetter };
    var all = [];
    adjustments.forEach(function (a) { a.ids.forEach(function (id) { if (all.indexOf(id) < 0) all.push(id); }); });
    if (all.length) entry.ex = all;
    if (adjustments.length) entry.adjust = adjustments.map(function (a) {

  /* ---------------------------------------------------------------
     Screen builders
  ---------------------------------------------------------------- */
  function buildHome() {
    var streak = computeStreak(state.history);
    var upcomingExercises = getTodaysExercises();
    var totalSec = upcomingExercises.reduce(function (a, e) {
      // Add the "Switch sides" pause for exercises that have one.
      var pause = getTransitionFlags(e, state).sideSwap ? SIDE_SWAP_PAUSE_SECONDS : 0;
      return a + getDuration(e, state) + pause;
    }, 0) + getRestSeconds() * Math.max(0, upcomingExercises.length - 1) + READY_SECONDS;

    var streakHtml = streak > 0
      ? '<div style="display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:8px">' +
        iconFlame(15, "var(--amber)") + streak + ' day' + (streak === 1 ? "" : "s") + ' in a row</div>'
      : "";
    return (
      '<div class="col-center" style="gap:6px">' +
        '<div class="serif" style="font-size:30px;font-weight:500;line-height:1.15;margin-top:6px">Mary\'s movement routine</div>' +
        '<div style="font-size:12px;color:var(--color-text-muted);font-weight:500;margin-top:2px">Today\'s routine</div>' +
        '<div style="font-size:14px;color:var(--ink-soft);margin-bottom:8px">' + upcomingExercises.length + ' movements · ' + formatDuration(totalSec) + '</div>' +
        streakHtml +
        '<button id="btn-start" class="button start-btn">' +
          iconPlay(30, "var(--color-button-text)") + '<span style="font-size:15px;font-weight:500">Start</span>' +
        '</button>' +
        '<div style="margin-top:26px;font-size:12px;color:var(--ink-soft);max-width:300px;line-height:1.5">' + esc(SAFETY_FULL) + '</div>' +
        '<div style="margin-top:8px;font-size:12px;color:var(--ink-soft);max-width:300px;line-height:1.5">A mobility routine, not a full exercise plan.</div>' +
        '<details style="margin-top:12px;max-width:300px;text-align:left;font-size:12px;color:var(--ink-soft);line-height:1.5">' +
          '<summary style="cursor:pointer;text-align:center;color:var(--color-text)">When to stop and get help</summary>' +
          '<ul style="margin:8px 0 0 0;padding-left:18px">' + STOP_SIGNS.map(function (t) { return '<li style="margin-bottom:6px">' + esc(t) + '</li>'; }).join("") + '</ul>' +
        '</details>' +
        '<div class="row-center" style="gap:10px;margin-top:18px;font-size:13px;color:var(--ink-soft)">' +
          '<span>Rest between moves</span>' +
          '<button id="btn-rest-minus" class="button button--secondary icon-btn" aria-label="Shorter rest">\u2212</button>' +
          '<span id="rest-val" style="min-width:34px;text-align:center;color:var(--color-text)">' + getRestSeconds() + 's</span>' +
          '<button id="btn-rest-plus" class="button button--secondary icon-btn" aria-label="Longer rest">+</button>' +
        '</div>' +
        '<button id="btn-all-open" class="btn-link" style="margin-top:20px">All exercises</button>' +
        '<div style="display:flex;gap:16px;margin-top:12px">' +
          '<button id="btn-backup-open" class="btn-link">Backup / restore</button>' +
          '<button id="btn-reset" class="btn-link">Reset progress</button>' +
        '</div>' +
        (state.dropped.length
          ? '<button id="btn-dropped-open" class="btn-link" style="margin-top:10px">Dropped exercises (' + state.dropped.length + ')</button>'

  function showBackupStatus(msg, isError) {

    el.style.color = isError ? "var(--color-text-error)" : "var(--color-text-success)";
  }

  function buildBackup() {
    var exportText = JSON.stringify(state);
    return (
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        '<div class="top-bar">' +
          '<button id="btn-backup-close" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          '<div class="serif" style="font-size:16px;font-weight:500">Backup &amp; restore</div>' +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px">Copy this somewhere safe (notes app, email to yourself) before moving this app to a new URL or device — saved progress does not carry over on its own.</div>' +
          '<textarea id="backup-export" readonly onclick="this.select()" class="input mono" placeholder="Backup text">' + esc(exportText) + '</textarea>' +
          '<button id="btn-backup-copy" class="button" style="margin-top:8px">Copy to clipboard</button>' +
        '</div>' +
        '<div style="height:1px;background:var(--line)"></div>' +
        '<div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px">Paste a backup below to restore it — this replaces current progress on this device.</div>' +
          '<textarea id="backup-import" placeholder="Paste backup text here" class="input mono"></textarea>' +
          '<button id="btn-backup-restore" class="button button--secondary" style="margin-top:8px">Restore from text</button>' +
        '</div>' +
        '<div id="backup-status" style="font-size:12px;min-height:16px"></div>' +
      '</div>'
    );
  }

  // Shared block: exercise name, variant label (if it differs from
  // the name), animated diagram, guidance, cue, and clarification note.
  // Used by the get-ready screen, the session screen, and the rest screen's
  // "up next" preview so the same exercise always looks the same everywhere.
  function buildExercisePreview(ex, info, opts) {
    opts = opts || {};
    var animHeight = opts.animHeight || 190;
    var eyebrowPrefix = opts.eyebrowPrefix || "";
    var heading = displayName(ex, info);
    var variantLine = (info.label && info.label !== heading)
      ? '<div style="font-size:14px;color:var(--color-text-muted);margin-top:2px">' + esc(info.label) + '</div>'
      : "";
    return (
      '<div style="text-align:center">' +
        (eyebrowPrefix ? '<div style="font-size:12px;color:var(--color-text-muted);font-weight:500">' + esc(eyebrowPrefix.replace(/ · $/, "")) + '</div>' : "") +
        '<div class="serif" style="font-size:22px;font-weight:500">' + esc(heading) + '</div>' +
        variantLine +
      '</div>' +
      '<div class="anim-box" style="height:' + animHeight + 'px">' + ANIMS[getAnim(ex, state)]() + '</div>' +
      '<div style="text-align:center;font-size:16px;line-height:1.4">' + esc(info.guidance) + '</div>' +
      '<div style="text-align:center;font-size:16px;line-height:1.4;color:var(--ink-soft)">' + esc(displayCue(ex, info)) + '</div>' +
      (info.note ? '<div style="text-align:center;font-size:12px;color:var(--ink-soft)">' + esc(info.note) + '</div>' : "") +
      (ex.holdKey ? '<div style="text-align:center;font-size:12px;color:var(--ink-soft)">' + esc(SAFETY_SHORT) + '</div>' : "")
    );
  }

  function buildReady() {
    var ex = activeExercises[0];
    var info = getGuidance(ex, state);
    return (
      '<div style="display:flex;flex-direction:column;gap:12px">' +
        '<div class="top-bar">' +
          '<button id="btn-quit" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          buildDots(-1, activeExercises.length) +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div class="col-center" style="gap:2px">' +
          '<div style="font-size:14px;color:var(--ink-soft)">Get ready</div>' +
          '<div class="serif" id="countdown" style="font-size:44px;font-weight:500">' + secondsLeft + '</div>' +
        '</div>' +
        '<div class="row-center">' +
          '<button id="btn-skip" class="button button--secondary">Skip countdown ' + iconSkip(16, "var(--color-button-text)") + '</button>' +
        '</div>' +
        buildExercisePreview(ex, info, { animHeight: 150, eyebrowPrefix: "First up · " }) +
      '</div>'
    );
  }

  function buildDots(index, total) {
    var out = '<div class="dots">';
    for (var i = 0; i < total; i++) {
      var cls = "dot" + (i === index ? " current" : (i < index ? " done" : ""));
      out += '<div class="' + cls + '"></div>';
    }
    return out + '</div>';
  }

  function buildSession() {
    var ex = activeExercises[exIndex];
    var info = getGuidance(ex, state);
    var duration = getDuration(ex, state);

    if (sideSwapPause) {
      return (
        '<div style="display:flex;flex-direction:column;gap:12px">' +
          '<div class="top-bar">' +
            '<button id="btn-quit" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
            buildDots(exIndex, activeExercises.length) +
            '<div style="width:32px"></div>' +
          '</div>' +
          '<div class="col-center" style="gap:2px">' +
            '<div style="font-size:14px;color:var(--ink-soft)">' + esc(getTransitionFlags(ex, state).swapLabel || "Switch sides") + '</div>' +
            '<div class="serif" id="countdown" style="font-size:44px;font-weight:500;color:var(--color-edge-hover)">' + sideSwapSecondsLeft + '</div>' +
          '</div>' +
          buildExercisePreview(ex, info, { animHeight: 150 }) +
          '<div class="row-center" style="gap:14px;margin-top:4px">' +
            '<button id="btn-pause" class="button">' + (running ? iconPause(16, "var(--color-button-text)") : iconPlay(16, "var(--color-button-text)")) + (running ? "Pause" : "Resume") + '</button>' +
            '<button id="btn-skip" class="button button--secondary">Skip ' + iconSkip(16, "var(--color-button-text)") + '</button>' +
          '</div>' +
        '</div>'
      );
    }

    var pct = ringFraction(duration);
    return (
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="top-bar">' +
          '<button id="btn-quit" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          buildDots(exIndex, activeExercises.length) +
          '<div style="width:32px"></div>' +
        '</div>' +
        buildExercisePreview(ex, info, { animHeight: 190 }) +
        '<div class="row-center" style="margin-top:4px">' +
          ring(pct, 108, '<div class="serif" id="countdown" style="font-size:30px;font-weight:500">' + secondsLeft + '</div>') +
        '</div>' +
        '<div class="row-center" style="gap:14px;margin-top:4px">' +
          '<button id="btn-pause" class="button">' + (running ? iconPause(16, "var(--color-button-text)") : iconPlay(16, "var(--color-button-text)")) + (running ? "Pause" : "Resume") + '</button>' +
          '<button id="btn-skip" class="button button--secondary">Skip ' + iconSkip(16, "var(--color-button-text)") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function buildRest() {
    var next = activeExercises[exIndex + 1];
    var nextInfo = next ? getGuidance(next, state) : null;
    return (
      '<div style="display:flex;flex-direction:column;gap:12px">' +
        '<div class="top-bar">' +
          '<button id="btn-quit" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          buildDots(exIndex, activeExercises.length) +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div class="col-center" style="gap:2px">' +
          '<div style="font-size:14px;color:var(--ink-soft)">Rest</div>' +
          '<div class="serif" id="countdown" style="font-size:44px;font-weight:500;color:var(--color-edge-hover)">' + secondsLeft + '</div>' +
        '</div>' +
        (next
          ? buildExercisePreview(next, nextInfo, { animHeight: 150, eyebrowPrefix: "Up next · " })
          : '<div class="col-center" style="justify-content:center;height:200px">' +
              '<div style="font-size:13px;color:var(--ink-soft)">Last one — nearly there</div>' +
            '</div>') +
        '<div class="row-center" style="gap:14px;margin-top:2px">' +
          '<button id="btn-rest-more" class="button">+10 seconds</button>' +
          '<button id="btn-skip" class="button button--secondary">Skip rest ' + iconSkip(16, "var(--color-button-text)") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function adjustLabel(kind) {
    return kind === "easy" ? "Longer hold next time" : (kind === "hard" ? "Shorter hold next time" : "Left out of your routine");
  }
  function buildFeedback() {
    var hasAdj = adjustments.length > 0;
    var options = [
      { key: "easy", label: "Too easy", sub: "I could do more" },
      { key: "hard", label: "Too hard", sub: "I need to ease off" },
      { key: "pain", label: "Felt pain", sub: "Something didn't feel right" }
    ];
    var btns = options.map(function (o) {
      return '<button class="button button--secondary feedback-btn" data-feedback="' + o.key + '"><span class="label">' + o.label + '</span><span class="sub">' + o.sub + '</span></button>';
    }).join("");
    var summary = hasAdj
      ? '<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-soft);line-height:1.5;text-align:left">' +
          adjustments.map(function (a) { return '<div>' + esc(adjustLabel(a.kind) + ": " + a.names.join(", ")) + '</div>'; }).join("") +
        '</div>'
      : "";
    // Done is the only way to finish. With nothing adjusted it counts as "just right".
    return (
      '<div style="display:flex;flex-direction:column;gap:14px;padding-top:20px">' +
        '<div style="text-align:center">' +
          '<div class="serif" style="font-size:24px;font-weight:500">' + (hasAdj ? "Anything else to adjust?" : "How did that feel?") + '</div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5">' + (hasAdj ? "Pick another, or tap Done." : "Tap an option to adjust some exercises. If nothing needs changing, just tap Done.") + '</div>' +
        '</div>' +
        summary +
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">' + btns + '</div>' +
        '<div style="height:1px;background:var(--line);margin-top:10px"></div>' +
        '<button id="btn-feedback-done" class="button" style="width:100%;justify-content:center;gap:8px;padding:16px 18px;font-size:16px;font-weight:500">' +
          iconCheck(18, "var(--color-button-text)") + 'Done</button>' +
      '</div>'
    );
  }

  function buildFeedbackPick() {
    var titles = { easy: "Which felt too easy?", hard: "Which felt too hard?", pain: "Which one hurt?" };
    var subs = {
      easy: "Tick the ones to hold for longer. Everything else stays as it is.",
      hard: "Tick the ones to hold for less time. Everything else stays as it is.",
      pain: "Tick the ones that caused pain. They are left out of your routine until you put them back. If you'd already changed one this session, the pain answer replaces that change."
    };
    var rows = activeExercises.filter(function (ex) {
      if (state.dropped.indexOf(ex.id) >= 0) return false;
      return pickKind === "pain" ? true : hasSteps(ex);
    }).map(function (ex) {
      var already = adjustedThisSession(ex.id, pickKind);
      var disabled = already || !canMove(ex, pickKind);
      var selected = !!pickSelected[ex.id] && !already;
      var info = getGuidance(ex, state);
      var sub = "";
      if (ex.holdKey) {
        var shown = pickKind === "pain" && sessionHolds[ex.holdKey] != null ? sessionHolds[ex.holdKey] : (state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : HOLD_DEFAULT);
        sub = (pickKind === "pain" ? "Hold today: " : "Hold now: ") + shown + "s" + (ex.sideSwap ? " each " + (ex.sideWord || "side") : "");
      }
      if (already) sub = "Already adjusted this session";
      else if (disabled) sub = pickKind === "easy" ? "Already at the longest hold" : "Already at the shortest hold";
      return '<button class="button button--secondary pick-row' + (selected ? ' selected' : '') + '" data-pick="' + ex.id + '"' + (disabled ? ' disabled' : '') + '>' +
        '<span class="pick-box">' + (selected ? iconCheck(14, "var(--color-button-text)") : '') + '</span>' +
        '<span class="pick-text"><span>' + esc(displayName(ex, info)) + '</span>' + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span>' +
      '</button>';
    }).join("");
    return (
      '<div style="display:flex;flex-direction:column;gap:14px;padding-top:12px">' +
        '<div style="text-align:center">' +
          '<div class="serif" style="font-size:24px;font-weight:500">' + titles[pickKind] + '</div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">' + subs[pickKind] + '</div>' +
          (pickKind === "easy" ? '<div style="font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5">Lengthen a hold only after several comfortable sessions and a comfortable next morning. Change one thing at a time.</div>' : '') +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' + rows + '</div>' +
        '<div class="row-center" style="gap:12px;margin-top:6px">' +
          '<button id="btn-pick-back" class="button button--secondary">Back</button>' +
          '<button id="btn-pick-apply" class="button">Apply</button>' +
        '</div>' +
      '</div>'
    );
  }
  // "Are you sure?" step before progress is wiped. Cancel changes nothing.
  function buildResetConfirm() {
    return (
      '<div class="col-center" style="justify-content:center;min-height:420px;gap:14px">' +
        '<div class="serif" style="font-size:24px;font-weight:500">Reset all progress?</div>' +
        '<div style="font-size:14px;color:var(--ink-soft);max-width:280px;line-height:1.5">This clears your saved hold times, dropped exercises and session history on this device. It can\'t be undone.</div>' +
        '<div style="font-size:13px;color:var(--ink-soft);max-width:280px;line-height:1.5">Want a copy first? Use Back up first, then come back.</div>' +
        '<div class="row-center" style="gap:12px;margin-top:6px">' +
          '<button id="btn-reset-cancel" class="button">Cancel</button>' +
          '<button id="btn-reset-yes" class="button button--secondary">Yes, reset</button>' +
        '</div>' +
        '<button id="btn-backup-open" class="btn-link" style="margin-top:6px">Back up first</button>' +
      '</div>'
    );
  }

  function buildDropped() {
    var rows = state.dropped.map(function (id) {
      var ex = EXERCISE_BY_ID[id] || null;
      var name = ex ? displayName(ex, getGuidance(ex, state)) : id;
      var at = state.painAt && state.painAt[id] != null ? state.painAt[id] : null;
      var sub = at != null && ex
        ? '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">Hold was ' + at + 's' + (ex.sideSwap ? ' each ' + esc(ex.sideWord || 'side') : '') + ' when the pain was felt</div>'
        : '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px">' +
        '<span style="text-align:left"><span style="font-size:15px">' + esc(name) + '</span>' + sub + '</span>' +
        '<button class="button button--secondary restore-btn" data-restore="' + id + '">Put back</button>' +
      '</div>';
    }).join("");
    return (
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        '<div class="top-bar">' +
          '<button id="btn-dropped-close" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          '<div class="serif" style="font-size:16px;font-weight:500">Dropped exercises</div>' +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-soft)">These are left out of your routine after a "Felt pain" tick. Put one back when you\'re ready, and check in with a physio or doctor if the pain continues.</div>' +
        (rows || '<div style="font-size:13px;color:var(--ink-soft)">Nothing dropped.</div>') +
      '</div>'
    );
  }
  // The All exercises screen: every move in the routine, grouped as it is done,
  // with its hold or timer. View only.
  var WHERE_GROUPS = ["Seated", "Standing"];

  function buildAllExercises() {
    function row(ex) {
      var dropped = state.dropped.indexOf(ex.id) >= 0;
      var right;
      if (ex.holdKey) {
        var secs = state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : HOLD_DEFAULT;
        right = secs + "s" + (ex.sideSwap ? " each " + (ex.sideWord || "side") : "");
      } else {
        right = ex.duration + "s";
      }
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px">' +
        '<div style="text-align:left;min-width:0">' +
          '<div style="font-size:15px;' + (dropped ? 'font-style:italic;color:var(--ink-soft)' : '') + '">' + esc(ex.name) + (dropped ? ' *' : '') + '</div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-soft);white-space:nowrap;' + (dropped ? 'font-style:italic' : '') + '">' + esc(right) + '</div>' +
      '</div>';
    }
    var body = WHERE_GROUPS.map(function (g) {
      var rows = EXERCISES.filter(function (ex) { return ex.where === g; }).map(row).join("");
      return '<div style="display:flex;flex-direction:column;gap:8px">' +
        '<div class="serif" style="font-size:18px;font-weight:500;text-align:left;margin-top:8px">' + esc(g) + '</div>' +
        rows +
      '</div>';
    }).join("");
    var note = state.dropped.length
      ? '<div style="font-size:12px;color:var(--ink-soft);text-align:left;line-height:1.5"><i>* Dropped: left out of your routine. Put one back from the Dropped exercises screen.</i></div>'
      : "";
    return (
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="top-bar">' +
          '<button id="btn-all-close" class="button button--secondary icon-btn">' + iconX(18, "var(--color-button-text)") + '</button>' +
          '<div class="serif" style="font-size:16px;font-weight:500">All exercises</div>' +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-soft);text-align:left">Every move in your routine and its hold or timer. Viewing only.</div>' +
        body +
        note +
      '</div>'
    );
  }

  function buildDone() {
    var streak = computeStreak(state.history);
    var lines = adjustments.length
      ? adjustments.map(function (a) { return adjustLabel(a.kind) + ": " + a.names.join(", ") + "."; })
      : ["Holding steady next time."];
    if (adjustments.some(function (a) { return a.kind === "pain"; })) {
      lines.push("Put them back from the home screen when you're ready, and check in with a physio or doctor if the pain continues.");
    }
    lines.push("Symptoms should settle afterwards and should not be worse the next morning.");
    var streakHtml = streak > 0
      ? '<div style="font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px">' + iconFlame(14, "var(--amber)") + streak + ' day' + (streak === 1 ? "" : "s") + ' in a row</div>'
      : "";
    return (
      '<div class="col-center" style="justify-content:center;min-height:480px;gap:14px">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--color-button-mid);border:1px solid var(--color-edge-hover);display:flex;align-items:center;justify-content:center">' + iconCheck(28, "var(--color-button-text)") + '</div>' +
        '<div class="serif" style="font-size:26px;font-weight:500">Nice work</div>' +
        streakHtml +
        '<div style="font-size:13px;color:var(--ink-soft);max-width:260px;display:flex;flex-direction:column;gap:6px">' + lines.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join("") + '</div>' +
        '<button id="btn-home" class="button" style="margin-top:10px">Done ' + iconChevronRight(15, "var(--color-button-text)") + '</button>' +
      '</div>'
    );
  }
  /* ---------------------------------------------------------------
     Render + event binding
  ---------------------------------------------------------------- */
  function render() {
    var html;
    if (screen === "home") html = buildHome();
    else if (screen === "ready") html = buildReady();
    else if (screen === "session") html = buildSession();
    else if (screen === "rest") html = buildRest();
    else if (screen === "feedback") html = buildFeedback();
    else if (screen === "feedbackPick") html = buildFeedbackPick();
    else if (screen === "dropped") html = buildDropped();
    else if (screen === "all") html = buildAllExercises();
    else if (screen === "done") html = buildDone();
    else if (screen === "backup") html = buildBackup();
    else if (screen === "resetConfirm") html = buildResetConfirm();
    else html = "";
    root.innerHTML = html;
    bind();
    saveSession();
  }

  // Lightweight per-second update: just the number, no full re-render (avoids flicker & re-binding cost)
  function tick() {
    if (sideSwapPause) {
      var pauseNumEl = document.getElementById("countdown");
      if (pauseNumEl) pauseNumEl.textContent = sideSwapSecondsLeft;
      saveSession();
      return;
    }
    var numEl = document.getElementById("countdown");
    if (numEl) numEl.textContent = secondsLeft;
    saveSession();
  }

  function bind() {
    var byId = function (id) { return document.getElementById(id); };
    if (byId("btn-start")) byId("btn-start").addEventListener("click", startSession);
    if (byId("btn-reset")) byId("btn-reset").addEventListener("click", function () { screen = "resetConfirm"; render(); });
    if (byId("btn-reset-cancel")) byId("btn-reset-cancel").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-reset-yes")) byId("btn-reset-yes").addEventListener("click", resetProgress);
    if (byId("btn-quit")) byId("btn-quit").addEventListener("click", quitSession);
    if (byId("btn-rest-more")) byId("btn-rest-more").addEventListener("click", addRest);
    if (byId("btn-rest-minus")) byId("btn-rest-minus").addEventListener("click", function () { changeRest(-5); });
    if (byId("btn-rest-plus")) byId("btn-rest-plus").addEventListener("click", function () { changeRest(5); });
    if (byId("btn-pause")) byId("btn-pause").addEventListener("click", togglePause);
    if (byId("btn-skip")) byId("btn-skip").addEventListener("click", skip);
    if (byId("btn-home")) byId("btn-home").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-backup-open")) byId("btn-backup-open").addEventListener("click", function () { screen = "backup"; render(); });
    if (byId("btn-backup-close")) byId("btn-backup-close").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-backup-copy")) byId("btn-backup-copy").addEventListener("click", function () {
      var text = byId("backup-export").value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showBackupStatus("Copied to clipboard.", false);
        }).catch(function () {
          byId("backup-export").select();
          showBackupStatus("Couldn't auto-copy — text is selected, use your keyboard's copy.", true);
        });
      } else {
        byId("backup-export").select();
        showBackupStatus("Text is selected — use your keyboard's copy.", false);
      }
    });
    if (byId("btn-backup-restore")) byId("btn-backup-restore").addEventListener("click", function () {
      var raw = byId("backup-import").value.trim();
      if (!raw) { showBackupStatus("Paste a backup first.", true); return; }
      try {
        var parsed = JSON.parse(raw);
        var next = {
          levels: Object.assign({}, DEFAULT_STATE.levels, parsed.levels),
          holds: Object.assign({}, DEFAULT_STATE.holds, parsed.holds),
          dropped: Array.isArray(parsed.dropped) ? parsed.dropped : [],
          restSeconds: typeof parsed.restSeconds === "number" ? parsed.restSeconds : DEFAULT_STATE.restSeconds,
          painAt: parsed.painAt && typeof parsed.painAt === "object" ? parsed.painAt : {},
          history: Array.isArray(parsed.history) ? parsed.history : []
        };
        persist(next);
        render();
        showBackupStatus("Restored — you're back on track.", false);
      } catch (e) {
        showBackupStatus("That didn't look like a valid backup.", true);
      }
    });
    if (byId("btn-dropped-open")) byId("btn-dropped-open").addEventListener("click", function () { screen = "dropped"; render(); });
    if (byId("btn-dropped-close")) byId("btn-dropped-close").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-all-open")) byId("btn-all-open").addEventListener("click", function () { screen = "all"; render(); });
    if (byId("btn-all-close")) byId("btn-all-close").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-feedback-done")) byId("btn-feedback-done").addEventListener("click", finishFeedback);
    if (byId("btn-pick-back")) byId("btn-pick-back").addEventListener("click", function () { screen = "feedback"; render(); });
    if (byId("btn-pick-apply")) byId("btn-pick-apply").addEventListener("click", applyPicked);
    document.querySelectorAll(".pick-row").forEach(function (btn) {
      btn.addEventListener("click", function () { togglePick(btn.getAttribute("data-pick")); });
    });
    document.querySelectorAll(".restore-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { restoreExercise(btn.getAttribute("data-restore")); });
    });
    var fbBtns = document.querySelectorAll(".feedback-btn");
    fbBtns.forEach(function (btn) {
      btn.addEventListener("click", function () { submitFeedback(btn.getAttribute("data-feedback")); });
    });
  }

  restoreSession();
  render();
  if (resumeOnReturn && !document.hidden) { resumeOnReturn = false; startTimer(); }
})();
</script>
<script>
// Deep Jade button sweep, hold version (deep-jade-theme.md, section 4): this page redraws on every tap,
// so a tap starts the sweep and runs the button's action SWEEP_HOLD_MS later. Set it to 0 to remove the pause.
var SWEEP_HOLD_MS = 240;
document.addEventListener('click', function (e) {
  var b = e.target.closest('.button');
  if (!b) return;
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  if (b.__sweepReplay) { b.__sweepReplay = false; return; }          // the delayed repeat of the tap: let it through
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.stopImmediatePropagation();                                       // hold the real action back for a moment
  e.preventDefault();
  if (b.__sweepPending) return;                                       // ignore taps while one is waiting
  b.__sweepPending = true;
  b.classList.remove('is-sweeping');
  void b.offsetWidth;                                                 // restart the animation
  b.classList.add('is-sweeping');
  setTimeout(function () {
    b.__sweepPending = false;
    b.__sweepReplay = true;
    b.click();                                                        // now run the button's real action
  }, SWEEP_HOLD_MS);
  setTimeout(function () { b.classList.remove('is-sweeping'); }, 1500);
}, true);
</script>
