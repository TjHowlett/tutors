/* ============================================================
   Deep Jade theme - pasted unchanged from deep-jade-theme.md, section 3
   ============================================================ */
/* Deep Jade - personal theme for TJ's HTML tools
   Dark is the default. The light (silver) version switches on automatically
   when the device is set to light mode.
   Calm option: add the attribute data-calm to the <html> tag to turn down the
   glow, switch off the sweep and remove the gloss. Nothing else changes. */

:root {
  color-scheme: dark light;

  /* fonts */
  --font-body: "Inter Tight", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-code: ui-monospace, Consolas, monospace;
  --font-weight-body: 400;
  --font-weight-heading: 600;
  --font-weight-button: 500;
  --letter-spacing-heading: -0.01em;

  /* corners and spacing */
  --radius-card: 8px;
  --radius-button: 8px;
  --radius-input: 8px;
  --space-card-padding: 14px;
  --space-row-padding: 8px 12px;
  --space-gap: 8px;

  /* page, cards and words */
  --color-background: #000000;
  --background-page: #000000;
  --color-surface: #0E0F10;
  --background-card: #0E0F10;
  --color-surface-raised: #17191A;
  --color-text: #ECECF1;
  --color-text-muted: #A3A3AB;
  --color-edge: #34705E;
  --color-glow: #1F8A63;
  --shadow-card: inset 0 0 22px rgba(70, 170, 140, 0.22);

  /* main button (jade) */
  --color-button-text: #F2F2F2;
  --color-button-light: #176049;
  --color-button-mid: #0B4D3A;
  --color-button-dark: #04241B;
  --color-button-rim-active: #1F8A63;
  --sheen-main: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
  --shadow-button-rest: inset 0 0 16px rgba(70, 170, 140, 0.32), 0 0 10px rgba(46, 154, 120, 0.25);
  --color-edge-hover: #2E9A78;
  --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(46, 154, 120, 0.45);
  --shadow-button-active: inset 0 1px 0 rgba(31, 138, 99, 0.9), inset 0 -2px 0 rgba(31, 138, 99, 0.9), 0 0 16px rgba(31, 138, 99, 0.6);
  --sweep-duration: 1.4s;

  /* secondary button (smoky quartz with gloss) */
  --color-secondary-light: #2F2B27;
  --color-secondary-dark: #201D1A;
  --color-secondary-edge: #928982;
  --color-secondary-edge-hover: #B3AAA3;
  --sheen-secondary: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 48%);
  --shadow-secondary-rest: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  --shadow-secondary-hover: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 10px rgba(179, 170, 163, 0.3);

  /* disabled and keyboard focus (both buttons) */
  --opacity-disabled: 0.4;
  --shadow-focus: 0 0 0 2px #000000, 0 0 0 4px #F2F2F2;

  /* typing boxes */
  --color-input-background: #0A0B0C;
  --color-input-edge: #6B7278;
  --color-input-placeholder: #8A8F94;
  --color-input-edge-active: #2E9A78;
  --shadow-input-active: 0 0 0 3px rgba(46, 154, 120, 0.25), 0 0 14px rgba(31, 138, 99, 0.55), inset 0 1px 0 rgba(120, 200, 170, 0.3);

  /* messages: banner fills (same in dark and light) */
  --color-message-text: #F5F5F7;
  --color-success-top: #137A55;
  --color-success-bottom: #0F6B4A;
  --color-warning-top: #946108;
  --color-warning-bottom: #8A5A0B;
  --color-error-top: #9A2033;
  --color-error-bottom: #7F1626;

  /* messages: coloured words. ONLY for a genuine success, warning or error
     message. Never for headers or instructions (those stay grey). */
  --color-text-success: #5FCBA3;
  --color-text-warning: #E8B04A;
  --color-text-error: #FF8A8F;
}

@media (prefers-color-scheme: light) {
  :root {
    --color-background: #DEDFE3;
    --background-page: linear-gradient(160deg, #ECEDF0, #C9CBD1 55%, #DEDFE3);
    --color-surface: #E2E4E8;
    --background-card: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 50%), #E2E4E8;
    --color-surface-raised: #EDEFF2;
    --color-text: #14181A;
    --color-text-muted: #444D57;
    --color-edge: #2A7360;
    --color-glow: #2A7360;
    --shadow-card: none;

    --color-button-rim-active: #2A7360;
    --color-edge-hover: #2A7360;
    --shadow-button-hover: inset 0 0 18px rgba(70, 170, 140, 0.42), 0 0 14px rgba(42, 115, 96, 0.5);
    --shadow-button-active: inset 0 1px 0 rgba(42, 115, 96, 0.9), inset 0 -2px 0 rgba(42, 115, 96, 0.9), 0 0 14px rgba(42, 115, 96, 0.55);

    --color-secondary-edge: #635953;
    --color-secondary-edge-hover: #635953;

    --shadow-focus: 0 0 0 2px #ECEDF0, 0 0 0 4px #14181A;

    --color-input-background: #F1F2F4;
    --color-input-edge: #6F7782;
    --color-input-placeholder: #5B636D;
    --color-input-edge-active: #2A7360;
    --shadow-input-active: 0 0 0 3px rgba(42, 115, 96, 0.28), 0 0 12px rgba(42, 115, 96, 0.35), inset 0 1px 0 #FFFFFF;

    --color-text-success: #0A5A40;
    --color-text-warning: #6B4400;
    --color-text-error: #9A2033;
  }
}

/* Calm option: <html data-calm>. Quieter glow, no sweep, no gloss. */
:root[data-calm] {
  --shadow-button-rest: inset 0 0 8px rgba(70, 170, 140, 0.18), 0 0 3px rgba(46, 154, 120, 0.12);
  --sheen-main: linear-gradient(transparent, transparent);
  --sheen-secondary: linear-gradient(transparent, transparent);
  --shadow-secondary-rest: none;
}
:root[data-calm] .button::after { display: none; }

/* ---------- Component starting points (use the variables above) ---------- */

body {
  background: var(--background-page);
  color: var(--color-text);
  font-family: var(--font-body);
  font-weight: var(--font-weight-body);
}

h1, h2, h3 {
  font-weight: var(--font-weight-heading);
  letter-spacing: var(--letter-spacing-heading);
}

code, pre { font-family: var(--font-code); }

.card {
  background: var(--background-card);
  border: 1px solid var(--color-edge);
  border-radius: var(--radius-card);
  padding: var(--space-card-padding);
  box-shadow: var(--shadow-card);
}

.muted { color: var(--color-text-muted); }

.row {
  background: var(--color-surface-raised);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  margin-bottom: var(--space-gap);
}

.input {
  width: 100%;
  box-sizing: border-box;
  background: var(--color-input-background);
  color: var(--color-text);
  border: 1px solid var(--color-input-edge);
  border-radius: var(--radius-input);
  padding: var(--space-row-padding);
  font: inherit;
  outline: none;
}
.input::placeholder { color: var(--color-input-placeholder); }
.input:focus,
.input:not(:placeholder-shown) {
  border-color: var(--color-input-edge-active);
  box-shadow: var(--shadow-input-active);
}

/* ---------- Buttons ---------- */

.button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  color: var(--color-button-text);
  font: inherit;
  font-weight: var(--font-weight-button);
  padding: 7px 20px;
  border-radius: var(--radius-button);
  border: 1px solid var(--color-edge);
  background:
    var(--sheen-main),
    radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-rest);
}
.button--secondary {
  border-color: var(--color-secondary-edge);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-rest);
}

/* Sweep: a band of light that crosses the button when it is tapped */
.button::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 45%;
  transform: translateX(-130%) skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
  pointer-events: none;
}
.button.is-sweeping::after { animation: sweep var(--sweep-duration) ease-out; }
@keyframes sweep {
  from { transform: translateX(-130%) skewX(-20deg); }
  to   { transform: translateX(330%) skewX(-20deg); }
}
@media (prefers-reduced-motion: reduce) {
  .button.is-sweeping::after { animation: none; }
}

/* Hover (laptop or mouse only). Not applied to disabled buttons. */
@media (hover: hover) {
  .button:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-edge-hover);
    box-shadow: var(--shadow-button-hover);
  }
  .button--secondary:where(:not(:disabled):not([aria-disabled="true"])):hover {
    border-color: var(--color-secondary-edge-hover);
    box-shadow: var(--shadow-secondary-hover);
  }
}

/* Pressed. The standing diagonal shine on the main button is removed so it
   never stacks with the sweep (stacked, the button words would fail contrast). */
.button:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.is-sweeping {
  border-color: var(--color-button-rim-active);
  background: radial-gradient(ellipse at 50% 130%, var(--color-button-light), var(--color-button-mid) 55%, var(--color-button-dark));
  box-shadow: var(--shadow-button-active);
}
.button.button--secondary:where(:not(:disabled):not([aria-disabled="true"])):active,
.button.button--secondary.is-sweeping {
  border-color: var(--color-secondary-edge-hover);
  background:
    var(--sheen-secondary),
    linear-gradient(180deg, var(--color-secondary-light), var(--color-secondary-dark));
  box-shadow: var(--shadow-secondary-hover);
}

/* Keyboard focus: two-tone ring that shows on any background */
.button:focus-visible {
  outline: 2px solid transparent; /* keeps a visible outline in forced-colours mode */
  box-shadow: var(--shadow-focus);
}

/* Disabled: faded, no hover, no press, no sweep */
.button:disabled,
.button[aria-disabled="true"] {
  opacity: var(--opacity-disabled);
  cursor: not-allowed;
}
.button:disabled::after,
.button[aria-disabled="true"]::after { display: none; }

/* ---------- Messages ---------- */

.message {
  display: flex;
  gap: var(--space-gap);
  align-items: center;
  color: var(--color-message-text);
  padding: var(--space-row-padding);
  border-radius: var(--radius-card);

/* =========================================================================
   STATE / PERSISTENCE
   ========================================================================= */

// Prefixed with "blues-tutor-" so this doesn't collide with other tools that
// may end up sharing the same origin (e.g. multiple tutors on one GitHub Pages site).
const STORAGE_KEY = "blues-tutor-progress-state";

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); // local date, not UTC
  return d.toISOString().slice(0, 10);
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  let state;
  try { state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  if (!state) {
    state = { startDate: todayISO(), currentDay: 1, days: {} };
  }
  if (!state.days) state.days = {};
  if (!state.currentDay) state.currentDay = 1;
  if (!state.startDate) state.startDate = todayISO();
  return state;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSaved();
  } catch (e) {
    console.error("Could not save to localStorage", e);
  }
}

function getDayData(dayNum) {
  const key = String(dayNum);
  if (!state.days[key]) state.days[key] = { checks: {}, notes: "" };
  return state.days[key];
}

function computeSuggestedDay() {
  const start = new Date(state.startDate + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  let day = diffDays + 1;
  if (day < 1) day = 1;
  if (day > 14) day = 14;
  return day;
}

let state = loadState();

let saveFlashTimeout = null;
function flashSaved() {
  const el = document.getElementById("saveIndicator");
  if (!el) return;
  el.textContent = "Saved";
  clearTimeout(saveFlashTimeout);
  saveFlashTimeout = setTimeout(() => { el.textContent = ""; }, 1200);
}

/* =========================================================================
   VIEW: TODAY
   ========================================================================= */

function renderToday() {
  const dayNum = state.currentDay;
  const plan = PLAN[dayNum - 1];
  const dayData = getDayData(dayNum);

  const sectionsHtml = plan.sections.map(sec => {
    const checked = !!dayData.checks[sec.id];
    return `
      <div class="section ${checked ? "done" : ""}" data-secid="${sec.id}">
        <label class="section-head">
          <input type="checkbox" class="sec-check" data-secid="${sec.id}" ${checked ? "checked" : ""}>
          <div>
            <div class="stitle">${sec.title} <span class="stime">(${sec.time})</span></div>
          </div>
        </label>
        <div class="section-body">
          ${sec.body}
          ${sec.videos.length ? `<div style="margin-top:10px;">${videoLinksHtml(sec.videos)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  const dayOptions = PLAN.map(p => `<option value="${p.day}" ${p.day === dayNum ? "selected" : ""}>Day ${p.day}</option>`).join("");

  const suggested = computeSuggestedDay();

  return `
    <div class="card">
      <div class="day-header">
        <div>
          <div class="day-title">Day ${dayNum} of 14</div>
          <div class="phase-label">${plan.phase}</div>
        </div>
        <div class="day-nav-btns">
          <button id="prevDay" class="button button--secondary" ${dayNum <= 1 ? "disabled" : ""}>◀</button>
          <select id="daySelect">${dayOptions}</select>
          <button id="nextDay" class="button button--secondary" ${dayNum >= 14 ? "disabled" : ""}>▶</button>
        </div>
      </div>

      <div class="goal-box"><b>Today's goal:</b> ${plan.goal}</div>

      <div class="start-date-row">
        <span>Plan start date:</span>
        <input type="date" id="startDateInput" value="${state.startDate}">
        ${suggested !== dayNum ? `<button id="jumpSuggested" class="button button--secondary">Jump to today's suggested day (Day ${suggested})</button>` : `<span>— you're on today's suggested day</span>`}
        <span class="save-indicator" id="saveIndicator"></span>
      </div>
    </div>

    <div class="card">
      <h2>Practice structure</h2>
      ${sectionsHtml}
    </div>

    <div class="card">
      <h2>Notes for today</h2>
      <textarea class="input" id="notesArea" placeholder="What worked, what didn't, tempo used, anything to remember for next time...">${escapeHtml(dayData.notes)}</textarea>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function wireToday() {
  document.querySelectorAll(".sec-check").forEach(cb => {
    cb.addEventListener("change", (e) => {
      const secid = e.target.getAttribute("data-secid");
      const dayData = getDayData(state.currentDay);
      dayData.checks[secid] = e.target.checked;
      saveState();
      // toggle visual style without full re-render (keeps scroll position)
      const sectionEl = document.querySelector(`.section[data-secid="${secid}"]`);
      if (sectionEl) sectionEl.classList.toggle("done", e.target.checked);
    });
  });

  const notesArea = document.getElementById("notesArea");
  if (notesArea) {
    notesArea.addEventListener("input", (e) => {
      const dayData = getDayData(state.currentDay);
      dayData.notes = e.target.value;
      saveState();
    });
  }

  const prevBtn = document.getElementById("prevDay");
  const nextBtn = document.getElementById("nextDay");
  const daySelect = document.getElementById("daySelect");
  if (prevBtn) prevBtn.addEventListener("click", () => { setCurrentDay(state.currentDay - 1); });
  if (nextBtn) nextBtn.addEventListener("click", () => { setCurrentDay(state.currentDay + 1); });
  if (daySelect) daySelect.addEventListener("change", (e) => { setCurrentDay(parseInt(e.target.value, 10)); });

  const startDateInput = document.getElementById("startDateInput");
  if (startDateInput) {
    startDateInput.addEventListener("change", (e) => {
      state.startDate = e.target.value;
      saveState();
      render();
    });
  }

  const jumpBtn = document.getElementById("jumpSuggested");
  if (jumpBtn) {
    jumpBtn.addEventListener("click", () => { setCurrentDay(computeSuggestedDay()); });
  }
}

function setCurrentDay(n) {
  if (n < 1) n = 1;
  if (n > 14) n = 14;
  state.currentDay = n;
  saveState();
  render();
}

/* =========================================================================
   VIEW: FULL PLAN
   ========================================================================= */

function renderPlan() {
  const cells = PLAN.map(p => {
    const dayData = getDayData(p.day);
    const total = p.sections.length;
    const done = p.sections.filter(s => dayData.checks[s.id]).length;
    return `
      <div class="plan-cell" data-day="${p.day}">
        <div class="pd">Day ${p.day}</div>
        <div class="pp">${p.phase.split(":")[0]}</div>
        <div class="pg">${p.goal}</div>
        <div class="pct">${done}/${total} sections done</div>
      </div>
    `;
  }).join("");

  return `
    <div class="card">
      <h2>Full 14-Day Plan</h2>
      <p style="color:var(--color-text-muted);">Click any day to open it in the Today view.</p>
      <div class="plan-grid">${cells}</div>
    </div>
  `;
}

function wirePlan() {
  document.querySelectorAll(".plan-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      const day = parseInt(cell.getAttribute("data-day"), 10);
      state.currentDay = day;
      saveState();
      currentView = "today";
      render();
    });
  });
}

/* =========================================================================
   VIEW: RESOURCES
   ========================================================================= */

      <div style="font-size:19px;"><b>${r.title}</b></div>
      <div style="color:var(--color-text-muted); font-size:16px;">${r.creator}</div>
      <div style="margin:6px 0;">${r.desc}</div>
      <a class="video-link" target="_blank" rel="noopener" href="${ytLink(r.query)}">▶ Search on YouTube</a>
    </div>
  `).join("");

  return `
    <div class="card">
      <h2>Core Videos &amp; Articles</h2>
      ${resourceCards}
    </div>

    <div class="card">
      <h2>12-Bar Blues Chart in G</h2>
      <p>One chord per bar unless noted:</p>
      <table class="chart">
        <tr><td>G7</td><td>G7</td><td>G7</td><td>G7</td></tr>
        <tr><td>C7</td><td>C7</td><td>G7</td><td>G7</td></tr>
        <tr><td>D7</td><td>C7</td><td>G7</td><td>G7 (or D7 turnaround)</td></tr>
      </table>
      <ul class="rules-list">
        <li>Bars 1–4: G7</li>
        <li>Bars 5–6: C7</li>
        <li>Bars 7–8: G7</li>
        <li>Bar 9: D7</li>
        <li>Bar 10: C7</li>
        <li>Bars 11–12: G7 (often D7 in bar 12 as turnaround)</li>
      </ul>
    </div>

    <div class="card">
      <h2>Left-Hand Shuffle Pattern</h2>
      <p>Swung 8ths, root–5–root–6:</p>
      <div class="shuffle-row">
        <span class="note-pill">G7: G–D–G–E</span>
        <span class="note-pill">C7: C–G–C–A</span>
        <span class="note-pill">D7: D–A–D–B</span>
      </div>
    </div>

    <div class="card">
      <h2>G Minor Blues Scale (one octave)</h2>
      <div class="scale-row">
        <span class="note-pill">G</span>
        <span class="note-pill">Bb</span>
        <span class="note-pill">C</span>
        <span class="note-pill">Db</span>
        <span class="note-pill">D</span>
        <span class="note-pill">F</span>
        <span class="note-pill">G</span>
      </div>
    </div>

    <div class="card">
      <h2>General Practice Rules</h2>
      <ul class="rules-list">
        <li><b>Tempo:</b> start 50–60 bpm; only increase when everything feels easy.</li>
        <li><b>If hands fall apart:</b> slow down. Play LH alone for 30s, then add RH for 30s, then alternate. Keep the LH pattern going "no matter what" the RH does.</li>
      </ul>
    </div>

    <div class="card">
      <h2>Backup &amp; Restore Progress</h2>
      <p style="color:var(--color-text-muted);">
        Your progress is saved only in this browser, on this device. If you ever move this
        page to a different URL (e.g. a new hosting location), copy a backup here first, then
        paste it back in on the new page to bring your checkboxes and notes across.
      </p>
      <p><button id="copyBackupBtn" class="button small">Copy backup to clipboard</button></p>
      <p id="backupStatus" style="color:var(--color-text-success); min-height:20px;"></p>
      <p style="margin-top:18px;">Paste a backup below to restore it (this replaces your current progress):</p>
      <textarea class="input" id="restoreText" placeholder="Paste backup text here..." style="min-height:70px;"></textarea>
      <p><button id="restoreBtn" class="button button--secondary small">Restore from backup</button></p>
      <p id="restoreStatus" style="color:var(--color-text-success); min-height:20px;"></p>
    </div>
  `;
}

function wireResources() {
  const copyBtn = document.getElementById("copyBackupBtn");
  if (copyBtn) {
    copyBtn.addEventListener("click", () => {
      const text = JSON.stringify(state);
      const statusEl = document.getElementById("backupStatus");
      navigator.clipboard.writeText(text).then(() => {
        statusEl.textContent = "Copied to clipboard.";
      }).catch(() => {
        // Clipboard access can fail (e.g. no secure context) - fall back to
        // showing the text so it can be selected and copied manually.
        statusEl.textContent = "Couldn't access the clipboard - select and copy the text below instead:";
        const box = document.createElement("textarea");
        box.readOnly = true;
        box.value = text;
        box.style.minHeight = "70px";
        box.onclick = () => box.select();
        statusEl.after(box);
      });
    });
  }

  const restoreBtn = document.getElementById("restoreBtn");
  if (restoreBtn) {
    restoreBtn.addEventListener("click", () => {
      const statusEl = document.getElementById("restoreStatus");
      const raw = document.getElementById("restoreText").value.trim();
      if (!raw) {
        statusEl.style.color = "var(--color-text-muted)";
        statusEl.textContent = "Paste a backup first.";
        return;
      }
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        statusEl.style.color = "var(--color-text-error)";
        statusEl.textContent = "That didn't look like a valid backup.";
        return;
      }
      if (!confirm("This will replace your current saved progress. Continue?")) return;
      state = parsed;
      if (!state.days) state.days = {};
      if (!state.currentDay) state.currentDay = 1;
      if (!state.startDate) state.startDate = todayISO();
      saveState();
      statusEl.style.color = "var(--color-text-success)";
      statusEl.textContent = "Restored.";
    });
  }
}

/* =========================================================================
   ROUTER / RENDER
   ========================================================================= */

let currentView = "today";

function render() {
  const app = document.getElementById("app");
  document.getElementById("navToday").classList.toggle("active", currentView === "today");
  document.getElementById("navPlan").classList.toggle("active", currentView === "plan");
  document.getElementById("navResources").classList.toggle("active", currentView === "resources");

  if (currentView === "today") {
    app.innerHTML = renderToday();
    wireToday();
  } else if (currentView === "plan") {
    app.innerHTML = renderPlan();
    wirePlan();
  } else if (currentView === "resources") {
    app.innerHTML = renderResources();
    wireResources();
  }
}

document.getElementById("navToday").addEventListener("click", () => { currentView = "today"; render(); });
document.getElementById("navPlan").addEventListener("click", () => { currentView = "plan"; render(); });
document.getElementById("navResources").addEventListener("click", () => { currentView = "resources"; render(); });

// On first-ever load (no saved state), suggest today's computed day.
if (!localStorage.getItem(STORAGE_KEY)) {
  state.currentDay = computeSuggestedDay();
}

render();
</script>
<script>
// Deep Jade button sweep, hold version (deep-jade-theme.md, section 4): this page redraws on many taps,
// so a tap starts the sweep and runs the button's action SWEEP_HOLD_MS later. Set it to 0 to remove the pause.
var SWEEP_HOLD_MS = 240;
document.addEventListener('click', function (e) {
  var b = e.target.closest('.button');
  if (!b) return;
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  if (b.__sweepReplay) { b.__sweepReplay = false; return; }          // the delayed repeat of the tap: let it through
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.stopImmediatePropagation();                                       // hold the real action back for a moment
  e.preventDefault();
  if (b.__sweepPending) return;                                       // ignore taps while one is waiting
  b.__sweepPending = true;
  b.classList.remove('is-sweeping');
  void b.offsetWidth;                                                 // restart the animation
  b.classList.add('is-sweeping');
  setTimeout(function () {
    b.__sweepPending = false;
    b.__sweepReplay = true;
    b.click();                                                        // now run the button's real action
  }, SWEEP_HOLD_MS);
  setTimeout(function () { b.classList.remove('is-sweeping'); }, 1500);
}, true);
</script>
