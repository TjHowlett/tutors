  // Levels are an index into each exercise's own list of steps (0 = easiest
  // step that exercise has). New exercises (hinge, sideplank, wallsit,
  // balance, deadbug) start at their first step. `dropped` lists exercises
  // taken out of the sets after a "Felt pain" tick.
  var DEFAULT_STATE = {
    levels: { squat: 0, pushup: 0, bridge: 0, birddog: 0, calfraise: 0, plank: 0, superman: 0, sideleg: 0,
              hinge: 0, sideplank: 0, wallsit: 0, balance: 0, deadbug: 0 },

  /* ---------------------------------------------------------------
     Storage
  ---------------------------------------------------------------- */
  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      return {
        levels: Object.assign({}, DEFAULT_STATE.levels, parsed.levels),
        holds: Object.assign({}, DEFAULT_STATE.holds, parsed.holds),
        dropped: Array.isArray(parsed.dropped) ? parsed.dropped : [],
        history: parsed.history || []
      };
    } catch (e) {
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }
  function saveState(s) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---------------------------------------------------------------
     Helpers
  ---------------------------------------------------------------- */
  function localDateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function todayStr() { return localDateKey(new Date()); }

  function computeStreak(history) {
    if (!history.length) return 0;
    var dates = {};
    history.forEach(function (h) { dates[h.date] = true; });
    var streak = 0;
    var cursor = new Date();
    if (!dates[todayStr()]) cursor.setDate(cursor.getDate() - 1);
    while (true) {
      var key = localDateKey(cursor);
      if (dates[key]) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }
    return streak;
  }

  function getLastSetLetter(history) {
    if (!history.length) return null;
    var sorted = history.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    });
    return sorted[sorted.length - 1].set || "A";
  }

  function getNextSetLetter(state) {
    var last = getLastSetLetter(state.history);
    if (!last) return "A";
    return last === "A" ? "B" : "A";
  }

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  // Can this exercise move in this direction? Warm-ups have no steps, so
  // "easy" and "hard" don't apply to them. Stretches move in 5s hold steps.
  function canMove(ex, kind) {
    if (kind === "pain") return true;
    var delta = kind === "easy" ? 1 : -1;
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      return delta > 0 ? lvl < ex.levels.length - 1 : lvl > 0;
    }
    if (ex.holdKey) {
      var h = state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : 20;
      return delta > 0 ? h < 40 : h > 15;
    }
    return false;
  }
  function hasSteps(ex) { return !!(ex.levels || ex.holdKey); }

  // Applies one kind of feedback ("easy" | "hard" | "pain") to the exercises
  // ticked by id. Only those exercises change; everything else stays put.
  function applyPick(state, kind, ids, exerciseSet) {
    var next = {
      levels: Object.assign({}, state.levels),
      holds: Object.assign({}, state.holds),
      dropped: state.dropped.slice()
    };
    var changed = [];
    exerciseSet.forEach(function (ex) {
      if (ids.indexOf(ex.id) < 0) return;
      if (kind === "pain") {
        if (next.dropped.indexOf(ex.id) < 0) next.dropped.push(ex.id);
        changed.push(ex.name);
        return;
      }
      if (!canMove(ex, kind)) return;
      var delta = kind === "easy" ? 1 : -1;
      if (ex.levels) {
        next.levels[ex.id] = clamp(levelIndex(ex, state) + delta, 0, ex.levels.length - 1);
      } else if (ex.holdKey) {
        next.holds[ex.holdKey] = clamp((state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : 20) + delta * 5, 15, 40);
      }
      changed.push(ex.name);
    });
    return { next: next, changed: changed };
  }

  // The exercise's current step, kept inside the steps it actually has.
  function levelIndex(ex, state) {
    var n = ex.levels ? ex.levels.length : 1;
    var v = state.levels[ex.id] != null ? state.levels[ex.id] : 0;
    return clamp(v, 0, n - 1);
  }

  // The exercises still in a set (anything ticked as painful is out).
  function getSet(letter) {
    return SETS[letter].filter(function (ex) { return state.dropped.indexOf(ex.id) < 0; });
  }

  function getGuidance(ex, state) {
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      return ex.levels[lvl];
    }
    if (ex.holdKey) {
      var secs = state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : 20;
      return { label: ex.name, guidance: "Hold " + secs + "s", note: ex.note };
    }
    return { label: ex.name, guidance: ex.guidance, note: ex.note };
  }

  function getDuration(ex, state) {
    if (ex.holdKey) return state.holds[ex.holdKey] != null ? state.holds[ex.holdKey] : 20;
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      return ex.levels[lvl].duration;
    }
    return ex.duration;
  }

  // Resolves the halfway-transition behaviour for the exercise's *current*
  // level/hold:
  //  - sideSwap: a 5s pause + beeps, for exercises done on one side then
  //    the other. These genuinely split the duration 50/50 (the guidance
  //    text says "half the time" or an even side-to-side rep split), so the
  //    trigger point is always duration/2 — computed here, not stored.
  //  - transitionAt: a single beep (no pause) at an exact number of seconds
  //    elapsed, for exercises with a fixed first phase (e.g. "Hold 15s,
  //    lower, repeat" out of a 30s total, or "Hold 20s, then 5 pulses" out
  //    of 35s). This is NOT always half the duration — it's whatever the
  //    guidance text actually says — so it's stored explicitly per level
  //    rather than assumed.
  // Both are opt-in, set on the relevant level object (leveled exercises)
  // or the exercise itself (hold-key stretches), since which levels need
  // this varies — e.g. plank's "Hold 15s, lower, repeat" level needs a
  // transition beep, but its "Hold 20s" level is a plain single hold and
  // doesn't.
  function getTransitionFlags(ex, state) {
    if (ex.holdKey) return { sideSwap: !!ex.sideSwap, transitionAt: ex.transitionAt || null };
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      var levelObj = ex.levels[lvl];
      return { sideSwap: !!levelObj.sideSwap, transitionAt: levelObj.transitionAt || null };
    }
    return { sideSwap: false, transitionAt: null };
  }

  // Resolves which ANIMS entry to draw for the exercise's *current* level.
  // Most exercises show the same diagram at every level (ex.anim), but a
  // few now have a level-specific variant (e.g. squat looks different once
  // the chair is gone) — set as an optional `anim` field on that level
  // object, falling back to the exercise's default when a level doesn't
  // override it.
  function getAnim(ex, state) {
    if (ex.levels) {
      var lvl = levelIndex(ex, state);
      var levelObj = ex.levels[lvl];
      return levelObj.anim || ex.anim;
    }
    return ex.anim;
  }

  function ring(pct, size, innerHtml) {
    var r = (size - 10) / 2;
    var c = 2 * Math.PI * r;
    var offset = c * (1 - pct);
    return '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="8"/>' +

      '<foreignObject x="0" y="0" width="' + size + '" height="' + size + '" style="transform:rotate(90deg);transform-origin:center">' +

  /* ---------------------------------------------------------------
     App state + render loop
  ---------------------------------------------------------------- */
  var state = loadState();
  var screen = "home"; // home | ready | session | rest | feedback | feedbackPick | done | dropped | backup
  var exIndex = 0;
  var secondsLeft = 0;
  var running = true;
  var lastFeedback = null;
  var lastChanged = [];
  var pickKind = null;
  var pickSelected = {};
  var timerHandle = null;
  var root = document.getElementById("app");

  // Halfway-transition state, used during a "session" exercise that has
  // sideSwap or midpointBeep set (see getTransitionFlags). midpointDone
  // guards against the halfway check firing more than once per exercise.
  // sideSwapPause / sideSwapSecondsLeft track the 5s "Switch sides" break:
  // while sideSwapPause is true, the main exercise countdown is frozen and
  // a separate short countdown runs instead.
  var midpointDone = false;
  var sideSwapPause = false;
  var sideSwapSecondsLeft = 0;
  var SIDE_SWAP_PAUSE_SECONDS = 5;

  function persist(next) { state = next; saveState(state); }

  var audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      else if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function beep(freq, peakGain) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq || 880;
      var now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(peakGain || 0.22, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    } catch (e) {}
  }
  // Transition beep — a distinct pitch from the 1046/784Hz countdown beeps,
  // used for the halfway midpoint beep and for the start/end of a side-swap
  // pause, so these read as a different kind of cue by ear. Sits between
  // the two countdown tones (784Hz / 1046Hz) rather than below both —
  // small phone speakers reproduce lower pitches more weakly at equal
  // gain, so anything noticeably lower than 784Hz read as "too quiet" even
  // with extra gain. Staying in the same consistently audible band as the
  // countdown beeps fixes that; it's still a clearly different pitch.
  var TRANSITION_BEEP_FREQ = 932;
  var TRANSITION_BEEP_GAIN = 0.24;
  function transitionBeep() { beep(TRANSITION_BEEP_FREQ, TRANSITION_BEEP_GAIN); }

  function startTimer() {
    clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (sideSwapPause) {
        sideSwapSecondsLeft -= 1;
        if (sideSwapSecondsLeft <= 0) {
          endSideSwapPause();
        } else {
          tick();
        }
        return;
      }
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        clearInterval(timerHandle);
        advance();
        return;
      }
      // Transition check — only for the "session" (exercise) screen, only
      // once per exercise. sideSwap triggers at exactly half the duration.
      // transitionAt triggers at its own exact seconds-elapsed value, which
      // is NOT always half the duration — see getTransitionFlags.
      if (screen === "session" && !midpointDone) {
        var ex = activeExercises[exIndex];
        var duration = getDuration(ex, state);
        var flags = getTransitionFlags(ex, state);
        var sideSwapTrigger = flags.sideSwap && secondsLeft <= Math.floor(duration / 2);
        var transitionAtTrigger = flags.transitionAt != null && secondsLeft <= (duration - flags.transitionAt);
        if (sideSwapTrigger || transitionAtTrigger) {
          midpointDone = true;
          if (sideSwapTrigger) {
            startSideSwapPause();
            return;
          } else {
            transitionBeep();
          }
        }
      }
      if (secondsLeft <= 3) beep(secondsLeft === 1 ? 1046 : 784);
      tick();
    }, 1000);
  }
  function stopTimer() { clearInterval(timerHandle); }

  function startSideSwapPause() {
    sideSwapPause = true;
    sideSwapSecondsLeft = SIDE_SWAP_PAUSE_SECONDS;
    transitionBeep();
    render();
  }
  function endSideSwapPause() {
    sideSwapPause = false;
    transitionBeep();
    render();
  }

  function startSession() {
    unlockAudio();
    activeSetLetter = getNextSetLetter(state);
    activeExercises = getSet(activeSetLetter);
    if (!activeExercises.length) { screen = "home"; render(); return; }
    exIndex = 0; screen = "ready"; secondsLeft = 10; running = true;
    render(); startTimer();
  }
  function beginExercise(idx) {
    var ex = activeExercises[idx];
    exIndex = idx; screen = "session"; secondsLeft = getDuration(ex, state); running = true;
    midpointDone = false; sideSwapPause = false; sideSwapSecondsLeft = 0;
    render(); startTimer();
  }
  function advance() {
    if (screen === "ready") { beginExercise(0); return; }
    if (screen === "session") {
      if (exIndex < activeExercises.length - 1) {
        screen = "rest"; secondsLeft = REST_SECONDS; running = true;
        render(); startTimer();
      } else {
        stopTimer(); screen = "feedback"; render();
      }
      return;
    }
    if (screen === "rest") { beginExercise(exIndex + 1); return; }
  }
  function skip() { stopTimer(); advance(); }
  function quitSession() { stopTimer(); screen = "home"; render(); }
  function togglePause() {
    running = !running;
    if (running) startTimer(); else stopTimer();
    render();
  }
  // Step 1: "Just right" finishes in one tap. Any other answer opens a list
  // of today's exercises so only the ticked ones change.
  function submitFeedback(feedback) {
    if (feedback === "right") { finishFeedback("right", [], []); return; }
    pickKind = feedback;
    pickSelected = {};
    screen = "feedbackPick";
    render();
  }
  function togglePick(id) {
    if (pickSelected[id]) delete pickSelected[id]; else pickSelected[id] = true;
    render();
  }
  // Step 2: apply the ticks (if any) and record the day.
  function applyPicked() {
    var ids = Object.keys(pickSelected);
    if (!ids.length) { finishFeedback("right", [], []); return; }
    var res = applyPick(state, pickKind, ids, activeExercises);
    finishFeedback(pickKind, ids, res.changed, res.next);
  }
  function finishFeedback(kind, ids, changedNames, nextParts) {
    var history = state.history.filter(function (h) { return h.date !== todayStr(); });
    var entry = { date: todayStr(), feedback: kind, set: activeSetLetter };
    if (ids.length) entry.ex = ids;
    history.push(entry);
    persist(Object.assign({}, state, nextParts || {}, { history: history }));
    lastFeedback = kind;
    lastChanged = changedNames;
    screen = "done";
    render();
  }
  function restoreExercise(id) {
    persist(Object.assign({}, state, { dropped: state.dropped.filter(function (d) { return d !== id; }) }));
    render();
  }
  function resetProgress() {
    persist(JSON.parse(JSON.stringify(DEFAULT_STATE)));
    screen = "home";
    render();
  }

  /* ---------------------------------------------------------------
     Screen builders
  ---------------------------------------------------------------- */
  function buildHome() {
    var streak = computeStreak(state.history);
    var upcomingLetter = getNextSetLetter(state);
    var upcomingExercises = getSet(upcomingLetter);
    var totalSec = upcomingExercises.reduce(function (a, e) {
      // Add the 5s "Switch sides" pause for exercises that have one.
      var pause = getTransitionFlags(e, state).sideSwap ? SIDE_SWAP_PAUSE_SECONDS : 0;
      return a + getDuration(e, state) + pause;
    }, 0) + REST_SECONDS * (upcomingExercises.length - 1);
    var totalMin = Math.round(totalSec / 60);
    var streakHtml = streak > 0
      ? '<div style="display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:8px">' +
        iconFlame(15, "var(--amber)") + streak + ' day' + (streak === 1 ? "" : "s") + ' in a row</div>'
      : "";
    return (
      '<div class="col-center" style="gap:6px">' +
        '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">Good morning</div>' +
        '<div class="serif" style="font-size:30px;font-weight:500;line-height:1.15;margin-top:2px">Morning movement</div>' +
        '<div style="font-size:12px;color:var(--sage);font-weight:500;margin-top:2px">Today · Set ' + upcomingLetter + '</div>' +
        '<div style="font-size:14px;color:var(--ink-soft);margin-bottom:8px">' + upcomingExercises.length + ' movements · ~' + totalMin + ' min</div>' +
        streakHtml +
        '<button id="btn-start" style="margin-top:18px;width:156px;height:156px;border-radius:50%;border:none;background:var(--ink);color:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 8px 24px rgba(32,51,47,0.25)">' +
          iconPlay(30, "var(--panel)") + '<span style="font-size:15px;font-weight:500">Start</span>' +
        '</button>' +
        '<div style="margin-top:26px;font-size:12px;color:var(--ink-soft);max-width:260px;line-height:1.5">Stop or ease off anything that causes pain — a little effort is the goal, not strain.</div>' +
        '<div style="display:flex;gap:16px;margin-top:20px">' +
          '<button id="btn-backup-open" style="background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer">Backup / restore</button>' +
          '<button id="btn-reset" style="background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer">Reset progress</button>' +
        '</div>' +
        (state.dropped.length
          ? '<button id="btn-dropped-open" style="background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:10px">Dropped exercises (' + state.dropped.length + ')</button>'
          : '') +
      '</div>'
    );
  }

  // Shared block: category, exercise name, variant label (if it differs from
  // the name), animated diagram, guidance, cue, and clarification note.
  // Used by the get-ready screen, the session screen, and the rest screen's
  // "up next" preview so the same exercise always looks the same everywhere.
  function buildExercisePreview(ex, info, opts) {
    opts = opts || {};
    var animHeight = opts.animHeight || 190;
    var eyebrowPrefix = opts.eyebrowPrefix || "";
    var variantLine = (info.label && info.label !== ex.name)
      ? '<div style="font-size:14px;color:var(--sage);margin-top:2px">' + esc(info.label) + '</div>'
      : "";

      '<div style="text-align:center">' +
        '<div style="font-size:12px;color:var(--sage);font-weight:500">' + esc(eyebrowPrefix + ex.category) + '</div>' +
        '<div class="serif" style="font-size:22px;font-weight:500">' + esc(ex.name) + '</div>' +
        variantLine +
      '</div>' +
      '<div class="anim-box" style="height:' + animHeight + 'px">' + ANIMS[getAnim(ex, state)]() + '</div>' +
      '<div style="text-align:center;font-size:16px;line-height:1.4">' + esc(info.guidance) + '</div>' +
      '<div style="text-align:center;font-size:16px;line-height:1.4;color:var(--ink-soft)">' + esc(ex.cue) + '</div>' +
      (info.note ? '<div style="text-align:center;font-size:12px;color:var(--ink-soft)">' + esc(info.note) + '</div>' : "")

  function buildReady() {
    var ex = activeExercises[0];

          '<div class="serif" id="countdown" style="font-size:44px;font-weight:500">' + secondsLeft + '</div>' +
        '</div>' +
        buildExercisePreview(ex, info, { animHeight: 150, eyebrowPrefix: "First up · " }) +
      '</div>'
    );

  function buildDots(index, total) {
    var out = '<div class="dots">';
    for (var i = 0; i < total; i++) {
      var cls = "dot" + (i === index ? " current" : (i < index ? " done" : ""));
      out += '<div class="' + cls + '"></div>';
    }
    return out + '</div>';
  }

  function buildSession() {
    var ex = activeExercises[exIndex];
    var info = getGuidance(ex, state);
    var duration = getDuration(ex, state);

    if (sideSwapPause) {
      return (
        '<div style="display:flex;flex-direction:column;gap:12px">' +
          '<div class="top-bar">' +
            '<button id="btn-quit" class="icon-btn">' + iconX(18, "var(--ink-soft)") + '</button>' +
            buildDots(exIndex, activeExercises.length) +
            '<div style="width:32px"></div>' +
          '</div>' +
          '<div class="col-center" style="gap:2px">' +
            '<div style="font-size:14px;color:var(--ink-soft)">Switch sides</div>' +
            '<div class="serif" id="countdown" style="font-size:44px;font-weight:500;color:var(--sage)">' + sideSwapSecondsLeft + '</div>' +
          '</div>' +
          buildExercisePreview(ex, info, { animHeight: 150 }) +
          '<div class="row-center" style="gap:14px;margin-top:4px">' +
            '<button id="btn-pause" class="pill-btn">' + (running ? iconPause(16, "var(--panel)") : iconPlay(16, "var(--panel)")) + (running ? "Pause" : "Resume") + '</button>' +
            '<button id="btn-skip" class="pill-btn outline">Skip ' + iconSkip(16, "var(--ink)") + '</button>' +
          '</div>' +
        '</div>'
      );
    }

    var pct = 1 - secondsLeft / duration;
    return (
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="top-bar">' +
          '<button id="btn-quit" class="icon-btn">' + iconX(18, "var(--ink-soft)") + '</button>' +
          buildDots(exIndex, activeExercises.length) +
          '<div style="width:32px"></div>' +
        '</div>' +
        buildExercisePreview(ex, info, { animHeight: 190 }) +
        '<div class="row-center" style="margin-top:4px">' +
          ring(pct, 108, '<div class="serif" id="countdown" style="font-size:30px;font-weight:500">' + secondsLeft + '</div>') +
        '</div>' +
        '<div class="row-center" style="gap:14px;margin-top:4px">' +
          '<button id="btn-pause" class="pill-btn">' + (running ? iconPause(16, "var(--panel)") : iconPlay(16, "var(--panel)")) + (running ? "Pause" : "Resume") + '</button>' +
          '<button id="btn-skip" class="pill-btn outline">Skip ' + iconSkip(16, "var(--ink)") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function buildRest() {
    var next = activeExercises[exIndex + 1];
    var nextInfo = next ? getGuidance(next, state) : null;
    return (
      '<div style="display:flex;flex-direction:column;gap:12px">' +
        '<div class="top-bar">' +
          '<button id="btn-quit" class="icon-btn">' + iconX(18, "var(--ink-soft)") + '</button>' +
          buildDots(exIndex, activeExercises.length) +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div class="col-center" style="gap:2px">' +
          '<div style="font-size:14px;color:var(--ink-soft)">Rest</div>' +
          '<div class="serif" id="countdown" style="font-size:44px;font-weight:500;color:var(--sage)">' + secondsLeft + '</div>' +
        '</div>' +
        (next
          ? buildExercisePreview(next, nextInfo, { animHeight: 150, eyebrowPrefix: "Up next · " })
          : '<div class="col-center" style="justify-content:center;height:200px">' +
              '<div style="font-size:13px;color:var(--ink-soft)">Last one — nearly there</div>' +
            '</div>') +
        '<div class="row-center" style="margin-top:2px">' +
          '<button id="btn-skip" class="pill-btn outline">Skip rest ' + iconSkip(16, "var(--ink)") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function buildFeedback() {
    var options = [
      { key: "easy", label: "Too easy", sub: "I could do more" },
      { key: "right", label: "Just right", sub: "Good effort level" },
      { key: "hard", label: "Too hard", sub: "I need to ease off" },
      { key: "pain", label: "Felt pain", sub: "Something didn't feel right" }
    ];
    var btns = options.map(function (o) {
      return '<button class="feedback-btn" data-feedback="' + o.key + '"><span class="label">' + o.label + '</span><span class="sub">' + o.sub + '</span></button>';
    }).join("");
    return (
      '<div style="display:flex;flex-direction:column;gap:14px;padding-top:20px">' +
        '<div style="text-align:center">' +
          '<div class="serif" style="font-size:24px;font-weight:500">How did that feel?</div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">This tunes tomorrow\'s session.</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">' + btns + '</div>' +
      '</div>'
    );
  }

  function buildFeedbackPick() {
    var titles = { easy: "Which felt too easy?", hard: "Which felt too hard?", pain: "Which one hurt?" };
    var subs = {
      easy: "Tick the ones to step up. Everything else stays as it is.",
      hard: "Tick the ones to ease back. Everything else stays as it is.",
      pain: "Tick the ones that caused pain. They come out of your sets, and you can put them back later."
    };
    var rows = activeExercises.filter(function (ex) {
      return pickKind === "pain" ? true : hasSteps(ex);
    }).map(function (ex) {
      var disabled = !canMove(ex, pickKind);
      var selected = !!pickSelected[ex.id];
      var info = getGuidance(ex, state);
      var sub = info.label && info.label !== ex.name ? info.label : ex.category;
      if (disabled) sub = pickKind === "easy" ? "Already at the top step" : "Already at the easiest step";
      return '<button class="pick-row' + (selected ? ' selected' : '') + '" data-pick="' + ex.id + '"' + (disabled ? ' disabled' : '') + '>' +
        '<span class="pick-box">' + (selected ? iconCheck(14, "var(--panel)") : '') + '</span>' +
        '<span class="pick-text"><span>' + esc(ex.name) + '</span><span class="sub">' + esc(sub) + '</span></span>' +
      '</button>';
    }).join("");
    return (
      '<div style="display:flex;flex-direction:column;gap:14px;padding-top:12px">' +
        '<div style="text-align:center">' +
          '<div class="serif" style="font-size:24px;font-weight:500">' + titles[pickKind] + '</div>' +
          '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">' + subs[pickKind] + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' + rows + '</div>' +
        '<div class="row-center" style="gap:12px;margin-top:6px">' +
          '<button id="btn-pick-back" class="pill-btn outline">Back</button>' +
          '<button id="btn-pick-apply" class="pill-btn">Apply</button>' +
        '</div>' +
      '</div>'
    );
  }

  function buildDropped() {
    var rows = state.dropped.map(function (id) {
      var ex = null;
      Object.keys(SETS).forEach(function (k) {
        SETS[k].forEach(function (e) { if (e.id === id) ex = e; });
      });
      var name = ex ? ex.name : id;
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px">' +
        '<span style="font-size:15px">' + esc(name) + '</span>' +
        '<button class="pill-btn outline restore-btn" data-restore="' + id + '">Put back</button>' +
      '</div>';
    }).join("");
    return (
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        '<div class="top-bar">' +
          '<button id="btn-dropped-close" class="icon-btn">' + iconX(18, "var(--ink-soft)") + '</button>' +
          '<div class="serif" style="font-size:16px;font-weight:500">Dropped exercises</div>' +
          '<div style="width:32px"></div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-soft)">These are out of your sets after a "Felt pain" tick. Put one back when you\'re ready, and check in with a physio or doctor if the pain continues.</div>' +
        (rows || '<div style="font-size:13px;color:var(--ink-soft)">Nothing dropped.</div>') +
      '</div>'
    );
  }

  function buildDone() {
    var streak = computeStreak(state.history);
    var names = lastChanged.join(", ");
    var messages = {
      easy: names ? "Stepping up next time: " + names + "." : "Nothing changed.",
      right: "Holding steady next time.",
      hard: names ? "Easing back next time: " + names + "." : "Nothing changed.",
      pain: "Taken out of your sets: " + names + ". Put them back from the home screen when you're ready, and check in with a physio or doctor if the pain continues."
    };
    var streakHtml = streak > 0
      ? '<div style="font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px">' + iconFlame(14, "var(--amber)") + streak + ' day' + (streak === 1 ? "" : "s") + ' in a row</div>'
      : "";
    return (
      '<div class="col-center" style="justify-content:center;height:480px;gap:14px">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center">' + iconCheck(28, "var(--panel)") + '</div>' +
        '<div class="serif" style="font-size:26px;font-weight:500">Nice work</div>' +
        streakHtml +
        '<div style="font-size:13px;color:var(--ink-soft);max-width:240px">' + (messages[lastFeedback] || "") + '</div>' +
        '<button id="btn-home" class="pill-btn" style="margin-top:10px">Done ' + iconChevronRight(15, "var(--panel)") + '</button>' +
      '</div>'
    );
  }

  /* ---------------------------------------------------------------
     Render + event binding
  ---------------------------------------------------------------- */
  function render() {
    var html;
    if (screen === "home") html = buildHome();
    else if (screen === "ready") html = buildReady();
    else if (screen === "session") html = buildSession();
    else if (screen === "rest") html = buildRest();
    else if (screen === "feedback") html = buildFeedback();
    else if (screen === "feedbackPick") html = buildFeedbackPick();
    else if (screen === "dropped") html = buildDropped();
    else if (screen === "done") html = buildDone();
    else if (screen === "backup") html = buildBackup();
    else html = "";
    root.innerHTML = html;
    bind();
  }

  // Lightweight per-second update: just the number + ring, no full re-render (avoids flicker & re-binding cost)
  function tick() {
    if (sideSwapPause) {
      var pauseNumEl = document.getElementById("countdown");
      if (pauseNumEl) pauseNumEl.textContent = sideSwapSecondsLeft;
      return;
    }
    var numEl = document.getElementById("countdown");
    if (numEl) numEl.textContent = secondsLeft;
    var ringEl = document.getElementById("ring-progress");
    if (ringEl && screen === "session") {
      var ex = activeExercises[exIndex];
      var duration = getDuration(ex, state);
      var pct = 1 - secondsLeft / duration;
      var r = parseFloat(ringEl.getAttribute("r"));
      var c = 2 * Math.PI * r;
      ringEl.setAttribute("stroke-dashoffset", c * (1 - pct));
    }
  }

  function bind() {
    var byId = function (id) { return document.getElementById(id); };
    if (byId("btn-start")) byId("btn-start").addEventListener("click", startSession);
    if (byId("btn-reset")) byId("btn-reset").addEventListener("click", resetProgress);
    if (byId("btn-quit")) byId("btn-quit").addEventListener("click", quitSession);
    if (byId("btn-pause")) byId("btn-pause").addEventListener("click", togglePause);
    if (byId("btn-skip")) byId("btn-skip").addEventListener("click", skip);
    if (byId("btn-home")) byId("btn-home").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-backup-open")) byId("btn-backup-open").addEventListener("click", function () { screen = "backup"; render(); });
    if (byId("btn-backup-close")) byId("btn-backup-close").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-backup-copy")) byId("btn-backup-copy").addEventListener("click", function () {
      var text = byId("backup-export").value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showBackupStatus("Copied to clipboard.", false);
        }).catch(function () {
          byId("backup-export").select();
          showBackupStatus("Couldn't auto-copy — text is selected, use your keyboard's copy.", true);
        });
      } else {
        byId("backup-export").select();
        showBackupStatus("Text is selected — use your keyboard's copy.", false);
      }
    });
    if (byId("btn-backup-restore")) byId("btn-backup-restore").addEventListener("click", function () {
      var raw = byId("backup-import").value.trim();
      if (!raw) { showBackupStatus("Paste a backup first.", true); return; }
      try {
        var parsed = JSON.parse(raw);
        var next = {
          levels: Object.assign({}, DEFAULT_STATE.levels, parsed.levels),
          holds: Object.assign({}, DEFAULT_STATE.holds, parsed.holds),
          dropped: Array.isArray(parsed.dropped) ? parsed.dropped : [],
          history: Array.isArray(parsed.history) ? parsed.history : []
        };
        persist(next);
        render();
        showBackupStatus("Restored — you're back on track.", false);
      } catch (e) {
        showBackupStatus("That didn't look like a valid backup.", true);
      }
    });
    if (byId("btn-dropped-open")) byId("btn-dropped-open").addEventListener("click", function () { screen = "dropped"; render(); });
    if (byId("btn-dropped-close")) byId("btn-dropped-close").addEventListener("click", function () { screen = "home"; render(); });
    if (byId("btn-pick-back")) byId("btn-pick-back").addEventListener("click", function () { screen = "feedback"; render(); });
    if (byId("btn-pick-apply")) byId("btn-pick-apply").addEventListener("click", applyPicked);
    document.querySelectorAll(".pick-row").forEach(function (btn) {
      btn.addEventListener("click", function () { togglePick(btn.getAttribute("data-pick")); });
    });
    document.querySelectorAll(".restore-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { restoreExercise(btn.getAttribute("data-restore")); });
    });
    var fbBtns = document.querySelectorAll(".feedback-btn");
    fbBtns.forEach(function (btn) {
      btn.addEventListener("click", function () { submitFeedback(btn.getAttribute("data-feedback")); });
    });
  }

  render();
})();
</script>
</body>
</html>
