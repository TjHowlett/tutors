<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — a drawing tutor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%8F%EF%B8%8F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1ECE0;
    --paper-line: #D8D0BC;
    --graphite: #2B2A28;
    --graphite-soft: #6B6459;
    --red-pen: #B23A2E;
    --ochre: #C68A2E;
    --sage: #6E7C59;
    --card-shadow: 0 1px 0 rgba(43,42,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px),
      var(--paper);
    color:var(--graphite);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--graphite-soft);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  h1{
    font-size:30px;
    margin:4px 0 2px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .tagline{color:var(--graphite-soft); font-size:14px; margin:0;}

  .progress-row{display:flex; gap:5px; margin-top:14px;}
  .peg{
    flex:1; height:6px; border-radius:3px;
    background: var(--paper-line);
  }
  .peg.done{background: var(--sage);}
  .peg.current{background: var(--ochre);}
  .peg.clickable{cursor:pointer;}
  .peg.revisiting{background: var(--red-pen); outline:2px solid var(--red-pen); outline-offset:1px;}

  .card{
    background: #FBF9F2;
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:20px 20px 22px;
    margin-bottom:18px;
    box-shadow: var(--card-shadow);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background: var(--ochre);
    border-radius:2px;
  }
  .card.remedial::before{background: var(--red-pen);}
  .card.revisit::before{background: var(--sage);}
  .card-inner{padding-left:14px;}

  .lesson-num{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--ochre); font-weight:500;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .lesson-num.remedial{color:var(--red-pen);}
  .lesson-num.revisit{color:var(--sage);}
  h2{margin:4px 0 10px; font-size:22px;}
  .why{
    font-size:14.5px; color:var(--graphite-soft); line-height:1.5;
    margin:0 0 14px; font-style:italic;
  }
  .task-box{
    background: var(--paper);
    border:1px dashed var(--paper-line);
    border-radius:3px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.5;
  }
  .task-box b{color:var(--graphite);}

  .remedial-banner{
    background: #FBEDE9;
    border:1px solid #E4B7AC;
    color: var(--red-pen);
    border-radius:3px;
    padding:10px 14px;
    font-size:13.5px;
    line-height:1.45;
    margin-bottom:14px;
    font-family:'JetBrains Mono', monospace;
  }

  .video-links{margin:12px 0 4px; display:flex; flex-direction:column; gap:6px;}
  .video-link{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--sage);
    text-decoration:none;
    border:1px solid var(--paper-line);
    background:#F6F3E9;
    border-radius:3px;
    padding:8px 10px;
    transition: border-color .15s, background .15s;
  }
  .video-link:hover{border-color:var(--sage); background:#EFF1E6;}
  .video-link .play{font-size:13px; flex-shrink:0;}

  .materials-line{
    font-size:13.5px; line-height:1.5; color:var(--graphite-soft);
    margin:2px 0 12px; padding:8px 12px;
    background:#F6F3E9; border:1px solid var(--paper-line); border-radius:3px;
  }
  .materials-line b{color:var(--graphite);}

  .upload-zone{
    margin-top:16px;
    border:2px dashed var(--paper-line);
    border-radius:4px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s, background .15s;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--graphite-soft);
  }
  .upload-zone:hover{border-color:var(--ochre); background:#FDF6E8;}
  .upload-zone img{max-width:100%; max-height:260px; border-radius:3px; display:block; margin:0 auto 10px;}
  .upload-zone input{display:none;}

  button{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.02em;
    border:none;
    border-radius:3px;
    padding:12px 18px;
    cursor:pointer;
    background: var(--graphite);
    color: var(--paper);
    width:100%;
    margin-top:10px;
    transition: transform .1s, opacity .15s;
  }
  button:hover{opacity:0.88;}
  button:active{transform: scale(0.99);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.secondary{background:transparent; color:var(--graphite); border:1px solid var(--paper-line);}
  button.accent{background: var(--sage);}
  .btn-row{display:flex; gap:8px;}
  .btn-row button{margin-top:10px;}

  .loading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--graphite-soft);
    margin-top:14px;
  }
  .pencil-spin{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--paper-line); border-top-color:var(--ochre);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .note{
    font-family:'Caveat', cursive;
    font-size:22px;
    line-height:1.35;
    color:var(--red-pen);
    margin:16px 0 4px;
    transform: rotate(-0.4deg);
  }
  .note-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--graphite-soft); margin-top:16px; display:block;
  }
  .strength-line{
    font-size:14.5px; line-height:1.5; margin:4px 0;
    padding-left:16px; position:relative;
  }
  .strength-line::before{content:"+"; position:absolute; left:0; color:var(--sage); font-weight:700;}
  .focus-line{
    font-size:14.5px; line-height:1.5; margin:4px 0;
    padding-left:16px; position:relative;
  }
  .focus-line::before{content:"→"; position:absolute; left:0; color:var(--red-pen);}

  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    background: #FDF6E8;
    border:1px solid var(--paper-line);
    color: var(--graphite-soft);
    padding:4px 9px;
    border-radius:12px;
    margin:3px 5px 3px 0;
  }
  .tag b{color:var(--red-pen); font-weight:600;}

  .history-item{
    border-top:1px solid var(--paper-line);
    padding:10px 0;
    font-size:13.5px;
    display:flex; justify-content:space-between; gap:10px;
    color: var(--graphite-soft);
  }
  .history-item span:first-child{color:var(--graphite); font-weight:600;}
  .history-item .kind{
    font-family:'JetBrains Mono', monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .history-item .kind.remedial{color:var(--red-pen);}
  .history-item .kind.rep{color:var(--ochre);}
  .history-item .kind.revisit{color:var(--sage);}
  .history-detail{
    padding:4px 0 14px 4px;
    border-bottom:1px solid var(--paper-line);
  }
  .history-detail.empty{
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    color:var(--graphite-soft); padding-bottom:14px;
  }

  .empty{
    text-align:center; color:var(--graphite-soft); font-size:13.5px;
    font-family:'JetBrains Mono', monospace; padding:10px 0;
  }
  .err{
    color:var(--red-pen); font-size:13px; font-family:'JetBrains Mono', monospace;
    margin-top:10px;
  }
  .reset-link{text-align:center; margin-top:30px;}
  .reset-link a{
    color:var(--graphite-soft); font-size:12px; font-family:'JetBrains Mono', monospace;
    text-decoration:underline; cursor:pointer;
  }

  .settings-row{
    display:flex; gap:8px; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--graphite-soft);
  }
  .settings-row a{color:var(--sage); cursor:pointer; text-decoration:underline;}
  .key-input{
    width:100%; font-family:'JetBrains Mono', monospace; font-size:13px;
    padding:10px 12px; border:1px solid var(--paper-line); border-radius:3px;
    background:#fff; margin-top:8px;
  }
  .key-note{font-size:12px; color:var(--graphite-soft); line-height:1.5; margin:8px 0 0;}
  .key-status{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    margin-top:8px;
  }
  .key-status.ok{color:var(--sage);}
  .key-status.missing{color:var(--red-pen);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// v2 data model (16-skill engine) — deliberately a new key, not a migration, since the
// old fixed-lesson shape and this per-skill shape are structurally incompatible. Old
// saved progress under the v1 key is simply never read again.
const STORAGE_KEY = 'drawing-tutor-progress-state-v2';
const API_KEY_STORAGE = 'drawing-tutor-anthropic-key';
const WORKSPACE_ID_STORAGE = 'drawing-tutor-anthropic-workspace-id';
// old names, kept only so existing saved data migrates automatically the first time
// this runs under the renamed keys — safe to remove these three lines after that happens
const LEGACY_API_KEY_STORAGE = 'sketchbook-anthropic-key';
const LEGACY_WORKSPACE_ID_STORAGE = 'sketchbook-anthropic-workspace-id';
const MODEL = "claude-sonnet-5";

// --- 16-skill model -------------------------------------------------------

const SKILL_IDS = [
  'line-confidence', 'circle-curve-control', 'ellipse-consistency',
  'perspective-1pt', 'perspective-2pt', 'perspective-interiors',
  'proportion-by-eye', 'measuring-angles-lengths',
  'cylinders', 'spheres', 'boxes-volume',
  'value-scale', 'rendering-form-shading', 'light-source-consistency',
  'combining-objects', 'observation-vs-imagination'
];

const SKILL_META = {
  'line-confidence':            { checkable: true,  category: 'foundations', prereqs: [] },
  'circle-curve-control':       { checkable: true,  category: 'foundations', prereqs: [] },
  'ellipse-consistency':        { checkable: true,  category: 'foundations', prereqs: ['circle-curve-control'] },

  'perspective-1pt':            { checkable: true,  category: 'perspective', prereqs: ['line-confidence'] },
  'perspective-2pt':            { checkable: true,  category: 'perspective', prereqs: ['perspective-1pt'] },
  'perspective-interiors':      { checkable: true,  category: 'perspective', prereqs: ['perspective-2pt'] },

  'proportion-by-eye':          { checkable: true,  category: 'proportion', prereqs: [] },
  'measuring-angles-lengths':   { checkable: true,  category: 'proportion', prereqs: ['proportion-by-eye'] },

  'cylinders':                  { checkable: true,  category: 'form', prereqs: ['circle-curve-control'] },
  'spheres':                    { checkable: true,  category: 'form', prereqs: ['circle-curve-control'] },
  'boxes-volume':                { checkable: true,  category: 'form', prereqs: ['perspective-1pt'] },

  'value-scale':                { checkable: true,  category: 'value-shading', prereqs: [] },
  'rendering-form-shading':     { checkable: false, category: 'value-shading', prereqs: ['value-scale'] },
  'light-source-consistency':   { checkable: false, category: 'value-shading', prereqs: ['rendering-form-shading'] },

  // combining-objects' second prerequisite is "any one form-category skill", not a fixed id —
  // resolved at runtime (stage 3) by scanning SKILL_META for category:'form', not listed here
  'combining-objects':          { checkable: false, category: 'composition', prereqs: ['proportion-by-eye'] },
  'observation-vs-imagination': { checkable: false, category: 'composition', prereqs: [] }
};

const SKILL_TITLES = {
  'line-confidence': 'Line confidence',
  'circle-curve-control': 'Circle/curve control',
  'ellipse-consistency': 'Ellipse consistency',
  'perspective-1pt': '1-point perspective',
  'perspective-2pt': '2-point perspective',
  'perspective-interiors': 'Perspective in real spaces',
  'proportion-by-eye': 'Proportion by eye',
  'measuring-angles-lengths': 'Measuring angles and lengths',
  'cylinders': 'Cylinders',
  'spheres': 'Spheres',
  'boxes-volume': 'Boxes as volume',
  'value-scale': 'Value scale control',
  'rendering-form-shading': 'Rendering form with shading',
  'light-source-consistency': 'Light source consistency',
  'combining-objects': 'Combining multiple objects',
  'observation-vs-imagination': 'Drawing from observation vs imagination'
};

function skillTitle(id){
  return SKILL_TITLES[id] || id;
}

// Pass rule for checkable skills (section 1 + confirmed in review):
// at least this many logged primary reps, with no failed criteria in the
// most recent RECENT_WINDOW primary-evidence entries.
const PASS_RULE = {
  minPrimaryReps: 5,
  recentWindow: 3
};

// --- Exercise bank (stage 2) -----------------------------------------------
// Passive, static reference data (section 10: "never decides anything").
// referencePhoto per variant is one of 'none' | 'optional' | 'required'.
// Some full-exercise variants incidentally touch a skill that isn't fixed
// (e.g. "whichever form skill matches the chosen object") — those are captured
// in `dynamicIncidentalNote` as free text rather than invented fixed skill ids.

const EXERCISE_BANK = {

  'line-confidence': {
    passCriteria: [
      'Lines are single, confident strokes — not several short, overlapping corrective strokes',
      'Lines hold a reasonably straight/intended path over their full length (not wavering or arcing unintentionally)',
      'Line weight is reasonably consistent along the stroke (not trailing off or scratchy at the ends)'
    ],
    videos: [
      { label: 'Superimposed Lines', channel: 'Drawabox', duration: '8:58', url: 'https://youtube.com/watch?v=dzGmoJanhbQ', secondary: false },
      { label: 'Ghosted Lines', channel: 'Drawabox', duration: '10:32', url: 'https://youtube.com/watch?v=LkJG6pKTuRc', secondary: false },
      { label: 'Levels of the Ghosting Method', channel: 'Drawabox', duration: '4:54', url: 'https://youtube.com/watch?v=o1HAVipdsZM', secondary: false }
    ],
    drills: [
      { id: 'drill-1', text: '20 straight lines, freehand, mixing lengths and angles — one confident stroke per line', referencePhoto: 'none' },
      { id: 'drill-2', text: '20 straight lines drawn slowly, then 20 more drawn fast — same criteria, to separate control from confidence', referencePhoto: 'none' },
      { id: 'drill-3', text: '15 lines connecting two marked dots each (varying distance/angle) — tests aiming as well as stroke quality', referencePhoto: 'none' }
    ],
    fullExercises: [
      { id: 'full-1', text: 'Draw a simple geometric pattern (e.g. a grid of triangles) freehand, no ruler', incidentalSkills: ['proportion-by-eye'], referencePhoto: 'none' },
      { id: 'full-2', text: 'Trace the outline of a real object in one continuous confident line, no lifting the pencil to correct', incidentalSkills: ['proportion-by-eye', 'observation-vs-imagination'], referencePhoto: 'optional', referenceNote: 'the object being traced' }
    ]
  },

  'circle-curve-control': {
    passCriteria: [
      'Circles/curves are single confident strokes',
      'Roundness is consistent (not lopsided or flat on one side)',
      'Closes cleanly near the start point without a big overlap or gap'
    ],
    videos: [
      { label: 'Superimposed Lines', channel: 'Drawabox', duration: '8:58', url: 'https://youtube.com/watch?v=dzGmoJanhbQ', secondary: false },
      { label: 'Ellipses', channel: 'Drawabox', duration: '12:48', url: 'https://youtube.com/watch?v=tHJ3rzk6kno', secondary: false },
      { label: 'Tables of Ellipses', channel: 'Drawabox', duration: '6:36', url: 'https://youtube.com/watch?v=7WLmXufShyA', secondary: false }
    ],
    drills: [
      { id: 'drill-1', text: '20 circles, varying sizes, freehand', referencePhoto: 'none' },
      { id: 'drill-2', text: '20 curved lines of varying arc (shallow to tight), each in one stroke', referencePhoto: 'none' },
      { id: 'drill-3', text: '10 circles, then immediately 10 more inside/around them (nested) — tests control under closer spacing', referencePhoto: 'none' }
    ],
    fullExercises: [
      { id: 'full-1', text: 'Draw a bowl of round fruit (any mix, any count)', incidentalSkills: ['proportion-by-eye'], referencePhoto: 'optional', referenceNote: 'the actual fruit' },
      { id: 'full-2', text: 'Draw a coiled rope or a plant with curling tendrils/vines', incidentalSkills: ['observation-vs-imagination'], referencePhoto: 'optional', referenceNote: 'the actual rope/plant' }
    ]
  },

  'ellipse-consistency': {
    passCriteria: [
      'Ellipse holds a consistent width-to-height ratio along its full curve (not egg-shaped unless intended)',
      'Both ends are symmetric',
      'No visible corners'
    ],
    videos: [
      { label: 'Tables of Ellipses', channel: 'Drawabox', duration: '6:36', url: 'https://youtube.com/watch?v=7WLmXufShyA', secondary: false },
      { label: 'Ellipses in Planes', channel: 'Drawabox', duration: '4:00', url: 'https://youtube.com/watch?v=9EUc-nni1_w', secondary: false },
      { label: 'Ellipses', channel: 'Drawabox', duration: '12:48', url: 'https://youtube.com/watch?v=tHJ3rzk6kno', secondary: false }
    ],
    drills: [
      { id: 'drill-1', text: '20 ellipses, freehand, varying sizes and angles of rotation', referencePhoto: 'none' },
      { id: 'drill-2', text: 'A row of ellipses in a "table" — same size, rotating degree of tilt across the row', referencePhoto: 'none' },
      { id: 'drill-3', text: '10 ellipses, then draw a second ellipse tightly inside each (like a rim + base of a cup) — tests consistency at close spacing', referencePhoto: 'none' }
    ],
    fullExercises: [
      { id: 'full-1', text: 'Draw 3–5 round objects viewed at an angle (mugs, jars, wheels — your choice of subject and count)', incidentalSkills: ['proportion-by-eye', 'cylinders'], referencePhoto: 'optional', referenceNote: 'the actual objects' },
      { id: 'full-2', text: 'Draw a table set from above/an angle with plates and cups', incidentalSkills: ['proportion-by-eye', 'combining-objects'], referencePhoto: 'optional', referenceNote: 'the actual objects' }
    ]
  },

  'perspective-1pt': {
    passCriteria: [
      'All converging lines actually meet at a single vanishing point on the horizon (not near-misses)',
      'Horizon line and vanishing point are clearly established before drawing',
      'Box faces read as flat planes, not warped'
    ],
    videos: [
      { label: 'Perspective for Beginners', channel: 'Proko', duration: '13:56', url: 'https://youtube.com/watch?v=BYlW8XC0MlI', secondary: false },
      { label: 'Ghosted Planes', channel: 'Drawabox', duration: '6:00', url: 'https://youtube.com/watch?v=JsG7cMasVjo', secondary: false },
      { label: 'Two-Point Perspective Drawing Made Simple', channel: 'Proko', duration: '13:33', url: 'https://youtube.com/watch?v=9-Y4K4hqZwo', secondary: false, note: 'shown as contrast, not the main topic' }
    ],
    drills: [
      { id: 'drill-1', text: '5 boxes in 1-point perspective, varying position relative to the vanishing point (above/below/either side of eye level)', referencePhoto: 'none' },
      { id: 'drill-2', text: 'Draw the vanishing point and horizon first, then 8 lines from scattered points all converging correctly into it', referencePhoto: 'none' },
      { id: 'drill-3', text: '3 boxes stacked or arranged in a row, all sharing the same vanishing point — tests consistency across multiple objects', referencePhoto: 'none' }
    ],
    fullExercises: [
      { id: 'full-1', text: 'Draw a street, hallway, or train track receding into the distance (your choice of subject)', incidentalSkills: ['line-confidence'], referencePhoto: 'optional', referenceNote: 'the actual street/building' },
      { id: 'full-2', text: 'Draw a simple building facade face-on with a receding side wall', incidentalSkills: ['boxes-volume'], referencePhoto: 'optional', referenceNote: 'the actual street/building' }
    ]
  },

  'perspective-2pt': {
    passCriteria: [
      'Two vanishing points are both used consistently (lines actually converge to one or the other, not drifting)',
      'Vertical edges stay truly vertical',
      'Box proportions stay believable (not warped/stretched near the vanishing points)'
    ],
    videos: [
      { label: 'Two-Point Perspective Drawing Made Simple', channel: 'Proko', duration: '13:33', url: 'https://youtube.com/watch?v=9-Y4K4hqZwo', secondary: false },
      { label: 'Perspective for Beginners', channel: 'Proko', duration: '13:56', url: 'https://youtube.com/watch?v=BYlW8XC0MlI', secondary: false },
      { label: 'Ghosted Lines', channel: 'Drawabox', duration: '10:32', url: 'https://youtube.com/watch?v=LkJG6pKTuRc', secondary: false }
    ],
    drills: [
      { id: 'drill-1', text: '5 boxes in 2-point perspective at varying distances from the vanishing points', referencePhoto: 'none' },
      { id: 'drill-2', text: 'One long horizon line with both vanishing points marked, then 10 lines drawn to test which point they should converge to', referencePhoto: 'none' },
      { id: 'drill-3', text: '3 boxes of different proportions (cube, tall, wide) using the same two vanishing points', referencePhoto: 'none' }
    ],
    fullExercises: [
      { id: 'full-1', text: 'Draw a building corner from outside, at an angle (your choice of building complexity)', incidentalSkills: ['boxes-volume', 'proportion-by-eye'], referencePhoto: 'optional', referenceNote: 'the actual building/furniture' },
      { id: 'full-2', text: 'Draw a piece of furniture (table, bookshelf, chest) at an angle', incidentalSkills: ['boxes-volume'], referencePhoto: 'optional', referenceNote: 'the actual building/furniture' }
    ]
  },

  'perspective-interiors': {
    passCriteria: [
      "The room's walls/floor/ceiling agree on a single consistent perspective system (not mixing 1-point and 2-point inconsistently)",
      "Furniture within the room is sized/angled consistently with the room's own vanishing points"
    ],
    videos: [
      { label: 'Perspective for Beginners', channel: 'Proko', duration: '13:56', url: 'https://youtube.com/watch?v=BYlW8XC0MlI', secondary: false },
      { label: 'How To Draw A Room with One Point Perspective', channel: 'Circle Line Art School', duration: '11:09', url: 'https://youtube.com/watch?v=yEymIyLbiAI', secondary: false }
    ],

// General craft/materials reference — NOT a tracked skill (no reps, pass/fail, or
// rotation, and not tied to any one skill/exercise). Purely reference content the
// session screen can surface and the AI feedback step (stage 5) may optionally draw
// on, e.g. suggesting a softer pencil or a kneaded-eraser technique as a focus area.

  videos: [
    { label: 'Drawing Basics: Understanding Pencil Grades', channel: 'Leanne Bishop', duration: '4:34', url: 'https://youtube.com/watch?v=8IM05ZpBueo', secondary: true, topic: 'pencil-grades' },

    { label: 'How to Use a Kneaded Eraser or Gummy Eraser', channel: 'LZM Studio', duration: '4:36', url: 'https://youtube.com/watch?v=EfAwE5ei8Do', secondary: true, topic: 'eraser-technique', note: 'optional follow-up' }
  ]

// --- Selection engine (stage 3) --------------------------------------------
//
// Per section 10: the ONLY active decision-maker. Everything above (bank) and
// below (data layer via `state`) is passive. Functions here either PULL
// (decide what to serve next, read-only) or PUSH (process AI feedback into
// updated state, write-only-via-caller — these functions mutate the `state`
// object passed in, but it's still the caller's job to persist it via
// saveState(), matching every other function in this file).
//
// Evidence-array convention (fixing an ambiguity the design doc doesn't
// pin down explicitly): entries are pushed in chronological order (oldest
// first), so "the most recent N reps" is always `array.slice(-N)`. This is
// the opposite convention from `state.submissions`, which stays newest-first
// via unshift (matching the original app's history list) — flagging this
// clearly since mixing the two up silently would be an easy, hard-to-spot bug.

const WORKING_SET_SIZE = 5;
const INITIAL_WORKING_SET = [
  'line-confidence', 'circle-curve-control', 'proportion-by-eye',
  'value-scale', 'observation-vs-imagination'
];
const WARMUP_CAP = 3;
const PASSED_SKILL_REFRESH_RATE = 4 / 20; // "roughly 4-in-20 selections" (section 6)

// ASSUMPTION (design doc doesn't give a formula — flagging for sign-off):
// every skill in the working set gets a base weight of 1 ("every skill still
// gets some airtime"), plus +1 for every rep in its recent evidence window
// that contained at least one failed criterion ("weaker skills picked more
// often"). Open-ended skills' evidence has no pass/fail, so they only ever
// carry the base weight of 1 from this term. Tune FAIL_WEIGHT_BONUS if this
// under/over-corrects in practice.
const FAIL_WEIGHT_BONUS = 1;

function isFormSkill(skillId){
  return SKILL_META[skillId].category === 'form';
}

function hasPassedAnyFormSkill(state){
  return SKILL_IDS.some(id => isFormSkill(id) && state.skills[id].status === 'passed');
}

// Prerequisites are a hard gate for ENTERING the working set only (section 6) —
// once a skill is already in state.workingSet, this function is never consulted again for it.
function prereqsMet(state, skillId){
  const meta = SKILL_META[skillId];
  const basePrereqsMet = meta.prereqs.every(p => state.skills[p].status === 'passed');
  if(skillId === 'combining-objects'){
    // second prerequisite is "one form skill", not a fixed id (section 1) — resolved here at runtime
    return basePrereqsMet && hasPassedAnyFormSkill(state);
  }
  return basePrereqsMet;
}

// Adds newly-eligible skills into any open working-set slots, using the
// backfill tiebreak order from section 6: all-fit-first, then two-prerequisite
// skills outrank one-prerequisite skills, then listed order (which already
// naturally puts perspective-2pt before boxes-volume, so no separate special
// case is needed for that specific listed tie).
function backfillWorkingSet(state){
  const openSlots = WORKING_SET_SIZE - state.workingSet.length;
  if(openSlots <= 0) return;

  const candidates = SKILL_IDS.filter(id =>
    !state.workingSet.includes(id) &&
    state.skills[id].status !== 'passed' &&
    prereqsMet(state, id)
  );
  if(candidates.length === 0) return;

  const prereqCount = id => id === 'combining-objects' ? 2 : SKILL_META[id].prereqs.length;
  candidates.sort((a, b) => {
    const byPrereqCount = prereqCount(b) - prereqCount(a);
    if(byPrereqCount !== 0) return byPrereqCount;
    return SKILL_IDS.indexOf(a) - SKILL_IDS.indexOf(b);
  });

  state.workingSet.push(...candidates.slice(0, openSlots));
}

// Section 8: warmup pool accumulates permanently — this only ever adds ids,
// never removes them. Call after any operation that could change working-set
// membership or a skill's status (backfill, pass confirmation, feedback processing).
function updateWarmupPool(state){
  SKILL_IDS.forEach(id => {
    const skillState = state.skills[id];
    const meta = SKILL_META[id];
    const qualifies =
      (meta.category === 'foundations' && (skillState.status === 'in-progress' || skillState.status === 'passed')) ||
      state.workingSet.includes(id);
    if(qualifies && !state.warmupPool.includes(id)){
      state.warmupPool.push(id);
    }
  });
}

function computeSkillWeight(state, skillId){
  const recent = state.skills[skillId].fullEvidence.slice(-PASS_RULE.recentWindow);
  const failedReps = recent.filter(e => (e.criteriaResults || []).some(c => c.result === 'fail')).length;
  return 1 + failedReps * FAIL_WEIGHT_BONUS;
}

function weightedRandomPick(items, weights){
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for(let i = 0; i < items.length; i++){
    r -= weights[i];
    if(r <= 0) return items[i];
  }
  return items[items.length - 1];
}

// Section 6, first-pass exception: with zero history, serve the initial
// working set once each in listed order before real weighting starts.
function pickPrimarySkill(state){
  if(state.firstPassRemaining.length > 0){
    return state.firstPassRemaining[0];
  }
  const weights = state.workingSet.map(id => computeSkillWeight(state, id));
  return weightedRandomPick(state.workingSet, weights);
}

// Section 6, passed-skill refresh rule: ~4-in-20 chance to instead serve a
// passed skill as primary via a FULL exercise variant that incidentally
// touches >=2 currently-active working-set skills. Only full-exercise
// variants carry incidentalSkills tags, so this can never pick a drill.
// Returns null when the roll misses or no qualifying variant exists (in
// which case the caller falls back to the normal weighted pick).
function maybePassedSkillRefresh(state){
  if(state.firstPassRemaining.length > 0) return null; // doesn't apply during the first-pass phase
  if(Math.random() >= PASSED_SKILL_REFRESH_RATE) return null;

  const candidates = [];
  SKILL_IDS.forEach(id => {
    if(state.skills[id].status !== 'passed') return;
    (EXERCISE_BANK[id].fullExercises || []).forEach(variant => {
      const activeTouched = (variant.incidentalSkills || []).filter(s => state.workingSet.includes(s));
      if(activeTouched.length >= 2){
        candidates.push({ skillId: id, variant });
      }
    });
  });
  if(candidates.length === 0) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

// Returns the variantId most recently served as this skill's PRIMARY exercise,
// or null if it's never been served. Used to avoid repeating the same variant
// immediately (section 6) — checked against submissions (newest-first).
function getLastVariantId(state, skillId){
  for(const sub of state.submissions){
    if(sub.exercise && sub.exercise.primarySkill === skillId){
      return sub.exercise.variantId;
    }
  }
  return null;
}

// ASSUMPTION (design doc doesn't specify a drill-vs-full ratio — flagging for
// sign-off): 50/50 when the skill has full exercises available, else drill
// only (value-scale). Picks a specific variant, avoiding an immediate repeat
// of the exact same variant unless it's the only one available (section 6).
function pickExerciseForSkill(state, skillId){
  const bank = EXERCISE_BANK[skillId];
  const hasFull = bank.fullExercises && bank.fullExercises.length > 0;
  const kind = hasFull && Math.random() < 0.5 ? 'full' : 'drill';
  const pool = kind === 'full' ? bank.fullExercises : bank.drills;

  const lastVariantId = getLastVariantId(state, skillId);
  let choices = pool;
  if(pool.length > 1 && lastVariantId){
    const filtered = pool.filter(v => v.id !== lastVariantId);
    if(filtered.length > 0) choices = filtered;
  }
  const variant = choices[Math.floor(Math.random() * choices.length)];
  return buildBundle(state, skillId, kind, variant);
}

function criteriaTextFor(skillId){
  const bank = EXERCISE_BANK[skillId];
  return SKILL_META[skillId].checkable ? bank.passCriteria.slice() : bank.assessmentNotes.slice();
}

// Bundles the full exercise package (section 10) — the single unit handed to
// the session screen, which passes it straight to the AI feedback step
// without re-fetching anything from the bank itself.
function buildBundle(state, primarySkillId, kind, variant){
  const incidentalSkills = (variant.incidentalSkills || []).slice();
  const criteriaText = { [primarySkillId]: criteriaTextFor(primarySkillId) };
  incidentalSkills.forEach(id => { criteriaText[id] = criteriaTextFor(id); });

  return {
    primarySkill: primarySkillId,
    incidentalSkills,
    kind,                                    // 'drill' | 'full'
    variantId: variant.id,
    taskText: variant.text,
    referencePhoto: variant.referencePhoto,  // 'none' | 'optional' | 'required'
    referenceNote: variant.referenceNote || null,
    dynamicIncidentalNote: variant.dynamicIncidentalNote || null,
    criteriaText                             // snapshot text — this is what gets stored verbatim on the submission
  };
}

// Main "pull" entry point: decide what exercise to serve next.
function selectNextExercise(state){
  const refresh = maybePassedSkillRefresh(state);
  if(refresh){
    return buildBundle(state, refresh.skillId, 'full', refresh.variant);
  }
  const skillId = pickPrimarySkill(state);
  return pickExerciseForSkill(state, skillId);
}

// Section 8: warmup selection — random 3 when oversubscribed, no weighting.
function selectWarmup(state){
  if(state.warmupPool.length <= WARMUP_CAP) return state.warmupPool.slice();
  const shuffled = state.warmupPool.slice().sort(() => Math.random() - 0.5);
  return shuffled.slice(0, WARMUP_CAP);
}

// Main "push" entry point: turn the AI's raw feedback into updated state.
// `aiRawResult` shape (per skill touched, keyed by skill id):
//   checkable:  { criteriaResults: [{text, result: 'pass'|'fail'|'not-assessable'}] }
//   open-ended: { notAssessable: bool, note: string }
//
// ASSUMPTION (flagging for sign-off): the design doc frames not-assessable as
// a per-criterion outcome, but also says a not-assessable result "does not
// count as a rep... produces a plain retake message, with no other action
// taken" — which reads as all-or-nothing per skill, not partial-credit. So:
// if ANY criterion for a touched skill comes back not-assessable, that whole
// skill's result for this submission is discarded entirely (no evidence, no
// rep, no submission field for it) rather than mixing pass/fail criteria
// with a not-assessable one in the same logged rep.
function processFeedback(state, bundle, aiRawResult, dateStr){
  dateStr = dateStr || new Date().toISOString().slice(0, 10);
  const submissionId = 'sub-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const touchedSkills = [bundle.primarySkill, ...bundle.incidentalSkills];
  const results = {};
  const notAssessableSkills = [];

  touchedSkills.forEach(skillId => {
    const raw = aiRawResult[skillId];
    const meta = SKILL_META[skillId];
    const role = skillId === bundle.primarySkill ? 'primary' : 'incidental';

    const anyNotAssessable = meta.checkable
      ? (raw.criteriaResults || []).some(c => c.result === 'not-assessable')
      : !!raw.notAssessable;

    if(anyNotAssessable){
      notAssessableSkills.push(skillId);
      results[skillId] = { role, notAssessable: true };
      return;
    }

    const skillState = state.skills[skillId];
    const evidenceEntry = {
      submissionId, date: dateStr, role,
      criteriaResults: meta.checkable ? raw.criteriaResults.slice() : null,
      note: meta.checkable ? null : raw.note
    };
    skillState.fullEvidence.push(evidenceEntry);
    if(role === 'primary'){
      skillState.primaryRepCount += 1;
      skillState.primaryEvidence.push(evidenceEntry);
      if(skillState.status === 'not-started') skillState.status = 'in-progress';
    } else {
      skillState.incidentalRepCount += 1;
    }
    if(!meta.checkable){
      skillState.lastCheckIn = dateStr;
    }
    results[skillId] = { role, criteriaResults: evidenceEntry.criteriaResults, note: evidenceEntry.note };
  });

  const anyLogged = touchedSkills.some(id => !notAssessableSkills.includes(id));
  if(anyLogged){
    state.submissions.unshift({
      id: submissionId,
      date: dateStr,
      exercise: { primarySkill: bundle.primarySkill, incidentalSkills: bundle.incidentalSkills, kind: bundle.kind, variantId: bundle.variantId },
      snapshot: { taskText: bundle.taskText, criteriaText: bundle.criteriaText },
      results
    });
  }

  // First-pass exception (section 6): advance the queue only when the skill that just
  // got a REAL primary result is the one currently at the front — incidental exposure to
  // another queued skill in this same submission does NOT consume its turn, and a
  // not-assessable primary result doesn't either ("no other action taken" per section 4).
  // BUG FIX: this dequeue was previously missing entirely — pickPrimarySkill() read
  // firstPassRemaining[0] but nothing ever shifted it, so the first pass got stuck
  // serving the same skill forever instead of advancing through the initial 5.
  if(!notAssessableSkills.includes(bundle.primarySkill) &&
     state.firstPassRemaining.length > 0 &&
     state.firstPassRemaining[0] === bundle.primarySkill){
    state.firstPassRemaining.shift();
  }

  // Pass check (section 7) — only the primary skill's primaryRepCount could have
  // just changed, so only it needs checking here.
  if(!notAssessableSkills.includes(bundle.primarySkill)){
    const meta = SKILL_META[bundle.primarySkill];
    const skillState = state.skills[bundle.primarySkill];
    if(meta.checkable && skillState.status !== 'passed' && !state.pendingPassConfirmation &&
       skillState.primaryRepCount >= PASS_RULE.minPrimaryReps){
      const recent = skillState.primaryEvidence.slice(-PASS_RULE.recentWindow);
      const anyFail = recent.some(e => (e.criteriaResults || []).some(c => c.result === 'fail'));
      if(!anyFail){
        state.pendingPassConfirmation = bundle.primarySkill;
      }
    }
  }

  updateWarmupPool(state);

  return {
    submissionId,
    notAssessableSkills,
    fullyNotAssessable: notAssessableSkills.length === touchedSkills.length
  };
}

// Section 7: resolving the pass confirmation decision.
function confirmPass(state, skillId){
  state.skills[skillId].status = 'passed';
  state.pendingPassConfirmation = null;
  const idx = state.workingSet.indexOf(skillId);
  if(idx !== -1) state.workingSet.splice(idx, 1);
  backfillWorkingSet(state);
  updateWarmupPool(state);
}

function declinePass(state, skillId){
  // "a genuine fresh start" (section 7) — primaryEvidence is wiped alongside
  // the counter so the two stay in lockstep for the next recent-window check.
  // fullEvidence (selection weighting / diagnostic history) is untouched.
  state.skills[skillId].primaryRepCount = 0;
  state.skills[skillId].primaryEvidence = [];
  state.pendingPassConfirmation = null;
}

function createSkillState(){
  return {
    status: 'not-started',       // 'not-started' | 'in-progress' | 'passed'
    primaryRepCount: 0,
    incidentalRepCount: 0,
    primaryEvidence: [],         // [{submissionId, date, role:'primary', criteriaResults}] — drives the pass rule
    fullEvidence: [],            // [{submissionId, date, role, criteriaResults}] — primary+incidental, drives selection weighting
    lastCheckIn: null            // open-ended skills only
  };
}

function createInitialSkillsState(){
  const skills = {};
  SKILL_IDS.forEach(id => { skills[id] = createSkillState(); });
  return skills;
}

function createInitialState(){
  return {
    version: 2,
    skills: createInitialSkillsState(),

    workingSet: INITIAL_WORKING_SET.slice(),        // starts as the 5 no-prerequisite skills (section 6)
    warmupPool: INITIAL_WORKING_SET.slice(),        // accumulates permanently, never shrinks (section 8)
    firstPassRemaining: INITIAL_WORKING_SET.slice(),// first-pass exception queue, listed order (section 6)

    pendingPassConfirmation: null,  // skill id awaiting the in-session confirm/decline decision, or null

    submissions: []             // full history, newest first (unshift) — see per-submission shape in design
                                 // doc section 5. NOTE: does not include photos — those are never persisted,
                                 // only used transiently to get AI feedback (confirmed decision, not an oversight).
  };
}

                                // (not in `state`) because it's mid-flight, not yet a finished submission

let warmupSelection = null;    // {skills, tasks} chosen for this session's warmup, computed once per load

    });

}

function readImageFile(file, onDone){
  const reader = new FileReader();
  reader.onload = () => {
    const result = reader.result;
    const mediaType = file.type || 'image/jpeg';
    const base64 = result.split(',')[1];
    onDone({base64, mediaType, previewUrl: result});
  };
  reader.onerror = () => {
    error = "Couldn't read that image — try a different photo.";
    render();
  };
  reader.readAsDataURL(file);
}

function handleDrawingFile(file){
  readImageFile(file, img => {

    feedback = null;
    error = null;
    render();
  });
}

// Builds the prompt sent to the AI. Per design doc section 4: judged strictly against
// the criteria/notes the bundle already carries (never re-fetches or invents its own),
// allows a variable number of feedback points (each skill contributes exactly as many
// criteria as its bank entry defines — nothing padded or trimmed to a fixed count), and
// asks for pass/fail/not-assessable per criterion rather than a freeform struggle label.
function buildFeedbackPrompt(bundle, hasReferenceImage){
  const skillIds = [bundle.primarySkill, ...bundle.incidentalSkills];

  const skillBlocks = skillIds.map(id => {
    const meta = SKILL_META[id];
    const title = skillTitle(id);
    const role = id === bundle.primarySkill ? 'primary' : 'incidental';
    const items = bundle.criteriaText[id];
    if(meta.checkable){
      const list = items.map((c, i) => `${i + 1}. ${c}`).join('\n');
      return `### ${title} (${role}, checkable)\nCriteria — judge each one independently, a single messy detail should not fail every criterion if the rest are genuinely fine:\n${list}\nRespond with "results": an array of exactly ${items.length} strings, in this same order, each one of "pass", "fail", or "not-assessable".`;
    }
    const list = items.map(n => `- ${n}`).join('\n');
    return `### ${title} (${role}, open-ended — no pass/fail, just an honest written note)\nThings to consider:\n${list}\nRespond with "note" (a short, specific 1-3 sentence comment) and "notAssessable" (boolean).`;
  }).join('\n\n');

  const responseShape = skillIds.map(id => {
    const meta = SKILL_META[id];
    return meta.checkable
      ? `  "${id}": { "results": [${bundle.criteriaText[id].map(() => '"pass"').join(', ')}] }`
      : `  "${id}": { "notAssessable": false, "note": "..." }`;
  }).join(',\n');

  return `You are a warm, precise beginner drawing tutor reviewing a student's practice page for a structured 16-skill curriculum.

Exercise assigned: "${bundle.taskText}"
${hasReferenceImage ? 'A second reference photo was also provided — compare the drawing against it where relevant.' : ''}

Assess ONLY the skill(s) below, using ONLY the specific criteria/notes given for each — do not invent your own criteria or a freeform label for what's wrong.

Use "not-assessable" / notAssessable:true ONLY when the photo genuinely cannot be judged — blurry, cropped, badly lit, or missing/mismatched a required reference photo. Do not use it just because the work is poor; poor work that is clearly visible should be judged "fail", not "not-assessable".

If, and only if, something about pencil grade or eraser technique seems genuinely worth mentioning from what you actually see, you may also include one short top-level "tip" string (e.g. suggesting a softer pencil for deeper darks, or a kneaded eraser for lifting highlights). Leave "tip" as null in the vast majority of cases — most submissions don't need one.

${skillBlocks}

Respond ONLY with strict JSON, no markdown fences, no preamble, in exactly this shape:
{
${responseShape},
  "tip": null
}`;
}

// Turns the AI's raw JSON into the shape processFeedback() expects (Stage 3, unchanged
// since it was tested): {skillId: {criteriaResults:[{text,result}]}} for checkable skills,
// {skillId: {notAssessable, note}} for open-ended. Criterion TEXT comes from the bundle
// (already known client-side) rather than trusting the AI to echo it back — the AI only
// supplies the result for each position, matched by index.
function adaptAiResponseToRaw(bundle, aiJson){
  const skillIds = [bundle.primarySkill, ...bundle.incidentalSkills];
  const raw = {};
  skillIds.forEach(id => {
    const meta = SKILL_META[id];
    const entry = aiJson[id];
    if(!entry) throw new Error('AI response is missing "' + id + '"');
    if(meta.checkable){
      const criteriaText = bundle.criteriaText[id];
      const results = entry.results;
      if(!Array.isArray(results) || results.length !== criteriaText.length){
        throw new Error('AI response for "' + id + '" has the wrong number of results');
      }
      raw[id] = { criteriaResults: criteriaText.map((text, i) => ({ text, result: results[i] })) };
    } else {
      raw[id] = { notAssessable: !!entry.notAssessable, note: entry.note || null };
    }
  });
  return raw;
}

async function getFeedback(){
  if(!uploadedImage || !currentBundle) return;
  if(currentBundle.referencePhoto === 'required' && !referenceImage){
    error = 'This exercise needs a reference photo of ' + (currentBundle.referenceNote || 'the subject') + ' as well — add that before requesting feedback.';
    render();
    return;
  }
  const apiKey = getApiKey();
  if(!apiKey){
    error = "Add your Anthropic API key first (tap \"API key settings\" below).";
    render();
    return;
  }

  loading = true;
  error = null;
  render();

  const bundle = currentBundle;
  const prompt = buildFeedbackPrompt(bundle, !!referenceImage);
  const content = [
    { type: "image", source: { type: "base64", media_type: uploadedImage.mediaType, data: uploadedImage.base64 } }
  ];
  if(referenceImage){
    content.push({ type: "image", source: { type: "base64", media_type: referenceImage.mediaType, data: referenceImage.base64 } });
  }
  content.push({ type: "text", text: prompt });

  try{
    const headers = {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    };
    const workspaceId = getWorkspaceId();
    if(workspaceId){
      headers["anthropic-workspace-id"] = workspaceId;
    }
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1500,
        messages: [{ role: "user", content }]
      })
    });
    const data = await response.json();
    if(data.error){
      throw new Error(data.error.message || 'API error');
    }
    const textBlock = (data.content || []).map(b => b.text || '').join('\n');
    const clean = textBlock.replace(/```json|```/g, '').trim();
    const aiJson = JSON.parse(clean);
    const rawResult = adaptAiResponseToRaw(bundle, aiJson);
    const processResult = processFeedback(state, bundle, rawResult);
    feedback = { rawResult, processResult, tip: aiJson.tip || null };
    saveState();
  }catch(e){
    const msg = String(e.message || '');
    if(msg.toLowerCase().includes('workspace')){
      error = "This API key needs a workspace ID. Open \"API key settings\" below and paste in your workspace ID from console.anthropic.com → Settings → Workspaces.";
    } else if(msg.toLowerCase().includes('authentication') || msg.includes('401')){
      error = "That API key was rejected — double check it's copied correctly, and that billing is set up in the Anthropic Console.";
    } else {
      error = "Couldn't get feedback right now (" + (msg || 'unknown error') + "). Check your connection and try again.";
    }
  }
  loading = false;
  render();
}

function nextExercise(){
  currentBundle = null;
  uploadedImage = null;
  referenceImage = null;
  feedback = null;
  error = null;
  render();
}

function resolvePassConfirm(confirmed){
  const skillId = state.pendingPassConfirmation;
  if(!skillId) return;
  if(confirmed){
    confirmPass(state, skillId);
  } else {
    declinePass(state, skillId);
  }
  saveState();
  nextExercise();
}

function toggleSubmission(id){
  expandedSubmissionId = (expandedSubmissionId === id) ? null : id;
  render();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.version === 2){
        state = parsed;
      }
      // any other/missing version is an incompatible (pre-v2) shape — ignored, start fresh
    }
  }catch(e){
    // no saved state yet, or it was corrupted — start fresh
  }
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    error = "Couldn't save progress to this device's storage.";
    return false;
  }
}

function getApiKey(){
  try{
    let v = localStorage.getItem(API_KEY_STORAGE);
    if(!v){
      const legacy = localStorage.getItem(LEGACY_API_KEY_STORAGE);
      if(legacy){
        v = legacy;
        localStorage.setItem(API_KEY_STORAGE, legacy);
      }
    }
    return v || '';
  }catch(e){
    return '';
  }
}

function setApiKey(key){
  try{
    localStorage.setItem(API_KEY_STORAGE, key.trim());
    return true;
  }catch(e){
    return false;
  }
}

function getWorkspaceId(){
  try{
    let v = localStorage.getItem(WORKSPACE_ID_STORAGE);
    if(!v){
      const legacy = localStorage.getItem(LEGACY_WORKSPACE_ID_STORAGE);
      if(legacy){
        v = legacy;
        localStorage.setItem(WORKSPACE_ID_STORAGE, legacy);
      }
    }
    return v || '';
  }catch(e){
    return '';
  }
}

function setWorkspaceId(id){

  }catch(e){

function exportBackup(){
  const text = JSON.stringify(state);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      backupMessage = "Copied. Paste it somewhere safe (a notes app), or straight into \"Restore from backup\" on the other version of the page.";
      render();
    }).catch(() => {
      showFallbackBackup(text);
    });
  } else {
    showFallbackBackup(text);
  }
}

function showFallbackBackup(text){
  backupMessage = "Couldn't auto-copy — select and copy this manually: <br><textarea class=\"key-input\" rows=\"4\" readonly onclick=\"this.select()\">" + text + "</textarea>";
  render();
}

function toggleImport(){
  showImport = !showImport;
  backupMessage = null;
  render();
}

function importBackup(){
  const box = document.getElementById('importBox');
  if(!box || !box.value.trim()){
    backupMessage = "Paste your backup text into the box first.";
    render();
    return;
  }
  try{
    const parsed = JSON.parse(box.value.trim());
    if(!parsed || parsed.version !== 2){
      backupMessage = "That backup is from an older version of this app and can't be restored here.";
      render();
      return;
    }
    state = Object.assign(createInitialState(), parsed);
    saveState();
    showImport = false;
    backupMessage = "Progress restored.";
    currentBundle = null;
    warmupDone = false;
    warmupSelection = null;
    uploadedImage = null;
    referenceImage = null;
    feedback = null;
  }catch(e){
    backupMessage = "That didn't look like a valid backup — make sure you copied the whole thing.";
  }
  render();
}

}

function renderReferenceUpload(bundle){
  const label = bundle.referencePhoto === 'required' ? 'Reference photo (required)' : 'Reference photo (optional)';
  const hint = bundle.referenceNote ? ` — ${bundle.referenceNote}` : '';
  if(referenceImage){
    return `
      <div class="materials-line" style="margin-top:14px;">📎 <b>${label}</b>${hint}</div>
      <div class="upload-zone" onclick="document.getElementById('referenceFileInput').click()">
        <img src="${referenceImage.previewUrl}" alt="reference photo"/>
        <div>Tap to replace reference photo</div>
      </div>
      <button class="secondary" onclick="clearReferenceImage()">Remove reference photo</button>
    `;
  }
  return `
    <div class="materials-line" style="margin-top:14px;">📎 <b>${label}</b>${hint}</div>
    <div class="upload-zone" onclick="document.getElementById('referenceFileInput').click()">
      📎 Tap to add a reference photo${hint}
    </div>
  `;
}

// Shared between the exercise screen (feedback with no pending decision) and the
// pass-confirmation screen (feedback that triggered one) — same rendering either way.
function renderFeedbackDetail(feedbackObj, bundle){
  const { rawResult, processResult } = feedbackObj;
  const touchedSkills = [bundle.primarySkill, ...bundle.incidentalSkills];
  let html = '';
  touchedSkills.forEach(skillId => {
    const title = skillTitle(skillId);
    const role = skillId === bundle.primarySkill ? 'primary' : 'incidental';
    if(processResult.notAssessableSkills.includes(skillId)){
      html += `<div class="materials-line">🔍 <b>${title}</b> — couldn't be judged from this photo (blurry, cropped, or a missing/mismatched reference photo). No rep counted here — it'll come up again another time.</div>`;
      return;
    }
    const meta = SKILL_META[skillId];
    html += `<span class="note-label">${title}${role === 'incidental' ? ' (incidental)' : ''}</span>`;
    if(meta.checkable){
      html += rawResult[skillId].criteriaResults.map(c =>
        `<div class="${c.result === 'pass' ? 'strength-line' : 'focus-line'}">${c.text}</div>`
      ).join('');
    } else {
      html += `<div class="note">"${rawResult[skillId].note}"</div>`;
    }
  });
  if(feedbackObj.tip){
    html += `<div class="materials-line">✏️ ${feedbackObj.tip}</div>`;
  }
  return html;
}

function renderWarmupCard(){
  const tasks = warmupSelection.tasks;
  return `
    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Warmup</div>
        <h2>Loosen up first</h2>
        <p class="why">Quick and unscored — no photo, no feedback, doesn't touch your progress. Just a few reps to warm your hand up before today's real exercise.</p>
        ${tasks.map(t => `<div class="task-box" style="margin-bottom:10px;"><b>${t.title}:</b> ${t.text}</div>`).join('')}
        <button class="accent" onclick="startExercises()">Done warming up — start today's exercise</button>
      </div>
    </div>
  `;
}

function renderPassConfirmationCard(){
  const skillId = state.pendingPassConfirmation;
  const title = skillTitle(skillId);
  const feedbackBlock = (feedback && currentBundle && currentBundle.primarySkill === skillId)
    ? renderFeedbackDetail(feedback, currentBundle)
    : '';
  return `
    <div class="card revisit">
      <div class="card-inner">
        <div class="lesson-num revisit">Pass check</div>
        <h2>${title}</h2>
        ${feedbackBlock}
        <div class="remedial-banner" style="color:var(--sage); background:#EFF1E6; border-color:#C9D4BD;">
          🎯 You've now logged ${PASS_RULE.minPrimaryReps}+ reps of "${title}" with no failed criteria in the last ${PASS_RULE.recentWindow}. Pass it, or keep working on it a while longer?
        </div>
        <div class="btn-row">
          <button class="accent" onclick="resolvePassConfirm(true)">Yes — pass this skill</button>
          <button class="secondary" onclick="resolvePassConfirm(false)">Not yet — keep practicing</button>
        </div>
        <p class="key-note">Choosing "keep practicing" resets this skill's rep count to 0 for a genuine fresh run at it — your submission history isn't deleted, just the pass-progress counter.</p>
      </div>
    </div>
  `;
}

function renderExerciseCard(){
  const bundle = currentBundle;
  const bank = EXERCISE_BANK[bundle.primarySkill];
  const kindLabel = bundle.kind === 'drill' ? 'Drill' : 'Full exercise';

  let feedbackHtml = '';
  if(loading){
    feedbackHtml = `<div class="loading"><div class="pencil-spin"></div> Looking over your page…</div>`;
  } else if(feedback){
    feedbackHtml = `
      ${renderFeedbackDetail(feedback, bundle)}
      <div class="btn-row">
        <button class="accent" onclick="nextExercise()">Continue to next exercise</button>
      </div>
    `;
  } else if(uploadedImage){
    feedbackHtml = `
      <button onclick="getFeedback()">Get feedback on this page</button>
      <button class="secondary" onclick="nextExercise()">Skip feedback, just get another exercise</button>
    `;
  }

  return `
    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">${kindLabel}</div>
        <h2>${skillTitle(bundle.primarySkill)}</h2>
        ${bundle.incidentalSkills.length ? `<p class="why">Also touches: ${bundle.incidentalSkills.map(skillTitle).join(', ')}${bundle.dynamicIncidentalNote ? ' — ' + bundle.dynamicIncidentalNote : ''}</p>` : ''}
        ${renderVideoLinksForBank(bank)}
        <div class="task-box">${bundle.taskText}</div>
        ${bundle.referencePhoto !== 'none' ? renderReferenceUpload(bundle) : ''}
        ${renderDrawingUpload()}
        <input type="file" id="drawingFileInput" accept="image/*" capture="environment" onchange="handleDrawingFile(this.files[0])"/>
        ${bundle.referencePhoto !== 'none' ? `<input type="file" id="referenceFileInput" accept="image/*" capture="environment" onchange="handleReferenceFile(this.files[0])"/>` : ''}
        ${feedbackHtml}
        ${error ? `<div class="err">${error}</div>` : ''}
      </div>
    </div>
  `;
}

function renderSubmissionHistory(){
  if(state.submissions.length === 0) return '<div class="empty">No submissions logged yet.</div>';
  return state.submissions.slice(0, 10).map(sub => {
    const isOpen = expandedSubmissionId === sub.id;
    const primaryTitle = skillTitle(sub.exercise.primarySkill);
    const kindLabel = sub.exercise.kind === 'drill' ? 'drill' : 'full';
    let detail = '';
    if(isOpen){
      const skillIds = [sub.exercise.primarySkill, ...sub.exercise.incidentalSkills];
      detail = `<div class="history-detail">` + skillIds.map(id => {
        const r = sub.results[id];
        if(!r) return '';
        const title = skillTitle(id);
        const roleTag = r.role === 'incidental' ? ' (incidental)' : '';
        if(r.notAssessable){
          return `<div class="materials-line">${title}${roleTag}: not assessable this time</div>`;
        }
        if(r.criteriaResults){
          return `<span class="note-label">${title}${roleTag}</span>` +
            r.criteriaResults.map(c => `<div class="${c.result === 'pass' ? 'strength-line' : 'focus-line'}">${c.text}</div>`).join('');
        }
        return `<span class="note-label">${title}${roleTag}</span><div class="note">"${r.note}"</div>`;
      }).join('') + `</div>`;
    }
    return `
      <div>
        <div class="history-item" style="cursor:pointer;" onclick="toggleSubmission('${sub.id}')">
          <span>${primaryTitle} <span class="kind rep">${kindLabel}</span></span>
          <span>${sub.date} ${isOpen ? '▲' : '▼'}</span>
        </div>
        ${detail}
      </div>
    `;
  }).join('');
}

// Stage 6: purely informational, fully read-only (section 9) — no interactive
// controls, no writes. Reads only from the finished data model.
function renderSkillsViewCard(){
  const passed = SKILL_IDS.filter(id => state.skills[id].status === 'passed');
  const inRotation = SKILL_IDS.filter(id => state.workingSet.includes(id));
  const future = SKILL_IDS.filter(id => !state.workingSet.includes(id) && state.skills[id].status !== 'passed');

  function rotationLine(id){
    const meta = SKILL_META[id];
    const label = !meta.checkable
      ? 'open-ended'
      : (state.skills[id].primaryRepCount > 0
          ? `${state.skills[id].primaryRepCount}/${PASS_RULE.minPrimaryReps} reps`
          : 'not started');
    return `<div class="history-item"><span>${skillTitle(id)}</span><span>${label}</span></div>`;
  }

  return `
    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Skills</div>
        <h2>Your 16 skills</h2>

        <span class="note-label">Passed (${passed.length})</span>
        ${passed.length ? `<div>${passed.map(id => `<span class="tag">${skillTitle(id)}</span>`).join('')}</div>` : '<div class="empty">None yet.</div>'}

        <span class="note-label" style="margin-top:16px; display:block;">In rotation (${inRotation.length})</span>
        ${inRotation.length ? inRotation.map(rotationLine).join('') : '<div class="empty">Nothing in rotation.</div>'}

        <span class="note-label" style="margin-top:16px; display:block;">Future skills (${future.length})</span>
        ${future.length ? `<div>${future.map(id => `<span class="tag">${skillTitle(id)}</span>`).join('')}</div>` : '<div class="empty">Nothing waiting.</div>'}
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');

  let mainCardHtml;
  let screenLabel;
  if(state.pendingPassConfirmation){
    mainCardHtml = renderPassConfirmationCard();
    screenLabel = 'Pass check';
  } else if(showSkillsView){
    mainCardHtml = renderSkillsViewCard();
    screenLabel = 'Skills';
  } else if(!warmupDone){
    ensureWarmupSelection();
    mainCardHtml = renderWarmupCard();
    screenLabel = 'Warmup';
  } else {
    ensureCurrentBundle();
    mainCardHtml = renderExerciseCard();
    screenLabel = currentBundle.kind === 'drill' ? 'Drill' : 'Full exercise';
  }

  const passedCount = SKILL_IDS.filter(id => state.skills[id].status === 'passed').length;
  // the skills-view toggle is hidden during a pending pass decision — that's the one
  // moment this decision can be made (section 7), so nothing should let you navigate past it
  const skillsNavHtml = state.pendingPassConfirmation ? '' : `
    <div class="settings-row" style="margin-bottom:14px;">
      <a onclick="toggleSkillsView()">${showSkillsView ? '← Back to exercises' : 'View your 16 skills →'}</a>
    </div>`;

  app.innerHTML = `
    <header>
      <div class="eyebrow"><span>Sketchbook</span><span>${passedCount}/16 skills passed · ${screenLabel}</span></div>
      <h1>Your drawing tutor</h1>
      <p class="tagline">A 16-skill tracking engine with feedback after every page. Runs standalone with your own API key.</p>
    </header>

    ${skillsNavHtml}

    <div class="card">
      <div class="card-inner">
        ${renderKeySettings()}
      </div>
    </div>

    ${mainCardHtml}

    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Log</div>
        <h2 style="font-size:18px;">Recent submissions</h2>
        <div>${renderSubmissionHistory()}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Backup</div>
        <h2 style="font-size:18px;">Move progress between devices/browsers</h2>
        <p class="key-note">Progress is tied to this exact page's origin (the URL/path it's opened from). If you ever open the file a different way and your progress looks reset, use this to carry it across — it does not include your API key.</p>
        <div class="btn-row">
          <button class="secondary" onclick="exportBackup()">Copy backup to clipboard</button>
          <button class="secondary" onclick="toggleImport()">Restore from backup</button>
        </div>
        ${showImport ? `
          <textarea id="importBox" class="key-input" rows="4" placeholder="Paste your backup text here"></textarea>
          <button onclick="importBackup()">Restore this backup</button>
        ` : ''}
        ${backupMessage ? `<p class="key-note">${backupMessage}</p>` : ''}
      </div>
    </div>

    <div class="reset-link"><a onclick="if(confirm('Reset all progress? This clears every skill\\'s status and history.')) resetProgress()">Reset all progress</a></div>
  `;
}

loadState();
</script>
</body>
</html>
