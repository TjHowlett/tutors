<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — a drawing tutor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%8F%EF%B8%8F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1ECE0;
    --paper-line: #D8D0BC;
    --graphite: #2B2A28;
    --graphite-soft: #6B6459;
    --red-pen: #B23A2E;
    --ochre: #C68A2E;
    --sage: #6E7C59;
    --card-shadow: 0 1px 0 rgba(43,42,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px),
      var(--paper);
    color:var(--graphite);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--graphite-soft);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  h1{
    font-size:30px;
    margin:4px 0 2px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .tagline{color:var(--graphite-soft); font-size:14px; margin:0;}

  .progress-row{display:flex; gap:5px; margin-top:14px;}
  .peg{
    flex:1; height:6px; border-radius:3px;
    background: var(--paper-line);
  }
  .peg.done{background: var(--sage);}
  .peg.current{background: var(--ochre);}

  .card{
    background: #FBF9F2;
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:20px 20px 22px;
    margin-bottom:18px;
    box-shadow: var(--card-shadow);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background: var(--ochre);
    border-radius:2px;
  }
  .card.remedial::before{background: var(--red-pen);}
  .card-inner{padding-left:14px;}

  .lesson-num{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--ochre); font-weight:500;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .lesson-num.remedial{color:var(--red-pen);}
  h2{margin:4px 0 10px; font-size:22px;}
  .why{
    font-size:14.5px; color:var(--graphite-soft); line-height:1.5;
    margin:0 0 14px; font-style:italic;
  }
  .task-box{
    background: var(--paper);
    border:1px dashed var(--paper-line);
    border-radius:3px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.5;
  }
  .task-box b{color:var(--graphite);}

  .remedial-banner{
    background: #FBEDE9;
    border:1px solid #E4B7AC;
    color: var(--red-pen);
    border-radius:3px;
    padding:10px 14px;
    font-size:13.5px;
    line-height:1.45;
    margin-bottom:14px;
    font-family:'JetBrains Mono', monospace;
  }

  .video-links{margin:12px 0 4px; display:flex; flex-direction:column; gap:6px;}
  .video-link{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--sage);
    text-decoration:none;
    border:1px solid var(--paper-line);
    background:#F6F3E9;
    border-radius:3px;
    padding:8px 10px;
    transition: border-color .15s, background .15s;
  }
  .video-link:hover{border-color:var(--sage); background:#EFF1E6;}
  .video-link .play{font-size:13px; flex-shrink:0;}

  .upload-zone{
    margin-top:16px;
    border:2px dashed var(--paper-line);
    border-radius:4px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s, background .15s;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--graphite-soft);
  }
  .upload-zone:hover{border-color:var(--ochre); background:#FDF6E8;}
  .upload-zone img{max-width:100%; max-height:260px; border-radius:3px; display:block; margin:0 auto 10px;}
  .upload-zone input{display:none;}

  button{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:0.02em;
    border:none;
    border-radius:3px;
    padding:12px 18px;
    cursor:pointer;
    background: var(--graphite);
    color: var(--paper);
    width:100%;
    margin-top:10px;
    transition: transform .1s, opacity .15s;
  }
  button:hover{opacity:0.88;}
  button:active{transform: scale(0.99);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.secondary{background:transparent; color:var(--graphite); border:1px solid var(--paper-line);}
  button.accent{background: var(--sage);}
  .btn-row{display:flex; gap:8px;}
  .btn-row button{margin-top:10px;}

  .loading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--graphite-soft);
    margin-top:14px;
  }
  .pencil-spin{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--paper-line); border-top-color:var(--ochre);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .note{
    font-family:'Caveat', cursive;
    font-size:22px;
    line-height:1.35;
    color:var(--red-pen);
    margin:16px 0 4px;
    transform: rotate(-0.4deg);
  }
  .note-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--graphite-soft); margin-top:16px; display:block;
  }
  .strength-line{
    font-size:14.5px; line-height:1.5; margin:4px 0;
    padding-left:16px; position:relative;
  }
  .strength-line::before{content:"+"; position:absolute; left:0; color:var(--sage); font-weight:700;}
  .focus-line{
    font-size:14.5px; line-height:1.5; margin:4px 0;
    padding-left:16px; position:relative;
  }
  .focus-line::before{content:"→"; position:absolute; left:0; color:var(--red-pen);}

  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    background: #FDF6E8;
    border:1px solid var(--paper-line);
    color: var(--graphite-soft);
    padding:4px 9px;
    border-radius:12px;
    margin:3px 5px 3px 0;
  }
  .tag b{color:var(--red-pen); font-weight:600;}

  .history-item{
    border-top:1px solid var(--paper-line);
    padding:10px 0;
    font-size:13.5px;
    display:flex; justify-content:space-between; gap:10px;
    color: var(--graphite-soft);
  }
  .history-item span:first-child{color:var(--graphite); font-weight:600;}
  .history-item .kind{
    font-family:'JetBrains Mono', monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .history-item .kind.remedial{color:var(--red-pen);}
  .history-item .kind.rep{color:var(--ochre);}
  .history-detail{
    padding:4px 0 14px 4px;
    border-bottom:1px solid var(--paper-line);
  }
  .history-detail.empty{
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    color:var(--graphite-soft); padding-bottom:14px;
  }

  .empty{
    text-align:center; color:var(--graphite-soft); font-size:13.5px;
    font-family:'JetBrains Mono', monospace; padding:10px 0;
  }
  .err{
    color:var(--red-pen); font-size:13px; font-family:'JetBrains Mono', monospace;
    margin-top:10px;
  }
  .reset-link{text-align:center; margin-top:30px;}
  .reset-link a{
    color:var(--graphite-soft); font-size:12px; font-family:'JetBrains Mono', monospace;
    text-decoration:underline; cursor:pointer;
  }

  .settings-row{
    display:flex; gap:8px; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--graphite-soft);
  }
  .settings-row a{color:var(--sage); cursor:pointer; text-decoration:underline;}
  .key-input{
    width:100%; font-family:'JetBrains Mono', monospace; font-size:13px;
    padding:10px 12px; border:1px solid var(--paper-line); border-radius:3px;
    background:#fff; margin-top:8px;
  }
  .key-note{font-size:12px; color:var(--graphite-soft); line-height:1.5; margin:8px 0 0;}
  .key-status{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    margin-top:8px;
  }
  .key-status.ok{color:var(--sage);}
  .key-status.missing{color:var(--red-pen);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const CURRICULUM = [
  {
    title: "Line control",
    why: "Almost every 'I can't draw' problem is really a hand-eye coordination gap, not an ideas gap. This closes that gap first.",
    task: "Draw <b>20 straight lines</b> (mix of lengths and angles), <b>20 circles</b>, and <b>20 curved lines</b> — freehand, no ruler, no guides. Aim for one confident stroke per shape rather than several short corrective ones.",
    video: {label: "Drawabox — Lesson 1: Lines, Ellipses & Boxes", url: "https://drawabox.com/lesson/1"}
  },
  {
    title: "Ellipses & consistency",
    why: "Ellipses show up everywhere (cups, wheels, eyes) and reveal whether your hand can hold a curve steady while it changes direction.",
    task: "Draw <b>30 ellipses</b> of varying sizes, rotating your page or wrist for each. Then pick your best 5 and go over them once more, matching the original line exactly.",
    video: {label: "Drawabox — Ellipses (video)", url: "https://www.youtube.com/watch?v=tHJ3rzk6kno"}
  },
  {
    title: "Basic perspective — boxes",
    why: "Boxes in perspective are the foundation for drawing almost any solid object convincingly.",
    task: "Draw <b>10 boxes</b> freehand: start with 5 in one-point perspective, then 5 in two-point. Don't worry about neatness — focus on the vanishing lines converging correctly.",
    video: {label: "Drawing boxes in 1-point perspective", url: "https://www.youtube.com/watch?v=fEL31f0FOx0"},
    video2: {label: "Drawing boxes in 2-point perspective", url: "https://www.youtube.com/watch?v=p95xfhtyBqA"}
  },
  {
    title: "Proportion basics",
    why: "Before shading or detail, the biggest visible errors in a drawing are almost always proportion errors.",
    task: "Choose a simple object near you (a mug, a shoe, a phone). Draw it <b>3 times</b>, spending under 3 minutes each, focusing only on getting the overall proportions right — ignore detail entirely.",
    video: {label: "Proko — How to Draw Accurate Proportions", url: "https://www.youtube.com/watch?v=1J7RQvKnWf4"}
  },
  {
    title: "Value & shading",
    why: "Shading is what turns a flat outline into something that reads as three-dimensional.",
    task: "Draw a <b>value scale</b> (a strip from white to black in 6 steps using only pencil pressure), then shade one simple sphere using at least 4 of those values.",
    video: {label: "Proko — How to See Values Correctly", url: "https://www.proko.com/course-lesson/how-to-see-values-correctly"}
  },
  {
    title: "Form — cylinders & spheres",
    why: "Almost every complex object breaks down into these two forms — mastering them generalises to everything else.",
    task: "Draw <b>3 cylinders</b> from different angles and <b>3 spheres</b>, adding simple shading to each to suggest roundness.",
    video: {label: "How to Draw a Sphere, Cylinder, Cone, Cube", url: "https://www.youtube.com/watch?v=NlaG6ecO3JQ"}
  },
  {
    title: "Simple still life",
    why: "This is the first lesson where everything so far — line, proportion, form, shading — gets combined in one drawing.",
    task: "Set up <b>2–3 simple objects</b> together (mug, book, apple) and draw the whole group in one sketch, spending no more than 20 minutes.",
    video: {label: "Simple still life — beginner pencil tutorial", url: "https://www.youtube.com/watch?v=fmXiWP5HITo"}
  },
  {
    title: "Perspective — interiors",
    why: "Applying perspective to a real space (rather than an isolated box) is where it starts to feel genuinely useful.",
    task: "Sit in a room and draw the <b>corner of it</b> — where two walls and the floor meet — using one or two-point perspective to place the furniture roughly.",
    video: {label: "Drawing a room in 1-point perspective", url: "https://www.youtube.com/watch?v=k-6lQxWY33A"}
  }
];

const STORAGE_KEY = 'drawing-tutor-progress-state';
const API_KEY_STORAGE = 'drawing-tutor-anthropic-key';
const WORKSPACE_ID_STORAGE = 'drawing-tutor-anthropic-workspace-id';
// old names, kept only so existing saved data migrates automatically the first time
// this runs under the renamed keys — safe to remove these three lines after that happens
const LEGACY_STORAGE_KEY = 'sketchbook-progress-state';
const LEGACY_API_KEY_STORAGE = 'sketchbook-anthropic-key';
const LEGACY_WORKSPACE_ID_STORAGE = 'sketchbook-anthropic-workspace-id';
const REMEDIAL_THRESHOLD = 2;
const MODEL = "claude-sonnet-5";

let state = {
  currentLesson: 0,
  mode: 'normal',
  remedialTag: null,
  remedialDone: {},
  history: [],
  struggleCounts: {}
};

let uploadedImage = null;
let feedback = null;
let loading = false;
let error = null;
let showKeySettings = false;
let keyInputDraft = '';
let workspaceInputDraft = '';
let showImport = false;
let backupMessage = null;
let expandedHistoryId = null;

function toggleHistoryItem(id){
  expandedHistoryId = (expandedHistoryId === id) ? null : id;
  render();
}

function loadState(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if(legacy){
        raw = legacy;
        localStorage.setItem(STORAGE_KEY, legacy); // migrate silently to the new key name
      }
    }
    if(raw){
      state = Object.assign(state, JSON.parse(raw));
    }
  }catch(e){
    // no saved state yet, or it was corrupted — start fresh
  }
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    error = "Couldn't save progress to this device's storage.";
    return false;
  }
}

function getApiKey(){
  try{
    let v = localStorage.getItem(API_KEY_STORAGE);
    if(!v){
      const legacy = localStorage.getItem(LEGACY_API_KEY_STORAGE);
      if(legacy){
        v = legacy;
        localStorage.setItem(API_KEY_STORAGE, legacy);
      }
    }
    return v || '';
  }catch(e){
    return '';
  }
}

function setApiKey(key){
  try{
    localStorage.setItem(API_KEY_STORAGE, key.trim());
    return true;
  }catch(e){
    return false;
  }
}

function getWorkspaceId(){
  try{
    let v = localStorage.getItem(WORKSPACE_ID_STORAGE);
    if(!v){
      const legacy = localStorage.getItem(LEGACY_WORKSPACE_ID_STORAGE);
      if(legacy){
        v = legacy;
        localStorage.setItem(WORKSPACE_ID_STORAGE, legacy);
      }
    }
    return v || '';
  }catch(e){
    return '';
  }
}

function setWorkspaceId(id){
  try{
    localStorage.setItem(WORKSPACE_ID_STORAGE, id.trim());
    return true;
  }catch(e){
    return false;
  }
}

function toggleKeySettings(){
  showKeySettings = !showKeySettings;
  keyInputDraft = getApiKey();
  workspaceInputDraft = getWorkspaceId();
  render();
}

function saveApiKey(){
  const input = document.getElementById('apiKeyInput');
  const wsInput = document.getElementById('workspaceIdInput');
  if(input){
    setApiKey(input.value);
  }
  if(wsInput){
    setWorkspaceId(wsInput.value);
  }
  showKeySettings = false;
  error = null;
  render();
}

function currentLessonObj(){
  return CURRICULUM[state.currentLesson];
}

function renderVideoLinks(){
  const lesson = currentLessonObj();
  if(!lesson.video) return '';
  let html = `<div class="video-links">
    <a class="video-link" href="${lesson.video.url}" target="_blank" rel="noopener noreferrer"><span class="play">▶</span> ${lesson.video.label}</a>`;
  if(lesson.video2){
    html += `<a class="video-link" href="${lesson.video2.url}" target="_blank" rel="noopener noreferrer"><span class="play">▶</span> ${lesson.video2.label}</a>`;
  }
  html += `</div>`;
  return html;
}

function currentTaskHtml(){
  const lesson = currentLessonObj();
  if(state.mode === 'remedial' && state.remedialTag){
    const plain = state.remedialTag.replace(/-/g, ' ');
    return `<b>Focused rep:</b> "${plain}" has come up more than once. Do the "${lesson.title}" task again, but slow right down and consciously correct for this specific issue on every shape before moving to the next one.`;
  }
  return lesson.task;
}

function currentTaskPlainForPrompt(){
  const lesson = currentLessonObj();
  if(state.mode === 'remedial' && state.remedialTag){
    const plain = state.remedialTag.replace(/-/g, ' ');
    return `Focused remedial rep of "${lesson.title}": the student is specifically working on correcting "${plain}", which has shown up repeatedly. Original task: ${lesson.task.replace(/<[^>]+>/g,'')}`;
  }
  return lesson.task.replace(/<[^>]+>/g,'');
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    const result = reader.result;
    const mediaType = file.type || 'image/jpeg';
    const base64 = result.split(',')[1];
    uploadedImage = {base64, mediaType, previewUrl: result};
    feedback = null;
    error = null;
    render();
  };
  reader.onerror = () => {
    error = "Couldn't read that image — try a different photo.";
    render();
  };
  reader.readAsDataURL(file);
}

async function getFeedback(){
  if(!uploadedImage) return;
  const apiKey = getApiKey();
  if(!apiKey){
    error = "Add your Anthropic API key first (tap \"API key settings\" below).";
    render();
    return;
  }

  loading = true;
  error = null;
  render();

  const lesson = currentLessonObj();
  const prompt = `You are a warm, precise beginner drawing tutor reviewing a student's practice page.
Lesson: "${lesson.title}"
Task assigned: "${currentTaskPlainForPrompt()}"

Look at the uploaded photo of their practice page and respond ONLY with strict JSON, no markdown fences, no preamble, in exactly this shape:
{
  "strengths": ["short specific strength", "short specific strength"],
  "focus_areas": ["short specific thing to work on"],
  "struggle_tag": "a 2-4 word lowercase-hyphenated tag naming the single main recurring issue, e.g. 'wobbly-lines' or 'uneven-ellipses' or 'flat-shading'",
  "encouragement": "one short warm sentence, no more than 20 words, specific to what you saw"
}
Keep strengths and focus_areas to 1-2 items each, each under 15 words. Be specific to what's actually visible, not generic. If this is a focused remedial rep, judge specifically whether the named issue improved.`;

  try{
    const headers = {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    };
    const workspaceId = getWorkspaceId();
    if(workspaceId){
      headers["anthropic-workspace-id"] = workspaceId;
    }
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            {type: "image", source: {type: "base64", media_type: uploadedImage.mediaType, data: uploadedImage.base64}},
            {type: "text", text: prompt}
          ]
        }]
      })
    });
    const data = await response.json();
    if(data.error){
      throw new Error(data.error.message || 'API error');
    }
    const textBlock = (data.content || []).map(b => b.text || '').join('\n');
    const clean = textBlock.replace(/```json|```/g, '').trim();
    feedback = JSON.parse(clean);
  }catch(e){
    const msg = String(e.message || '');
    if(msg.toLowerCase().includes('workspace')){
      error = "This API key needs a workspace ID. Open \"API key settings\" below and paste in your workspace ID from console.anthropic.com → Settings → Workspaces.";
    } else if(msg.toLowerCase().includes('authentication') || msg.includes('401')){
      error = "That API key was rejected — double check it's copied correctly, and that billing is set up in the Anthropic Console.";
    } else {
      error = "Couldn't get feedback right now (" + (msg || 'unknown error') + "). Check your connection and try again.";
    }
  }
  loading = false;
  render();
}

function logHistory(kind){
  const lesson = currentLessonObj();
  state.history.unshift({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    date: new Date().toISOString().slice(0,10),
    lessonIndex: state.currentLesson,
    title: lesson.title,
    tag: feedback ? feedback.struggle_tag : null,
    strengths: feedback ? feedback.strengths : null,
    focusAreas: feedback ? feedback.focus_areas : null,
    encouragement: feedback ? feedback.encouragement : null,
    kind
  });
  if(feedback && feedback.struggle_tag){
    const t = feedback.struggle_tag;
    state.struggleCounts[t] = (state.struggleCounts[t] || 0) + 1;
  }
}

function saveAndContinue(){
  if(!feedback) return;
  const tag = feedback.struggle_tag;

  if(state.mode === 'remedial'){
    logHistory('remedial');
    if(tag) state.remedialDone[tag] = true;
    state.mode = 'normal';
    state.remedialTag = null;
    if(state.currentLesson < CURRICULUM.length - 1){
      state.currentLesson += 1;
    }
  } else {
    logHistory('normal');
    const willTriggerRemedial = tag &&
      state.struggleCounts[tag] >= REMEDIAL_THRESHOLD &&
      !state.remedialDone[tag];
    if(willTriggerRemedial){
      state.mode = 'remedial';
      state.remedialTag = tag;
    } else {
      if(state.currentLesson < CURRICULUM.length - 1){
        state.currentLesson += 1;
      }
    }
  }

  uploadedImage = null;
  feedback = null;
  saveState();
  render();
}

function repeatLesson(){
  if(feedback){
    logHistory('rep');
  }
  uploadedImage = null;
  feedback = null;
  saveState();
  render();
}

function resetProgress(){
  state = {currentLesson: 0, mode:'normal', remedialTag:null, remedialDone:{}, history: [], struggleCounts: {}};
  uploadedImage = null;
  feedback = null;
  error = null;
  saveState();
  render();
}

function exportBackup(){
  const text = JSON.stringify(state);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      backupMessage = "Copied. Paste it somewhere safe (a notes app), or straight into \"Restore from backup\" on the other version of the page.";
      render();
    }).catch(() => {
      showFallbackBackup(text);
    });
  } else {
    showFallbackBackup(text);
  }
}

function showFallbackBackup(text){
  backupMessage = "Couldn't auto-copy — select and copy this manually: <br><textarea class=\"key-input\" rows=\"4\" readonly onclick=\"this.select()\">" + text + "</textarea>";
  render();
}

function toggleImport(){
  showImport = !showImport;
  backupMessage = null;
  render();
}

function importBackup(){
  const box = document.getElementById('importBox');
  if(!box || !box.value.trim()){
    backupMessage = "Paste your backup text into the box first.";
    render();
    return;
  }
  try{
    const parsed = JSON.parse(box.value.trim());
    state = Object.assign({
      currentLesson: 0, mode:'normal', remedialTag:null, remedialDone:{}, history: [], struggleCounts: {}
    }, parsed);
    saveState();
    showImport = false;
    backupMessage = "Progress restored.";
    uploadedImage = null;
    feedback = null;
  }catch(e){
    backupMessage = "That didn't look like a valid backup — make sure you copied the whole thing.";
  }
  render();
}

function renderStruggleTags(){
  const entries = Object.entries(state.struggleCounts).sort((a,b) => b[1]-a[1]);
  if(entries.length === 0) return '<div class="empty">No recurring struggles logged yet — they\'ll show up here as patterns emerge.</div>';
  return entries.map(([tag,count]) => `<span class="tag">${tag}${count>1 ? ` <b>×${count}</b>` : ''}</span>`).join('');
}

function renderHistory(){
  if(state.history.length === 0) return '<div class="empty">No completed lessons yet.</div>';
  return state.history.slice(0,10).map((h, i) => {
    const id = h.id || ('legacy-' + i); // older entries saved before feedback was tracked won't have an id
    const isOpen = expandedHistoryId === id;
    const hasFeedback = h.strengths || h.focusAreas || h.encouragement;
    let detail = '';
    if(isOpen){
      detail = hasFeedback ? `
        <div class="history-detail">
          ${h.strengths ? `<span class="note-label">Strengths</span>${h.strengths.map(s => `<div class="strength-line">${s}</div>`).join('')}` : ''}
          ${h.focusAreas ? `<span class="note-label">Focus next</span>${h.focusAreas.map(f => `<div class="focus-line">${f}</div>`).join('')}` : ''}
          ${h.encouragement ? `<div class="note">"${h.encouragement}"</div>` : ''}
        </div>` : `<div class="history-detail empty">No feedback saved for this entry.</div>`;
    }
    return `
      <div>
        <div class="history-item" style="cursor:pointer;" onclick="toggleHistoryItem('${id}')">
          <span>Lesson ${h.lessonIndex+1} · ${h.title} <span class="kind ${h.kind}">${h.kind}</span></span>
          <span>${h.date} ${isOpen ? '▲' : '▼'}</span>
        </div>
        ${detail}
      </div>
    `;
  }).join('');
}

function renderKeySettings(){
  const hasKey = !!getApiKey();
  if(!showKeySettings){
    return `
      <div class="settings-row">
        <a onclick="toggleKeySettings()">API key settings</a>
        <span class="key-status ${hasKey ? 'ok' : 'missing'}">${hasKey ? '● key saved on this device' : '● no key set'}</span>
      </div>`;
  }
  return `
    <div class="settings-row"><a onclick="toggleKeySettings()">Hide API key settings</a></div>
    <input class="key-input" id="apiKeyInput" type="password" placeholder="sk-ant-..." value="${keyInputDraft.replace(/"/g,'')}"/>
    <input class="key-input" id="workspaceIdInput" type="text" placeholder="wrkspc_... (only needed for some keys)" value="${workspaceInputDraft.replace(/"/g,'')}"/>
    <button class="secondary" onclick="saveApiKey()">Save to this device</button>
    <p class="key-note">Stored only in this browser's local storage on this device — never sent anywhere except directly to Anthropic's API when you request feedback. Get a key at console.anthropic.com (Settings → API Keys), with billing set up under Settings → Billing. If your key is scoped to "all workspaces" rather than one specific workspace, also paste its Workspace ID from Settings → Workspaces — otherwise leave that field blank.</p>
  `;
}

function render(){
  const app = document.getElementById('app');
  const lesson = currentLessonObj();
  const isLastLesson = state.currentLesson === CURRICULUM.length - 1;
  const isRemedial = state.mode === 'remedial';

  const pegs = CURRICULUM.map((_, i) => {
    let cls = 'peg';
    if(i < state.currentLesson) cls += ' done';
    else if(i === state.currentLesson) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  let uploadHtml = '';
  if(uploadedImage){
    uploadHtml = `
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <img src="${uploadedImage.previewUrl}" alt="your practice page"/>
        <div>Tap to replace photo</div>
      </div>`;
  } else {
    uploadHtml = `
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        📷 Tap to upload a photo of your practice page
      </div>`;
  }

  let feedbackHtml = '';
  if(loading){
    feedbackHtml = `<div class="loading"><div class="pencil-spin"></div> Looking over your page…</div>`;
  } else if(feedback){
    let continueLabel = isRemedial
      ? (isLastLesson ? 'Wrap up remedial rep & finish' : 'Wrap up remedial rep & continue')
      : (isLastLesson ? 'Complete final lesson' : 'Save & continue to next lesson');
    feedbackHtml = `
      <span class="note-label">Strengths</span>
      ${feedback.strengths.map(s => `<div class="strength-line">${s}</div>`).join('')}
      <span class="note-label">Focus next</span>
      ${feedback.focus_areas.map(f => `<div class="focus-line">${f}</div>`).join('')}
      <div class="note">"${feedback.encouragement}"</div>
      <div class="btn-row">
        <button class="accent" onclick="saveAndContinue()">${continueLabel}</button>
      </div>
      <button class="secondary" onclick="repeatLesson()">Give me another rep of this lesson</button>
    `;
  } else if(uploadedImage){
    feedbackHtml = `
      <button onclick="getFeedback()">Get feedback on this page</button>
      <button class="secondary" onclick="repeatLesson()">Skip feedback, just give me another rep</button>
    `;
  }

  const remedialBanner = isRemedial
    ? `<div class="remedial-banner">🔁 Focused rep triggered — "${state.remedialTag.replace(/-/g,' ')}" has shown up ${state.struggleCounts[state.remedialTag] || REMEDIAL_THRESHOLD} times, so this round targets just that before moving on.</div>`
    : '';

  app.innerHTML = `
    <header>
      <div class="eyebrow"><span>Sketchbook</span><span>Lesson ${state.currentLesson+1} of ${CURRICULUM.length}${isRemedial ? ' · remedial' : ''}</span></div>
      <h1>Your drawing tutor</h1>
      <p class="tagline">A structured beginner curriculum with feedback after every page. Runs standalone with your own API key.</p>
      <div class="progress-row">${pegs}</div>
    </header>

    <div class="card">
      <div class="card-inner">
        ${renderKeySettings()}
      </div>
    </div>

    <div class="card ${isRemedial ? 'remedial' : ''}">
      <div class="card-inner">
        <div class="lesson-num ${isRemedial ? 'remedial' : ''}">${isRemedial ? 'Remedial rep' : 'Lesson ' + (state.currentLesson+1)}</div>
        <h2>${lesson.title}</h2>
        ${remedialBanner}
        <p class="why">${lesson.why}</p>
        ${renderVideoLinks()}
        <div class="task-box">${currentTaskHtml()}</div>
        ${uploadHtml}
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])"/>
        ${feedbackHtml}
        ${error ? `<div class="err">${error}</div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Trouble spots</div>
        <h2 style="font-size:18px;">Recurring struggles</h2>
        <div>${renderStruggleTags()}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Log</div>
        <h2 style="font-size:18px;">Session history</h2>
        <div>${renderHistory()}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="lesson-num">Backup</div>
        <h2 style="font-size:18px;">Move progress between devices/browsers</h2>
        <p class="key-note">Progress is tied to this exact page's origin (the URL/path it's opened from). If you ever open the file a different way and your lesson position looks reset, use this to carry it across — it does not include your API key.</p>
        <div class="btn-row">
          <button class="secondary" onclick="exportBackup()">Copy backup to clipboard</button>
          <button class="secondary" onclick="toggleImport()">Restore from backup</button>
        </div>
        ${showImport ? `
          <textarea id="importBox" class="key-input" rows="4" placeholder="Paste your backup text here"></textarea>
          <button onclick="importBackup()">Restore this backup</button>
        ` : ''}
        ${backupMessage ? `<p class="key-note">${backupMessage}</p>` : ''}
      </div>
    </div>

    <div class="reset-link"><a onclick="if(confirm('Reset all progress? This clears your lesson position and history.')) resetProgress()">Reset all progress</a></div>
  `;
}

loadState();
</script>
</body>
</html>
